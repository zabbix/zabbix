---
test case: "warning message is formatted with correct prefix and component"
in:
  level: LOG_LEVEL_WARNING
  component: "[123]: "
  message: "something happened"
out:
  captured: "Warning: [123]: something happened"
---
test case: "critical message is formatted with correct prefix"
in:
  level: LOG_LEVEL_CRIT
  component: ""
  message: "disk full"
out:
  captured: "ERROR: disk full"
---
test case: "information level message has no prefix"
in:
  level: LOG_LEVEL_INFORMATION
  component: ""
  message: "starting up"
out:
  captured: "starting up"
---
test case: "oversized message does not overflow the internal buffer"
in:
  level: LOG_LEVEL_WARNING
  component: "[1]: "
  oversized_length: 200000
