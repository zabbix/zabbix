---
test case: "basic HTTP with hostname"
in:
  url: "http://example.com"
out:
  return: SUCCEED
---
test case: "basic HTTPS with hostname"
in:
  url: "https://example.com"
out:
  return: SUCCEED
---
test case: "HTTP with IPv4"
in:
  url: "http://192.168.1.1"
out:
  return: SUCCEED
---
test case: "HTTPS with IPv4"
in:
  url: "https://10.0.0.1"
out:
  return: SUCCEED
---
test case: "HTTP with custom port"
in:
  url: "http://example.com:8080"
out:
  return: SUCCEED
---
test case: "HTTPS with custom port"
in:
  url: "https://proxy.domain.local:8443"
out:
  return: SUCCEED
---
test case: "HTTP with path"
in:
  url: "http://example.com/some/path"
out:
  return: SUCCEED
---
test case: "HTTPS with port and query string"
in:
  url: "https://example.com:9090/api?param=value"
out:
  return: SUCCEED
---
test case: "uppercase HTTP scheme"
in:
  url: "HTTP://example.com"
out:
  return: SUCCEED
---
