in:
  url: "ftp://example.com"
out:
  return: FAIL
---
test case: "no scheme"
in:
  url: "example.com"
out:
  return: FAIL
---
test case: "empty string"
in:
  url: ""
out:
  return: FAIL
---
test case: "missing host after scheme"
in:
  url: "http://"
out:
  return: FAIL
---
test case: "port zero"
in:
  url: "http://example.com:0"
out:
  return: FAIL
---
test case: "port above maximum"
in:
  url: "http://example.com:65536"
out:
  return: FAIL
---
test case: "scheme without double slash"
in:
  url: "http:example.com"
out:
  return: FAIL
---
