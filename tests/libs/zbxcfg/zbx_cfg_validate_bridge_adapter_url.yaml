  url: "HTTPS://example.com"
out:
  return: SUCCEED
---
test case: "mixed-case scheme"
in:
  url: "hTtPs://example.com"
out:
  return: SUCCEED
---
test case: "hyphenated hostname"
in:
  url: "http://my-proxy.domain.local"
out:
  return: SUCCEED
---
