in:
  url: "httpx://example.com"
out:
  return: FAIL
---
test case: "IPv6 in URL brackets not supported"
in:
  url: "http://[::1]:8080"
out:
  return: FAIL
---
test case: "URL fragment is accepted as path component"
in:
  url: "http://example.com#section"
out:
  return: SUCCEED
---
test case: "percent-encoded path is accepted"
in:
  url: "http://example.com/%2F/resource"
out:
  return: SUCCEED
---
test case: "underscore in hostname is valid"
in:
  url: "http://my_server.domain.local"
out:
  return: SUCCEED
---
test case: "exclamation mark in host fails hostname check"
in:
  url: "http://host!.example.com"
out:
  return: FAIL
---
test case: "percent sign in host fails hostname check"
in:
  url: "http://host%20name.example.com"
out:
  return: FAIL
---
test case: "at-sign credentials rejected by regex"
in:
  url: "http://user:pass@example.com"
out:
  return: FAIL
---
test case: "trailing colon without port digits rejected by regex"
in:
  url: "http://example.com:"
out:
  return: FAIL
---
test case: "space in host rejected by hostname check"
in:
  url: "http://host name.example.com"
out:
  return: FAIL
---
test case: "double-slash after host is treated as path"
in:
  url: "http://example.com//double/slash"
out:
  return: SUCCEED
---
test case: "purely numeric label is not a valid hostname"
in:
  url: "http://123.456.789"
out:
  return: FAIL
---
test case: "hostname starting with hyphen is invalid"
in:
  url: "http://-bad.example.com"
out:
  return: FAIL
---
test case: "hostname with double dot is invalid"
in:
  url: "http://host..example.com"
out:
  return: FAIL
