test case: early-exit - recent value in window short-circuits suppression
in:
  history:
  - itemid: 1
    value type: ITEM_VALUE_TYPE_UINT64
    data:
    - value: 1
      ts: 2000-01-01 00:00:00.000000000 +00:00
    - value: 2
      ts: 2020-06-15 12:00:00.000000000 +00:00
  time: 2020-06-15 12:00:00.000000000 +00:00
  params: '5m'
  proxyid: 1
  proxy_flags: [ZBX_PROXY_SUPPRESS_ACTIVE]
  proxy_lastaccess_age: 0
  tail_exists: 1
  tail_state: ITEM_STATE_NORMAL
  tail_flags: []
  tail_ts_offset: 0
out:
  return: SUCCEED
  value: 0
