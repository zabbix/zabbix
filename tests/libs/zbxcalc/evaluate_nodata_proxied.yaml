---
test case: proxied nodata(5m) no longer sticks forever on a metadata-only (NOVALUE) cached tail (covers log entries with metadata but no value, and preprocessing discarding the value)
in:
  history:
  - itemid: 1
    value type: ITEM_VALUE_TYPE_UINT64
    data:
    - value: 1
      ts: 2017-01-10 09:00:00.000000000 +00:00
  time: 2017-01-10 10:10:00.000000000 +00:00
  params: '5m'
  proxyid: 1
  proxy_flags: []
  proxy_lastaccess_age: 0
  tail_exists: 1
  tail_state: ITEM_STATE_NORMAL
  tail_flags: [ZBX_DC_FLAG_NOVALUE]
  tail_ts_offset: 0  # fresh, well inside the lookback window
out:
  return: SUCCEED
  value: 1
---
test case: proxied nodata(5m) no longer sticks forever on a stale real-value tail from before the window
in:
  history:
  - itemid: 1
    value type: ITEM_VALUE_TYPE_UINT64
    data:
    - value: 1
      ts: 2017-01-10 09:00:00.000000000 +00:00
  time: 2017-01-10 10:10:00.000000000 +00:00
  params: '5m'
  proxyid: 1
  proxy_flags: []
  proxy_lastaccess_age: 0
  tail_exists: 1
  tail_state: ITEM_STATE_NORMAL
  tail_flags: []
  tail_ts_offset: 301  # 1s older than the 300s (5m) lookback window start
out:
  return: SUCCEED
  value: 1
