---
test case: 1. multiple tokens
in:
  list: "a,b,ccc,ddd"
  delimiter: ','
out:
  tokens: [a, b, ccc, ddd]
---
test case: 2. single token, no delimiter present
in:
  list: "single"
  delimiter: ','
out:
  tokens: [single]
---
test case: 3. empty list has no tokens
in:
  list: ""
  delimiter: ','
out:
  tokens: []
---
test case: 4. trailing delimiter does produce a final empty token
in:
  list: "a,b,"
  delimiter: ','
out:
  tokens: [a, b,'']
---
test case: 5. leading delimiter produces a leading empty token
in:
  list: ",a,b"
  delimiter: ','
out:
  tokens: ['', a, b]
---
test case: 6. consecutive delimiters produce an empty token in between
in:
  list: "a,,b"
  delimiter: ','
out:
  tokens: [a, '', b]
---
test case: 7. list consisting of a single delimiter
in:
  list: ","
  delimiter: ','
out:
  tokens: ['','']
---
test case: 8. different delimiter character
in:
  list: "a;b;c"
  delimiter: ';'
out:
  tokens: [a, b, c]
---
test case: 9. no quote-awareness, delimiter inside quotes still splits
in:
  list: "value_types=\"uint,dbl\",url=http://localhost"
  delimiter: ','
out:
  tokens: ['value_types="uint', 'dbl"', 'url=http://localhost']
