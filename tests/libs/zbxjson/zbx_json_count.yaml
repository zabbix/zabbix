---
test case: empty object has zero elements
in:
  json: '{}'
out:
  count: 0
---
test case: object with one element
in:
  json: '{"a":1}'
out:
  count: 1
---
test case: object with three elements
in:
  json: '{"a":1,"b":2,"c":3}'
out:
  count: 3
---
test case: empty array has zero elements
in:
  json: '[]'
out:
  count: 0
---
test case: array with five elements
in:
  json: '[1,2,3,4,5]'
out:
  count: 5
---
test case: array with one element
in:
  json: '["only"]'
out:
  count: 1
---
test case: nested objects count top-level keys only
in:
  json: '{"outer1":{"inner1":1,"inner2":2},"outer2":{}}'
out:
  count: 2
---
test case: mixed types in array
in:
  json: '[1,"two",true,null,{}]'
out:
  count: 5
