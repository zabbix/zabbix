---
test case: "1. reading a control that no longer exists is rejected via ipmi_control_get_val(), not read via a stale pointer"
in:
  op: "read"
  is_readable: 1
  is_settable: 1
out:
  err_contains: "ipmi_control_get_val()"
---
test case: "2. setting a control that no longer exists is rejected via ipmi_control_set_val(), not set via a stale pointer"
in:
  op: "set"
  is_readable: 1
  is_settable: 1
out:
  err_contains: "ipmi_control_set_val()"
---
test case: "3. reading a non-readable control is rejected before touching the id"
in:
  op: "read"
  is_readable: 0
  is_settable: 1
out:
  err_contains: "not readable"
---
test case: "4. setting a non-settable control is rejected before touching the id"
in:
  op: "set"
  is_readable: 1
  is_settable: 0
out:
  err_contains: "not settable"
...
