---
test case: "Sensor deleted"
in:
  kind: sensor
  events:
    - {op: deleted, object: old}
out:
  count: 0
---
test case: "Sensor added again with the same ID is not duplicated"
in:
  kind: sensor
  events:
    - {op: added, object: old}
out:
  count: 1
---
test case: "Sensor replaced - new one added before the old one is deleted"
in:
  kind: sensor
  events:
    - {op: added, object: new}
    - {op: deleted, object: old}
out:
  count: 1
---
test case: "Sensor replaced, then the replacement deleted as well"
in:
  kind: sensor
  events:
    - {op: added, object: new}
    - {op: deleted, object: old}
    - {op: deleted, object: new}
out:
  count: 0
