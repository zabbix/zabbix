---
test case: "1. thresholds are not accessible at all - exits before touching the sensor"
in:
  thr_access: 0  # IPMI_THRESHOLD_ACCESS_SUPPORT_NONE
out:
  get_thresholds_calls: 0
---
test case: "2. thresholds are fixed (not readable) - exits before touching the sensor"
in:
  thr_access: 3  # IPMI_THRESHOLD_ACCESS_SUPPORT_FIXED
out:
  get_thresholds_calls: 0
---
test case: "3. thresholds are readable - requested through sensor_id via ipmi_sensor_id_get_thresholds()"
in:
  thr_access: 1  # IPMI_THRESHOLD_ACCESS_SUPPORT_READABLE
out:
  get_thresholds_calls: 1
...
