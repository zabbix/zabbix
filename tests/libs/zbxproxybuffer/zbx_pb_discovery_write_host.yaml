test case: write 0 host records - empty buffer, get_rows returns 0
in:
  ip: "192.168.1.1"
  dns: "host.example.com"
  error: ""
  rows: 0
out:
  rows: 0
---
test case: write 1 host with no error - dcheckid=0 port=0 value empty
in:
  ip: "192.168.1.1"
  dns: "host.example.com"
  error: ""
  rows: 1
out:
  rows: 1
---
test case: write 1 host with error message - error field preserved
in:
  ip: "10.0.0.5"
  dns: ""
  error: "connection refused"
  rows: 1
out:
  rows: 1
