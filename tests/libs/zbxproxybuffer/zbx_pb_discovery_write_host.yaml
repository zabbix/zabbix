---
# Regression tests for the crash fixed in commit 4bfdaaa0297: in
# pb_discovery_add_row_mem(), a shmem allocation failure partway through
# building a row must null out the fields not yet assigned, otherwise
# pb_list_free_discovery() frees pointers copied verbatim from the (unowned)
# source row. Each case fails the Nth shmem allocation made while flushing
# the 2 queued rows; the first row is discarded, but the second must still
# be written correctly afterwards, proving the failure did not corrupt the
# allocator or leak into subsequent writes.
test case: row allocation fails - nothing to free, second row still written
in:
  ip: "192.168.1.1"
  dns: "host.example.com"
  error: "connection refused"
  rows: 2
  fail_alloc_at: 1
out:
  rows: 1
---
