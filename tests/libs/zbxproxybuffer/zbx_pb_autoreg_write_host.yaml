# Allocation-failure coverage for pb_autoreg_add_row_mem() - parity with the
# pb_discovery_add_row_mem() regression tests. Each case fails the Nth shmem
# allocation made while writing the 2 rows below; the first row is
# discarded, but the second must still be written correctly afterwards,
# proving the failure did not corrupt the allocator or leak into subsequent
# writes.
test case: row allocation fails - nothing to free, second row still written
in:
  host: "allochost"
  ip: "192.168.6.6"
  dns: "allochost.lan"
  host_metadata: ""
  port: 10050
  flags: 0
  rows: 2
  fail_alloc_at: 1
out:
  rows: 1
