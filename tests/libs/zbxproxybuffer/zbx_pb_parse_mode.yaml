---
test case: NULL string defaults to disk mode
in: {}
out:
  result: SUCCEED
  mode: 0
---
test case: empty string defaults to disk mode
in:
  mode_str: ""
out:
  result: SUCCEED
  mode: 0
---
test case: explicit disk string
in:
  mode_str: "disk"
out:
  result: SUCCEED
  mode: 0
---
test case: memory string
in:
  mode_str: "memory"
out:
  result: SUCCEED
  mode: 1
---
test case: hybrid string
in:
  mode_str: "hybrid"
out:
  result: SUCCEED
  mode: 2
---
test case: unrecognized string returns FAIL
in:
  mode_str: "invalid"
out:
  result: FAIL
---
test case: uppercase DISK is not recognized
in:
  mode_str: "DISK"
out:
  result: FAIL
---
test case: mixed-case Memory is not recognized
in:
  mode_str: "Memory"
out:
  result: FAIL
---
test case: leading whitespace is not stripped
in:
  mode_str: " disk"
out:
  result: FAIL
---
test case: trailing whitespace is not stripped
in:
  mode_str: "disk "
out:
  result: FAIL
---
test case: prefix match is not accepted
in:
  mode_str: "memo"
out:
  result: FAIL
---
test case: hybrid with extra suffix is not accepted
in:
  mode_str: "hybrid1"
out:
  result: FAIL
