# Allocation-failure coverage for pb_history_add_row_mem() - parity with the
# pb_discovery_add_row_mem()/pb_autoreg_add_row_mem() regression tests. Each
# case fails the Nth shmem allocation made while writing the 2 rows below;
# the first row is discarded, but the second must still be written correctly
# afterwards, proving the failure did not corrupt the allocator or leak into
# subsequent writes.
test case: row allocation fails - nothing to free, second row still written
in:
  value: "42"
  rows: 2
  fail_alloc_at: 1
out:
  rows: 1
---
test case: value allocation fails - row must be freed, source is not set
in:
  value: "42"
  rows: 2
  fail_alloc_at: 2
out:
  rows: 1
---
test case: source allocation fails - row/value must be freed
in:
  value: "42"
  rows: 2
  fail_alloc_at: 3
out:
  rows: 1
---
test case: list insertion fails - fully-built row must still be freed
in:
  value: "42"
  rows: 2
  fail_alloc_at: 4
out:
  rows: 1
