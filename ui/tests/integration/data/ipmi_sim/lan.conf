name "zbxtest"

startlan 1
	addr __SIM_ADDR__ __SIM_PORT__
	priv_limit admin
	allowed_auths_admin none md5 straight
	allowed_auths_operator none md5 straight
	allowed_auths_user none md5 straight
endlan

user 1 true "" "" user 1
user 2 true "zbxipmi" "zbxipmipw" admin 4

# Without this hook, ipmi_sim rejects every Chassis Control (power/reset) command,
# which would make OpenIPMI's standard "power"/"reset" controls (lib/chassis.c) unsettable.
# __CHASSISCONTROL_SCRIPT__ is substituted with an absolute path at test runtime.
chassis_control "__CHASSISCONTROL_SCRIPT__ 0x20"
