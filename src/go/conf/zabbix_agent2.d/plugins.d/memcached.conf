### Option: Plugins.Memcached.Timeout
#	Legacy fallback timeout value. The maximum time (in seconds) for waiting when a request has to be done.
#
# Mandatory: no
# Range: 1-30
# Default:
# Plugins.Memcached.Timeout=<Global timeout>

### Option: Plugins.Memcached.KeepAlive
#	Time in seconds for waiting before unused connections will be closed.
#
# Mandatory: no
# Range: 60-900
# Default:
# Plugins.Memcached.KeepAlive=300

### Option: Plugins.Memcached.Sessions.*.Uri
#	Uri to connect. "*" should be replaced with a session name.
#
# Mandatory: no
# Range:
#   Must matches the URI format.
#   Supported schemas: "tcp" and "unix".
#   Embedded credentials will be ignored.
# Default:
# Plugins.Memcached.Sessions.*.Uri=

### Option: Plugins.Memcached.Sessions.*.User
#	Username to send to protected Memcached server. "*" should be replaced with a session name.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Sessions.*.User=

### Option: Plugins.Memcached.Sessions.*.Password
#	Password to send to protected Memcached server. "*" should be replaced with a session name.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Sessions.*.Password=

### Option: Plugins.Memcached.Sessions.*.ConnectionTimeout
#	The maximum time (in seconds) that the plugin will spend attempting to
#   establish a connection to the memcached service.
#   "*" should be replaced with a session name.
#   Can be set for all sessions in defaults.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Sessions.*.ConnectionTimeout=<Global timeout>

### Option: Plugins.Memcached.Default.Uri
#	Uri to connect. This value is used if no other is specified.
#
# Mandatory: no
# Range:
#   Must matches the URI format.
#   Supported schemas: "tcp" and "unix".
#   Embedded credentials will be ignored.
# Default:
# Plugins.Memcached.Default.Uri=

### Option: Plugins.Memcached.Default.User
#	Username to send to protected Memcached server. This value is used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Default.User=

### Option: Plugins.Memcached.Default.Password
#	Password to send to protected Memcached server. This value is used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Default.Password=

### Option: Plugins.Memcached.Default.ConnectionTimeout
#	The maximum time (in seconds) that the plugin will spend attempting to
#   establish a connection to the memcached service.
#   This value is used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.Memcached.Default.ConnectionTimeout=<Global timeout>
