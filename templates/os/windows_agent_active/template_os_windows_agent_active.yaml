              expression: 'min(/Windows by Zabbix agent active/defender.av.signature.age,5m)>{$WINDOWS.SECURITY.DEFENDER.SIGNATURE.MAX.WARN}'
              name: 'Windows: Defender signatures are out of date'
              event_name: 'Windows: Defender signatures are out of date (older than {$WINDOWS.SECURITY.DEFENDER.SIGNATURE.MAX.WARN}, current: {ITEM.VALUE1})'
              priority: WARNING
