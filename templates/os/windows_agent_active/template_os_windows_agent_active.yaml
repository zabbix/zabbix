              description: 'UEFI Secure Boot is disabled. It helps prevent malicious software from loading during the boot process. If this host legitimately runs without Secure Boot (e.g. legacy BIOS/CSM), set `{$WINDOWS.SECURITY.SECUREBOOT.IGNORE}=1`.'
              tags:
