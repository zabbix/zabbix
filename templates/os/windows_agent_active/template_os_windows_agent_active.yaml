        - uuid: 8957923572da4f7a8166e42f7c230bd6
          name: 'Windows updates: Last KB ID'
          type: DEPENDENT
          key: updates.kb.last.id
          value_type: CHAR
          description: 'The HotFixID of the most recently installed update.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function parseInstalledOn(installed_on) {
                    var date_string = String(installed_on),
                  	  dmtf_match = date_string.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.\d+([+-]\d+)?/),
                  	  short_match;
                  
                    if (dmtf_match) {
                  	return Date.UTC(+dmtf_match[1], +dmtf_match[2] - 1, +dmtf_match[3], +dmtf_match[4], +dmtf_match[5], +dmtf_match[6]) / 1000 - (dmtf_match[7] ? parseInt(dmtf_match[7], 10) : 0) * 60;
                    }
                  
                    short_match = date_string.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                  
                    if (short_match) {
                  	return Date.UTC(+short_match[3], +short_match[1] - 1, +short_match[2]) / 1000;
                    }
                  
                    return 0;
                  }
                  
                  var updates;
                  
                  try {
                    updates = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Last KB ID: cannot parse master JSON: ' + error);
                  
                    return 'Parse error';
                  }
                  
                  var latest_time = 0,
                  	latest_id = '';
                  
                  for (var i = 0; i < updates.length; i++) {
                    var installed_time = parseInstalledOn(updates[i].InstalledOn);
                  
                    if (installed_time >= latest_time) {
                  	latest_time = installed_time;
                  	latest_id = updates[i].HotFixID;
                    }
                  }
                  
                  return latest_id;
