        - uuid: dbde6e6c7c13436b9bd20230f1d309ed
          name: 'Windows services discovery'
          type: ZABBIX_ACTIVE
          key: service.discovery
          delay: 1h
          filter:
            evaltype: FORMULA
            formula: '(A and B and C and D and E and F) or G'
            conditions:
              - macro: '{#SERVICE.NAME}'
                value: '{$SERVICE.NAME.MATCHES}'
                formulaid: A
              - macro: '{#SERVICE.NAME}'
                value: '{$SERVICE.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#SERVICE.STARTUPNAME}'
                value: '{$SERVICE.STARTUPNAME.MATCHES}'
                formulaid: C
              - macro: '{#SERVICE.STARTUPNAME}'
                value: '{$SERVICE.STARTUPNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#SERVICE.STARTUPTRIGGER}'
                value: '{$SERVICE.STARTUPTRIGGER.MATCHES}'
                formulaid: E
              - macro: '{#SERVICE.STARTUPTRIGGER}'
                value: '{$SERVICE.STARTUPTRIGGER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#SERVICE.NAME}'
                value: '{$SERVICE.FORBIDDEN.MATCHES}'
                formulaid: G
          description: |
            Used for the discovery of Windows services of different types as defined in the template's macros.
            Services matching `{$SERVICE.FORBIDDEN.MATCHES}` are discovered regardless of their startup type, so that a service which must stay stopped can be watched as well.
          item_prototypes:
            - uuid: d6379e85f1974734abbe60fef1a6ca1d
              name: 'State of service "{#SERVICE.NAME}" ({#SERVICE.DISPLAYNAME})'
              type: ZABBIX_ACTIVE
              key: 'service.info["{#SERVICE.NAME}",state]'
              description: '{#SERVICE.DESCRIPTION}'
              valuemap:
                name: 'Windows service state'
              tags:
                - tag: component
                  value: system
                - tag: name
                  value: '{#SERVICE.DISPLAYNAME}'
                - tag: service
                  value: '{#SERVICE.NAME}'
              trigger_prototypes:
                - uuid: 949ffbf7daf24788b6f7f9be0750a2f7
                  expression: 'min(/Windows by Zabbix agent active/service.info["{#SERVICE.NAME}",state],#3)=0'
                  name: 'Windows: "{#SERVICE.NAME}" ({#SERVICE.DISPLAYNAME}) must not be running'
                  event_name: 'Windows: "{#SERVICE.NAME}" ({#SERVICE.DISPLAYNAME}) must not be running (startup type {#SERVICE.STARTUPNAME})'
                  discover: NO_DISCOVER
                  priority: WARNING
                  description: |
                    The service matches `{$SERVICE.FORBIDDEN.MATCHES}` and is expected to stay stopped, but it has been running for the last three times.
                    The trigger is discovered only for the services listed in that macro.
                  tags:
                    - tag: scope
                      value: security
          trigger_prototypes:
            - uuid: c6f2c1c32cdf401091e4439624a24fab
              expression: 'min(/Windows by Zabbix agent active/service.info["{#SERVICE.NAME}",state],#3)<>0 and last(/Windows by Zabbix agent active/system.uptime)>{$SERVICE.STARTUP.GRACE:"{#SERVICE.NAME}"}'
              name: 'Windows: "{#SERVICE.NAME}" ({#SERVICE.DISPLAYNAME}) is not running'
              event_name: 'Windows: "{#SERVICE.NAME}" ({#SERVICE.DISPLAYNAME}) is not running (startup type {#SERVICE.STARTUPNAME})'
              priority: AVERAGE
              description: |
                The service has a state other than "Running" for the last three times.
                The check is suppressed until the system uptime exceeds `{$SERVICE.STARTUP.GRACE}`, so that services with the "automatic delayed" startup type are given time to start after a reboot.
              tags:
                - tag: scope
                  value: notice
          overrides:
            - name: 'Services that must not run'
              step: '1'
              filter:
                conditions:
                  - macro: '{#SERVICE.NAME}'
                    value: '{$SERVICE.FORBIDDEN.MATCHES}'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'is not running'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'must not be running'
                  discover: DISCOVER
        - uuid: a12038f98c1849d3a8d20b143435a78f
          name: 'Windows scheduled tasks discovery'
          type: DEPENDENT
          key: task.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TASK.NAME}'
                value: '{$WINDOWS.TASK.NAME.MATCHES}'
              - macro: '{#TASK.NAME}'
                value: '{$WINDOWS.TASK.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#TASK.PATH}'
                value: '{$WINDOWS.TASK.PATH.MATCHES}'
              - macro: '{#TASK.PATH}'
                value: '{$WINDOWS.TASK.PATH.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            Discovery of Windows scheduled tasks. No task is discovered until `{$WINDOWS.TASK.NAME.MATCHES}` is set, because a stock Windows installation carries about 200 tasks.
            On hosts where the Task Scheduler WMI namespace is unavailable the master item returns an empty list, so no items are created instead of becoming unsupported.
          item_prototypes:
            - uuid: 84f6389b14354a3ba13b2af2c5cfa79d
              name: 'Scheduled task [{#TASK.PATH}{#TASK.NAME}]: State'
              type: DEPENDENT
              key: 'task.state["{#TASK.URI}"]'
              description: 'The current state of the "{#TASK.NAME}" scheduled task.'
              valuemap:
                name: 'Windows scheduled task state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.URI == "{#TASK.URI}")].State.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'wmi.getall[root\Microsoft\Windows\TaskScheduler,"select TaskName,TaskPath,State,URI from MSFT_ScheduledTask"]'
              tags:
                - tag: component
                  value: os
              trigger_prototypes:
                - uuid: 706e28152df84abb9c88ef0357c9d249
                  expression: '{$WINDOWS.TASK.CONTROL:"{#TASK.NAME}"}=1 and last(/Windows by Zabbix agent active/task.state["{#TASK.URI}"])=1'
                  name: 'Windows: Scheduled task [{#TASK.PATH}{#TASK.NAME}] is disabled'
                  priority: WARNING
                  description: 'The "{#TASK.NAME}" scheduled task is disabled and will not run.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
          master_item:
            key: 'wmi.getall[root\Microsoft\Windows\TaskScheduler,"select TaskName,TaskPath,State,URI from MSFT_ScheduledTask"]'
          lld_macro_paths:
            - lld_macro: '{#TASK.NAME}'
              path: $.TaskName
            - lld_macro: '{#TASK.PATH}'
              path: $.TaskPath
            - lld_macro: '{#TASK.URI}'
              path: $.URI
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 4fbbdf83609e48e68011f6c394c652f9
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: vfs.fs.dependent.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSDRIVETYPE}'
                value: '{$VFS.FS.FSDRIVETYPE.MATCHES}'
              - macro: '{#FSDRIVETYPE}'
                value: '{$VFS.FS.FSDRIVETYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.MATCHES}'
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.MATCHES}'
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery of filesystems of different types.'
          item_prototypes:
            - uuid: 821daa0e25a2456ca637e441a844dfe6
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space: Available'
              type: DEPENDENT
              key: 'vfs.fs.dependent.size[{#FSNAME},free]'
              units: B
              description: 'Available storage space expressed in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bytes.free
              master_item:
                key: 'vfs.fs.dependent[{#FSNAME},data]'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: fadaf46e6345401bb2f4555587190ad3
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space: Available, in %'
              type: DEPENDENT
              key: 'vfs.fs.dependent.size[{#FSNAME},pfree]'
              value_type: FLOAT
              units: '%'
              description: 'Calculated as the percentage of currently available space compared to the maximum available space.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bytes.pfree
              master_item:
                key: 'vfs.fs.dependent[{#FSNAME},data]'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: 8949201f93ab46f0a0ad95ca6ce6124c
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space: Used, in %'
              type: DEPENDENT
              key: 'vfs.fs.dependent.size[{#FSNAME},pused]'
              value_type: FLOAT
              units: '%'
              description: 'Calculated as the percentage of currently used space compared to the maximum available space.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bytes.pused
              master_item:
                key: 'vfs.fs.dependent[{#FSNAME},data]'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
              trigger_prototypes:
                - uuid: 5bed682545044584852888d96454df86
                  expression: '{$FSCONTROL:"{#FSNAME}"}=1 and min(/Windows by Zabbix agent active/vfs.fs.dependent.size[{#FSNAME},pused],5m)>{$VFS.FS.PUSED.MAX.CRIT:"{#FSLABEL}({#FSNAME})"}'
                  name: 'Windows: FS [{#FSLABEL}({#FSNAME})]: Space is critically low'
                  event_name: 'Windows: FS [{#FSLABEL}({#FSNAME})]: Space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSLABEL}({#FSNAME})"}%, total {{?last(//vfs.fs.dependent.size[{#FSNAME},total])/1024/1024/1024}.fmtnum(1)}GB)'
                  opdata: 'Space used: {{ITEM.LASTVALUE1}.fmtnum(1)}%'
                  priority: AVERAGE
                  description: |
                    The volume's space usage exceeds the `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%` limit.
                    The trigger expression is based on the current used and maximum available spaces.
                    Event name represents the total volume space, which can differ from the maximum available space, depending on the filesystem type.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: capacity
                - uuid: 1e5e9718c5a14099b9421ff7956b2f33
                  expression: '{$FSCONTROL:"{#FSNAME}"}=1 and min(/Windows by Zabbix agent active/vfs.fs.dependent.size[{#FSNAME},pused],5m)>{$VFS.FS.PUSED.MAX.WARN:"{#FSLABEL}({#FSNAME})"}'
                  name: 'Windows: FS [{#FSLABEL}({#FSNAME})]: Space is low'
                  event_name: 'Windows: FS [{#FSLABEL}({#FSNAME})]: Space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSLABEL}({#FSNAME})"}%, total {{?last(//vfs.fs.dependent.size[{#FSNAME},total])/1024/1024/1024}.fmtnum(1)}GB)'
                  opdata: 'Space used: {{ITEM.LASTVALUE1}.fmtnum(1)}%'
                  priority: WARNING
                  description: |
                    The volume's space usage exceeds the `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%` limit.
                    The trigger expression is based on the current used and maximum available spaces.
                    Event name represents the total volume space, which can differ from the maximum available space, depending on the filesystem type.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Windows: FS [{#FSLABEL}({#FSNAME})]: Space is critically low'
                      expression: '{$FSCONTROL:"{#FSNAME}"}=1 and min(/Windows by Zabbix agent active/vfs.fs.dependent.size[{#FSNAME},pused],5m)>{$VFS.FS.PUSED.MAX.CRIT:"{#FSLABEL}({#FSNAME})"}'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: capacity
            - uuid: d45f2c3469dd424486bdee586e4a61eb
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space: Total'
              type: DEPENDENT
              key: 'vfs.fs.dependent.size[{#FSNAME},total]'
              units: B
              description: 'Total space expressed in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bytes.total
              master_item:
                key: 'vfs.fs.dependent[{#FSNAME},data]'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: ddd24d7eaa5742ac9d6cbae42bcfa1ae
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space: Used'
              type: DEPENDENT
              key: 'vfs.fs.dependent.size[{#FSNAME},used]'
              units: B
              description: 'Used storage expressed in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bytes.used
              master_item:
                key: 'vfs.fs.dependent[{#FSNAME},data]'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
            - uuid: b9ad1677ea6841309c7dc3a304b61c37
              name: 'FS [{#FSLABEL}({#FSNAME})]: Get data'
              type: DEPENDENT
              key: 'vfs.fs.dependent[{#FSNAME},data]'
              history: '0'
              value_type: TEXT
              description: 'Intermediate data of `{#FSNAME}` filesystem.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.fsname==''{#FSNAME}'')].first()'
              master_item:
                key: vfs.fs.get
              tags:
                - tag: component
                  value: raw
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
                - tag: fstype
                  value: '{#FSTYPE}'
          graph_prototypes:
            - uuid: 478c7beb397a48318994fc96acc2c4da
              name: 'FS [{#FSLABEL}({#FSNAME})]: Space usage graph, in %'
              width: '600'
              height: '340'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - drawtype: FILLED_REGION
                  color: F63100
                  calc_fnc: ALL
                  item:
                    host: 'Windows by Zabbix agent active'
                    key: 'vfs.fs.dependent.size[{#FSNAME},pused]'
          master_item:
            key: vfs.fs.get
          lld_macro_paths:
            - lld_macro: '{#FSDRIVETYPE}'
              path: $.fsdrivetype
            - lld_macro: '{#FSLABEL}'
              path: $.fslabel
            - lld_macro: '{#FSNAME}'
              path: $.fsname
            - lld_macro: '{#FSTYPE}'
              path: $.fstype
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: os
        - tag: target
          value: windows
      macros:
        - macro: '{$AGENT.NODATA_TIMEOUT}'
          value: 30m
          description: 'No data timeout for active agents. Consider to keep it relatively high.'
          config:
            type: TEXT
            priority: '1'
            section_name: Thresholds
            label: 'Time since the last agent data was received'
            description: 'Threshold value of time since the last data was received from the agent.'
        - macro: '{$AGENT.TIMEOUT}'
          value: 5m
          description: 'Timeout after which agent is considered unavailable.'
          config:
            type: TEXT
            priority: '2'
            label: 'Seconds since the last Zabbix agent seen'
            description: 'Timeout after which agent is considered unavailable.'
        - macro: '{$CPU.INTERRUPT.CRIT.MAX}'
          value: '50'
          description: 'The critical threshold of the % Interrupt Time counter.'
          config:
            type: TEXT
            priority: '4'
            section_name: Thresholds
            label: 'Threshold for Interrupt Time counter (critical)'
            description: 'Critical threshold of the % Interrupt Time counter. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$CPU.PRIV.CRIT.MAX}'
          value: '30'
          description: 'The threshold of the % Privileged Time counter.'
          config:
            type: TEXT
            priority: '5'
            section_name: Thresholds
            label: 'Threshold for Privileged Time counter (critical)'
            description: 'Threshold of the % Privileged Time counter. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$CPU.QUEUE.CRIT.MAX}'
          value: '3'
          description: 'The threshold of the Processor Queue Length counter.'
          config:
            type: TEXT
            priority: '6'
            section_name: Thresholds
            label: 'Threshold for Processor Queue Length counter (critical)'
            description: 'Threshold of the Processor Queue Length counter. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'The critical threshold of the CPU utilization expressed in %.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Threshold of the CPU utilization'
            description: 'Critical threshold of the CPU utilization expressed in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$FSCONTROL}'
          value: '1'
          description: 'Macro for the filesystem space triggers. Can be used with the filesystem name as context.'
          config:
            type: CHECKBOX
            priority: '11'
            label: 'Filesystems control'
            description: 'Fire a trigger when the filesystem space usage exceeds the threshold.'
            options:
              - checked: '1'
                unchecked: '0'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold of error packet rate. Can be used with interface name as context.'
          config:
            type: TEXT
            priority: '27'
            section_name: Thresholds
            label: 'Threshold of error packet rate'
            description: 'Warning threshold of error packet rate. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Used as a threshold in the interface utilization trigger.'
          config:
            type: TEXT
            priority: '26'
            section_name: Thresholds
            label: 'The threshold in the interface utilization'
            description: 'Used as a threshold in the interface utilization trigger. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Macro for the interface operational state for the "link down" trigger. Can be used with interface name as context.'
          config:
            type: CHECKBOX
            priority: '25'
            label: 'Interfaces control'
            description: 'Fire a trigger when the interface operational status changes to "Link down".'
            options:
              - checked: '1'
                unchecked: '0'
        - macro: '{$MEM.PAGE_SEC.CRIT.MAX}'
          value: '1000'
          description: 'The warning threshold of the Memory Pages/sec counter.'
          config:
