              - macro: '{#FW.PROFILE}'
                value: '{$WINDOWS.SECURITY.FW.PROFILE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery of Windows Firewall profiles.'
