        - uuid: 20e246324f204da0a37a427fa31d67b0
          name: 'Windows Defender: Full scan age'
          type: DEPENDENT
          key: defender.fullscan.age
          value_type: FLOAT
          units: s
          description: 'Time since the last full scan. Reads as "Never scanned" if no full scan has ever run.'
          valuemap:
            name: 'Data quality'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var defender_label = 'full scan age',
                  	defender_field = 'FullScanAge';
                  
                  
                  var status;
                  
                  try {
                    status = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Defender ' + defender_label + ': cannot parse master JSON: ' + error);
                  
                    return -1;
                  }
                  
                  if (!status.length) {
                    return -3;
                  }
                  
                  var scan_days = Number(status[0][defender_field]);
                  
                  if (!isFinite(scan_days) || scan_days > 1e12) {
                    return -3;
                  }
                  
                  return scan_days * 86400;
          master_item:
            key: 'wmi.getall[root\Microsoft\Windows\Defender,"select AMServiceEnabled,AntispywareEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntispywareSignatureLastUpdated,AntivirusSignatureLastUpdated,QuickScanAge,FullScanAge,AntivirusSignatureVersion from MSFT_MpComputerStatus"]'
