            key: 'wmi.getall[root\CIMV2,"select Name,Description,LicenseStatus,PartialProductKey,GracePeriodRemaining,LicenseStatusReason from SoftwareLicensingProduct where PartialProductKey is not null and ApplicationID=''55c92734-d682-4d71-983e-d6ec3f16059f''"]'
