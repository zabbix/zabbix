        - uuid: 6e7f6c0f16c944b7aef02107c4ea8773
          name: 'Windows updates: Days since last KB'
          type: DEPENDENT
          key: updates.kb.days
          value_type: FLOAT
          description: 'The number of whole days since the most recently installed update.'
          valuemap:
            name: 'Data quality'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function parseInstalledOn(installed_on) {
                    var date_string = String(installed_on),
                  	  dmtf_match = date_string.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.\d+([+-]\d+)?/),
                  	  short_match;
                  
                    if (dmtf_match) {
                  	return Date.UTC(+dmtf_match[1], +dmtf_match[2] - 1, +dmtf_match[3], +dmtf_match[4], +dmtf_match[5], +dmtf_match[6]) / 1000 - (dmtf_match[7] ? parseInt(dmtf_match[7], 10) : 0) * 60;
                    }
                  
                    short_match = date_string.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                  
                    if (short_match) {
                  	return Date.UTC(+short_match[3], +short_match[1] - 1, +short_match[2]) / 1000;
                    }
                  
                    return 0;
                  }
                  
                  var updates;
                  
                  try {
                    updates = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Days since last KB: cannot parse master JSON: ' + error);
                  
                    return -1;
                  }
                  
                  if (!updates.length) {
                    return -4;
                  }
                  
                  var latest_time = 0;
                  
                  for (var i = 0; i < updates.length; i++) {
                    var installed_time = parseInstalledOn(updates[i].InstalledOn);
                  
                    if (installed_time > latest_time) {
                  	latest_time = installed_time;
                    }
                  }
                  
                  if (latest_time === 0) {
                    Zabbix.log(4, '[Windows] Days since last KB: unrecognized date/time format');
                  
                    return -2;
                  }
                  
                  return Math.floor((Date.now() / 1000 - latest_time) / 86400);
          master_item:
            key: 'wmi.getall[root\cimv2,"select HotFixID,Description,InstalledOn,Caption from Win32_QuickFixEngineering"]'
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: f51bd0fc119240eea087eba839aa37a2
              expression: 'last(/Windows by Zabbix agent/updates.kb.days)>{$WINDOWS.UPDATES.STALE.MAX.WARN}'
              name: 'Windows updates: No KB installed recently'
              event_name: 'Windows updates: No KB installed in the last {$WINDOWS.UPDATES.STALE.MAX.WARN} days (current: {ITEM.VALUE1} days)'
              priority: WARNING
              description: 'No Windows update (KB) has been installed within the configured number of days.'
              tags:
                - tag: scope
                  value: compliance
        - uuid: aa1d318755144c238023eface6290cf3
          name: 'Windows updates: Last KB install date'
