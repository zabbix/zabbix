        - uuid: 05cf5b47b3f74220805827b4d9500f68
          name: 'Windows Defender: Antispyware signature age'
          type: DEPENDENT
          key: defender.as.signature.age
          value_type: FLOAT
          units: s
          description: 'Time since the antispyware signatures were last updated.'
          valuemap:
            name: 'Data quality'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var defender_label = 'AS signature age',
                  	defender_field = 'AntispywareSignatureLastUpdated';
                  
                  
                  var status;
                  
                  try {
                    status = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Defender ' + defender_label + ': cannot parse master JSON: ' + error);
                  
                    return -1;
                  }
                  
                  if (!status.length) {
                    return 0;
                  }
                  
                  var updated_string = String(status[0][defender_field]),
                  	dmtf_match = updated_string.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.\d+([+-]\d+)?/);
                  
                  if (!dmtf_match) {
                    Zabbix.log(4, '[Windows] Defender ' + defender_label + ': unrecognized date/time format');
                  
                    return -2;
                  }
                  
                  var updated_epoch = Date.UTC(+dmtf_match[1], +dmtf_match[2] - 1, +dmtf_match[3], +dmtf_match[4], +dmtf_match[5], +dmtf_match[6]) / 1000;
                  
                  updated_epoch -= (dmtf_match[7] ? parseInt(dmtf_match[7], 10) : 0) * 60;
                  
                  var signature_age = Math.floor(Date.now() / 1000 - updated_epoch);
                  
                  return signature_age < 0 ? 0 : signature_age;
          master_item:
            key: 'wmi.getall[root\Microsoft\Windows\Defender,"select AMServiceEnabled,AntispywareEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntispywareSignatureLastUpdated,AntivirusSignatureLastUpdated,QuickScanAge,FullScanAge,AntivirusSignatureVersion from MSFT_MpComputerStatus"]'
          tags:
            - tag: component
              value: security
        - uuid: 2249750f6b0041a6ba86a012229ce2c5
          name: 'Windows Defender: Antivirus enabled'
