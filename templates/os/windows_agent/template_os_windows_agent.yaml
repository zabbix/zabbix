                  value: security
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: 227de49d38e247f9af2874f2bc71ddc8
              name: 'BitLocker [{#FSNAME}]: Encryption method'
              type: DEPENDENT
              key: 'bitlocker.method["{#FSNAME}"]'
              description: 'The BitLocker encryption method of volume "{#FSNAME}".'
              valuemap:
                name: 'BitLocker encryption method'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.DriveLetter == "{#FSNAME}")].EncryptionMethod.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'wmi.getall[root\CIMV2\Security\MicrosoftVolumeEncryption,"select DeviceID,DriveLetter,ProtectionStatus,EncryptionMethod,ConversionStatus,VolumeType,IsVolumeInitializedForProtection from Win32_EncryptableVolume"]'
              tags:
                - tag: component
                  value: security
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: 69a56079c43a444cb0d7754f10629f7a
              name: 'BitLocker [{#FSNAME}]: Protection status'
              type: DEPENDENT
              key: 'bitlocker.protection["{#FSNAME}"]'
              description: 'The BitLocker protection status of volume "{#FSNAME}".'
              valuemap:
                name: 'BitLocker protection status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.DriveLetter == "{#FSNAME}")].ProtectionStatus.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '2'
              master_item:
                key: 'wmi.getall[root\CIMV2\Security\MicrosoftVolumeEncryption,"select DeviceID,DriveLetter,ProtectionStatus,EncryptionMethod,ConversionStatus,VolumeType,IsVolumeInitializedForProtection from Win32_EncryptableVolume"]'
              tags:
                - tag: component
                  value: security
                - tag: filesystem
                  value: '{#FSNAME}'
              trigger_prototypes:
                - uuid: 90916f56419644babcc2dabfb7d00854
                  expression: 'last(/Windows by Zabbix agent/bitlocker.protection["{#FSNAME}"])<>1'
                  name: 'Windows: BitLocker [{#FSNAME}] is not enabled on enforced volume'
                  priority: AVERAGE
                  description: 'BitLocker protection is not enabled on volume "{#FSNAME}", which is required by `{$WINDOWS.SECURITY.BITLOCKER.ENFORCE.MATCHES}`.'
                  tags:
                    - tag: scope
                      value: security
          master_item:
            key: 'wmi.getall[root\CIMV2\Security\MicrosoftVolumeEncryption,"select DeviceID,DriveLetter,ProtectionStatus,EncryptionMethod,ConversionStatus,VolumeType,IsVolumeInitializedForProtection from Win32_EncryptableVolume"]'
          lld_macro_paths:
            - lld_macro: '{#FSNAME}'
              path: $.DriveLetter
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          overrides:
            - name: 'BitLocker enforce scope'
              step: '1'
              filter:
                conditions:
                  - macro: '{#FSNAME}'
                    value: '{$WINDOWS.SECURITY.BITLOCKER.ENFORCE.MATCHES}'
                    operator: NOT_MATCHES_REGEX
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
