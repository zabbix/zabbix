      discovery_rules:
        - uuid: f921597d1d2d4c7b8db28f6afd71e447
          name: 'Windows BitLocker: Volume discovery'
          type: DEPENDENT
          key: bitlocker.volume.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSNAME}'
                value: '{$WINDOWS.SECURITY.BITLOCKER.FSNAME.MATCHES}'
              - macro: '{#FSNAME}'
                value: '{$WINDOWS.SECURITY.BITLOCKER.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery of BitLocker encryptable volumes. On hosts where BitLocker is unavailable it returns no volumes, so the per-volume items are not created instead of becoming unsupported.'
          item_prototypes:
            - uuid: aa84e2ce448147deaa455cef8ad315b5
              name: 'BitLocker [{#FSNAME}]: Conversion status'
              type: DEPENDENT
              key: 'bitlocker.conversion["{#FSNAME}"]'
              description: 'The BitLocker conversion (encryption/decryption progress) status of volume "{#FSNAME}".'
              valuemap:
                name: 'BitLocker conversion status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.DriveLetter == "{#FSNAME}")].ConversionStatus.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'wmi.getall[root\CIMV2\Security\MicrosoftVolumeEncryption,"select DeviceID,DriveLetter,ProtectionStatus,EncryptionMethod,ConversionStatus,VolumeType,IsVolumeInitializedForProtection from Win32_EncryptableVolume"]'
              tags:
