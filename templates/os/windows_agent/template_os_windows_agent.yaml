        - uuid: 7669dba2bcaa4b869c69a79138f9605e
          name: 'Windows updates: Days since last Security KB'
          type: DEPENDENT
          key: updates.security.days
          value_type: FLOAT
          description: 'The number of whole days since the most recently installed "Security Update".'
          valuemap:
            name: 'Data quality'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function parseInstalledOn(installed_on) {
                    var date_string = String(installed_on),
                  	  dmtf_match = date_string.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.\d+([+-]\d+)?/),
                  	  short_match;
                  
                    if (dmtf_match) {
                  	return Date.UTC(+dmtf_match[1], +dmtf_match[2] - 1, +dmtf_match[3], +dmtf_match[4], +dmtf_match[5], +dmtf_match[6]) / 1000 - (dmtf_match[7] ? parseInt(dmtf_match[7], 10) : 0) * 60;
                    }
                  
                    short_match = date_string.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                  
                    if (short_match) {
                  	return Date.UTC(+short_match[3], +short_match[1] - 1, +short_match[2]) / 1000;
                    }
                  
                    return 0;
                  }
                  
                  var updates;
                  
                  try {
                    updates = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Days since last security KB: cannot parse master JSON: ' + error);
                  
                    return -1;
                  }
                  
                  var latest_time = 0,
                  	security_seen = 0;
                  
                  for (var i = 0; i < updates.length; i++) {
                    if (updates[i].Description !== 'Security Update') {
                  	continue;
                    }
                  
                    security_seen++;
                  
                    var installed_time = parseInstalledOn(updates[i].InstalledOn);
                  
                    if (installed_time > latest_time) {
                  	latest_time = installed_time;
                    }
                  }
                  
                  if (!security_seen) {
                    return -4;
                  }
                  
                  if (latest_time === 0) {
                    Zabbix.log(4, '[Windows] Days since last security KB: unrecognized date/time format');
                  
                    return -2;
                  }
                  
                  return Math.floor((Date.now() / 1000 - latest_time) / 86400);
