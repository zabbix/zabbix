                  var status;
                  
                  try {
                    status = JSON.parse(value);
                  } catch (error) {
                    Zabbix.log(4, '[Windows] Defender ' + defender_label + ': cannot parse master JSON: ' + error);
                  
                    return -1;
                  }
                  
                  if (!status.length) {
                    return 0;
                  }
                  
                  var updated_string = String(status[0][defender_field]),
                  	dmtf_match = updated_string.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.\d+([+-]\d+)?/);
                  
                  if (!dmtf_match) {
                    Zabbix.log(4, '[Windows] Defender ' + defender_label + ': unrecognized date/time format');
                  
                    return -2;
                  }
                  
                  var updated_epoch = Date.UTC(+dmtf_match[1], +dmtf_match[2] - 1, +dmtf_match[3], +dmtf_match[4], +dmtf_match[5], +dmtf_match[6]) / 1000;
                  
                  updated_epoch -= (dmtf_match[7] ? parseInt(dmtf_match[7], 10) : 0) * 60;
                  
                  var signature_age = Math.floor(Date.now() / 1000 - updated_epoch);
                  
