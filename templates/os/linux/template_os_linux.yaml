                    key: 'vfs.dev.write.rate[{#DEVNAME}]'
            - uuid: f20ff3626f5844d38978e91edc593c48
              name: '{#DEVNAME}: Disk read/write throughput'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Linux by Zabbix agent'
                    key: 'vfs.dev.read[{#DEVNAME}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: F63100
                  item:
                    host: 'Linux by Zabbix agent'
                    key: 'vfs.dev.write[{#DEVNAME}]'
            - uuid: c42e4045e0974e89a306c57fb188c4fa
              name: '{#DEVNAME}: Disk utilization and queue'
