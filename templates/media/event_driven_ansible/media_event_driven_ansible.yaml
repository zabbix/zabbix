zabbix_export:
  version: '7.4'
  media_types:
    - name: 'Event-Driven Ansible'
      type: WEBHOOK
      parameters:
        - name: acknowledged
          value: '{EVENT.ACK.STATUS}'
        - name: endpoint
          value: /endpoint
        - name: event_date
          value: '{EVENT.DATE}'
        - name: event_id
          value: '{EVENT.ID}'
        - name: event_name
          value: '{EVENT.NAME}'
        - name: event_nseverity
          value: '{EVENT.NSEVERITY}'
        - name: event_object
          value: '{EVENT.OBJECT}'
        - name: event_severity
          value: '{EVENT.SEVERITY}'
        - name: event_source
          value: '{EVENT.SOURCE}'
        - name: event_tags
          value: '{EVENT.TAGSJSON}'
        - name: event_time
          value: '{EVENT.TIME}'
        - name: event_value
          value: '{EVENT.VALUE}'
        - name: host_groups
          value: '{TRIGGER.HOSTGROUP.NAME}'
        - name: host_host
          value: '{HOST.HOST}'
        - name: host_id
          value: '{HOST.ID}'
        - name: host_ip
          value: '{HOST.IP}'
        - name: host_port
          value: '{HOST.PORT}'
        - name: HTTPProxy
        - name: monitoring_source
          value: 'Zabbix sever'
        - name: operation_data
          value: '{EVENT.OPDATA}'
        - name: send_to
          value: '{ALERT.SENDTO}'
        - name: subject
          value: '{ALERT.SUBJECT}'
        - name: tls_verify
          value: '{$HTTP.TLS.VERIFY:"Event-Driven Ansible"}'
        - name: trigger_description
          value: '{TRIGGER.DESCRIPTION}'
        - name: trigger_id
          value: '{TRIGGER.ID}'
        - name: trigger_name
          value: '{TRIGGER.NAME}'
      status: DISABLED
      script: |
        const CTlsConfig = function (raw_value) {
        	raw_value = String(raw_value).trim().toLowerCase();
        
        	if (['none', 'peer', 'full'].indexOf(raw_value) === -1) {
        		raw_value = 'full';
        	}
        
        	this.options = {
        		SSLVerifyPeer: (raw_value === 'peer' || raw_value === 'full'),
        		SSLVerifyHost: (raw_value === 'full')
        	};
        
        	this.enabled = (raw_value !== 'none');
        
        	this.checkURL = function (url) {
        		if (this.enabled && !/^https:\/\//i.test(url)) {
        			throw 'TLS certificate verification is enabled by {$' + 'HTTP.TLS.VERIFY}, but the URL uses plain HTTP: ' + url +
        			'. Use an "https://" URL, or set {$' + 'HTTP.TLS.VERIFY} to `none` to disable verification.';
        		}
        
        		return url;
        	};
        }
        
        
        var Eda = {
        	params: {},
        
        	setParams: function (params) {
        		var required_params = [
        				'send_to',
        				'event_source',
        				'event_value',
        				'event_date',
        				'event_time'],
        			integer_fields = [
        				'event_id',
        				'event_nseverity',
        				'event_object',
        				'event_source',
        				'event_value',
        				'host_id',
        				'trigger_id'];
        
        		required_params.forEach(function (field) {
        			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
        				throw 'Required param is not set: "' + field + '".';
        			}
        		});
        
        		Eda.params = params;
        
        		integer_fields.forEach(function (key) {
        				if (typeof Eda.params[key] !== 'undefined') {
        					if (isNaN(Eda.params[key])) {
        						throw 'Parameter "' + key + '" must be integer. Given value: ' + Eda.params[key];
        					}
        					Eda.params[key] = parseInt(Eda.params[key]);
        				}
        			});
        
        		if (params.event_source != 0) {
        			throw ('Incorrect "event_source" parameter given: ' + params.event_source
        				+ '\nOnly trigger-based events are supported');
        		}
        
        		if (params.event_source == 0 && params.event_value != 1) {
        			throw ('Incorrect "event_value" parameter given: "' + params.event_value
        				+ '".\nOnly trigger-based events of problem are supported');
        		}
        		
        		Eda.params.endpoint = (Eda.params.endpoint.startsWith('/'))
        				? Eda.params.endpoint : '/' + Eda.params.endpoint;
        		Eda.params.host_groups = (typeof Eda.params['host_groups'] !== 'undefined')
        				? this.prepareHostgroups(Eda.params.host_groups): []
        		Eda.params.event_tags = (typeof Eda.params['event_tags'] !== 'undefined')
        				? this.transformTags(Eda.params.event_tags): {}
        		Eda.params.event_datetime_timestamp = this.getTimestamp(
        			Eda.params.event_date, Eda.params.event_time)
        	},
        
        	setProxy: function (HTTPProxy) {
        		Eda.HTTPProxy = HTTPProxy;
        	},
        
        	prepareHostgroups: function (hostgroups) {
        		var host_groups = [];
        		hostgroups.split(',').forEach(function (group) {
        			group = group.trim();
        			if (group.length > 0) {
        				host_groups.push(group);
        			}
        		});
        		return host_groups;
        	},
        
        	getTimestamp: function (date, time) {
        		try {
        			return Date.parse(date.split('.').join('-') + 'T' + time + '.000Z') / 1000 + new Date().getTimezoneOffset() * 60;
        		} catch (_) {}
        	
        		throw ('Failed to parse event time.');
        	},
        
        	transformTags: function (event_tags) {
        		var tags = {};
        		if (event_tags) {
        			try {
        				JSON.parse(event_tags).forEach(function (object) {
        					var tag = object['tag'];
        					tags[tag] = tags[tag] || [];
        					tags[tag].push(object['value']);
        				});
        			} catch (error) {
        				throw 'Event tags format is invalid.';
        			}
        		}
        	
        		return tags;
        	},
        
        	sendMessage: function () {
        		var response, request = new HttpRequest(tls.options);
        		var url = Eda.params['send_to'] + Eda.params['endpoint'];
        		var data = JSON.stringify(Eda.params);
        		Zabbix.log(4, '[ Event-Driven Ansible webhook ] URL: ' + url + ' data: ' + data);
        		
        		if (typeof Eda.HTTPProxy !== 'undefined' && Eda.HTTPProxy !== '') {
        			request.setProxy(Eda.HTTPProxy);
        		}
        		request.addHeader('Content-Type: application/json');
        		response = request.post(tls.checkURL(url), data);
        		
        		Zabbix.log(4, '[ Event-Driven Ansible webhook ] HTTP code: ' + request.getStatus()
        			+ ' response: ' + response);
        
        		if (request.getStatus() !== 200) {
        			throw 'Request failed with status code ' + request.getStatus() + ': ' + response;
        		}
        	}
        };
        
        
        try {
        	var params = JSON.parse(value);
        	var tls = new CTlsConfig(params.tls_verify);
        	
        	Eda.setParams(params);
        	Eda.setProxy(params.HTTPProxy);
        	Eda.sendMessage();
        	return true;
        }
        catch (error) {
        	Zabbix.log(3, '[ Event-Driven Ansible webhook ] notification failed: ' + error);
        	throw 'Sending failed: ' + error;
        }
      message_templates:
        - event_source: TRIGGERS
          operation_mode: PROBLEM
          subject: 'Problem: {EVENT.NAME}'
          message: |
            Problem started at {EVENT.TIME} on {EVENT.DATE}
            Problem name: {EVENT.NAME}
            Host: {HOST.NAME}
            Severity: {EVENT.SEVERITY}
            Operational data: {EVENT.OPDATA}
            Original problem ID: {EVENT.ID}
            {TRIGGER.URL}
        - event_source: TRIGGERS
          operation_mode: RECOVERY
          subject: 'Resolved in {EVENT.DURATION}: {EVENT.NAME}'
          message: |
            Problem has been resolved in {EVENT.DURATION} at {EVENT.RECOVERY.TIME} on {EVENT.RECOVERY.DATE}
            Problem name: {EVENT.NAME}
            Host: {HOST.NAME}
            Severity: {EVENT.SEVERITY}
            Original problem ID: {EVENT.ID}
            {TRIGGER.URL}
        - event_source: TRIGGERS
          operation_mode: UPDATE
          subject: 'Updated problem in {EVENT.AGE}: {EVENT.NAME}'
          message: |
            {USER.FULLNAME} {EVENT.UPDATE.ACTION} problem at {EVENT.UPDATE.DATE} {EVENT.UPDATE.TIME}.
            {EVENT.UPDATE.MESSAGE}
            
            Current problem status is {EVENT.STATUS}, age is {EVENT.AGE}, acknowledged: {EVENT.ACK.STATUS}.
        - event_source: DISCOVERY
          operation_mode: PROBLEM
          subject: 'Discovery: {DISCOVERY.DEVICE.STATUS} {DISCOVERY.DEVICE.IPADDRESS}'
          message: |
            Discovery rule: {DISCOVERY.RULE.NAME}
            
            Device IP: {DISCOVERY.DEVICE.IPADDRESS}
            Device DNS: {DISCOVERY.DEVICE.DNS}
            Device status: {DISCOVERY.DEVICE.STATUS}
            Device uptime: {DISCOVERY.DEVICE.UPTIME}
            
            Device service name: {DISCOVERY.SERVICE.NAME}
            Device service port: {DISCOVERY.SERVICE.PORT}
            Device service status: {DISCOVERY.SERVICE.STATUS}
            Device service uptime: {DISCOVERY.SERVICE.UPTIME}
        - event_source: AUTOREGISTRATION
          operation_mode: PROBLEM
          subject: 'Autoregistration: {HOST.HOST}'
          message: |
            Host name: {HOST.HOST}
            Host IP: {HOST.IP}
            Agent port: {HOST.PORT}
        - event_source: INTERNAL
          operation_mode: PROBLEM
          subject: '[{EVENT.STATUS}] {EVENT.NAME}'
          message: |
            Problem started at {EVENT.TIME} on {EVENT.DATE}
            Problem name: {EVENT.NAME}
            Host: {HOST.NAME}
            Original problem ID: {EVENT.ID}
        - event_source: INTERNAL
          operation_mode: RECOVERY
          subject: '[{EVENT.STATUS}] {EVENT.NAME}'
          message: |
            Problem has been resolved in {EVENT.DURATION} at {EVENT.RECOVERY.TIME} on {EVENT.RECOVERY.DATE}
            Problem name: {EVENT.NAME}
            Host: {HOST.NAME}
            Original problem ID: {EVENT.ID}
        - event_source: SERVICE
          operation_mode: PROBLEM
          subject: 'Service "{SERVICE.NAME}" problem: {EVENT.NAME}'
          message: |
            Service problem started at {EVENT.TIME} on {EVENT.DATE}
            Service problem name: {EVENT.NAME}
            Service: {SERVICE.NAME}
            Severity: {EVENT.SEVERITY}
            Original problem ID: {EVENT.ID}
            Service description: {SERVICE.DESCRIPTION}
            
            {SERVICE.ROOTCAUSE}
        - event_source: SERVICE
          operation_mode: RECOVERY
          subject: 'Service "{SERVICE.NAME}" resolved in {EVENT.DURATION}: {EVENT.NAME}'
          message: |
            Service "{SERVICE.NAME}" has been resolved at {EVENT.RECOVERY.TIME} on {EVENT.RECOVERY.DATE}
            Problem name: {EVENT.NAME}
            Problem duration: {EVENT.DURATION}
            Severity: {EVENT.SEVERITY}
            Original problem ID: {EVENT.ID}
            Service description: {SERVICE.DESCRIPTION}
        - event_source: SERVICE
          operation_mode: UPDATE
          subject: 'Changed "{SERVICE.NAME}" service status to {EVENT.UPDATE.SEVERITY} in {EVENT.AGE}'
          message: |
            Changed "{SERVICE.NAME}" service status to {EVENT.UPDATE.SEVERITY} at {EVENT.UPDATE.DATE} {EVENT.UPDATE.TIME}.
            Current problem age is {EVENT.AGE}.
            Service description: {SERVICE.DESCRIPTION}
            
            {SERVICE.ROOTCAUSE}
