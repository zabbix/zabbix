# COMMENTS
# pgsql.archive.inventory.get - wal archive status overview
# pgsql.bgwriter.*.get - checkpoint and background writer stats
# pgsql.cache.hit - cache hit ratio percentage
# pgsql.config.hash - database config fingerprint
# pgsql.connections.sum.inventory.get - connection usage summary
# pgsql.db.size - database size query
# pgsql.dbstat.inventory.get - database activity stats per database
# pgsql.db.discovery - discovery database list
# pgsql.frozen.xid.get - transaction age safety percentage check
# pgsql.health.snapshot.get - database health stats
# pgsql.io.*.get - database io activity stats
# pgsql.latency.inventory.get - slow query performance summary
# pgsql.locks.inventory.get - database lock type summary
# pgsql.longest.running.query.data.get - longest running query details
# pgsql.oldest.active.xid - oldest transaction age tracker
# pgsql.ping - server readiness check
# pgsql.ping.time - database response check
# pgsql.relation.inventory.get - schema storage usage stats
# pgsql.replication.overview.get - replication status summary metrics
# pgsql.replication.process.inventory.get - replication lag per client connection
# pgsql.replication.slots.*.get - replication slots health summary
# pgsql.runtime.configuration.get - runtime configuration network
# pgsql.scans.get - table and index scan counts
# pgsql.security.access.get - security access settings
# pgsql.slru.above.13.discovery - slru discovery
# pgsql.slru.inventory.get - slru cache hit read stats
# pgsql.subscription.above.15.discovery - discovers logical replication subscriptions
# pgsql.subscription.above.15.get - logical replication subscription errors stats
# pgsql.tablespace.discovery - discovers tablespaces
# pgsql.tablespace.inventory.get - tablespace information summary
# pgsql.uptime - server uptime seconds
# pgsql.version.get - server version details
# pgsql.wal.overview.inventory.get - wal write receive count
# pgsql.wal.lifecycle.above.14.get - wal replication slots
# pgsql.workload.*.get - query performance statistics overview
