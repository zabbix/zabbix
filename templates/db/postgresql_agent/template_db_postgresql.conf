# =========================================================
#              [POSTGRESQL BY ZABBIX AGENT]
# =========================================================
# Content:
# [1] Instance
# [2] Connectivity
# [3] Database
# [4] Performance
# [5] Scans
# [6] Wraparound
# [7] Locks
# [8] Storage
# [9] WAL
# [10] Replication
