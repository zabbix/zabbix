            - type: JSONPATH
              parameters:
                - $.tcp_keepalives_count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: pgsql.runtime.network.get
          tags:
            - tag: component
              value: network
