        - uuid: 247d6634c445457f85d8347f32fbe863
          name: 'WAL statistics metrics discovery'
          type: DEPENDENT
          key: pgsql.stat.wal.discovery
          filter:
            conditions:
              - macro: '{#BELOW_V14}'
                value: 'false'
          description: 'Discovers the `pg_stat_wal` metrics available in PostgreSQL 14 and newer.'
          item_prototypes:
            - uuid: 1ec1b9068c834993bb47c54874d60013
              name: 'WAL statistics: Buffers full per second'
              type: DEPENDENT
              key: 'pgsql.stat.wal.buffers_full.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!times/s'
              description: 'Number of times per second the WAL buffers were full and had to be written out.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_buffers_full
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
              trigger_prototypes:
                - uuid: f023b83bbd6b472da61f4570075e57c5
                  expression: 'min(/PostgreSQL by Zabbix agent/pgsql.stat.wal.buffers_full.rate[{#SINGLETON}],15m) > {$PG.WAL.BUFFERS_FULL.MAX.WARN}'
                  name: 'PostgreSQL: WAL statistics: WAL buffers are full too often'
                  event_name: 'PostgreSQL: WAL statistics: WAL buffers are full too often (over {$PG.WAL.BUFFERS_FULL.MAX.WARN} per second for 15m)'
                  priority: WARNING
                  description: |
                    The WAL buffers are exhausted more than {$PG.WAL.BUFFERS_FULL.MAX.WARN} times per second, so backends have to flush WAL themselves instead of doing useful work.
                    Increasing `wal_buffers` usually removes the bottleneck.
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 71ebcac02fc049078e1a0ec508c5e428
              name: 'WAL statistics: Buffers full total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.buffers_full[{#SINGLETON}]'
              units: '!times'
              description: |
                Total number of times the WAL buffers were full and WAL had to be written out before the transaction could continue, since the last statistics reset.
                A growing value indicates WAL buffer pressure - consider increasing `wal_buffers`.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_buffers_full
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: e4c91eaa4d564c3a82ed806b8f5ff877
              name: 'WAL statistics: Bytes generated total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.bytes[{#SINGLETON}]'
              units: B
              description: 'Total amount of WAL generated since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_bytes
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 781f14c4a58b4c18993b31b856a3bf23
              name: 'WAL statistics: Full page images total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.fpi[{#SINGLETON}]'
              units: '!images'
              description: |
                Total number of full page images written to WAL since the last statistics reset.
                Full page images increase the WAL volume and are usually caused by frequent checkpoints.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_fpi
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 1652ee186d114bf2b3c05135b824aec5
              name: 'WAL statistics: Records total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.records[{#SINGLETON}]'
              units: '!records'
              description: 'Total number of WAL records generated since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_records
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 4d50696350f14987b95c3e3498a5fe27
              name: 'WAL statistics: Statistics reset time'
              type: DEPENDENT
              key: 'pgsql.stat.wal.reset_time[{#SINGLETON}]'
              units: unixtime
              description: 'Time of the last reset of the WAL statistics. The totals above are counted from this moment.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.stats_reset
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 7d
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 1cc6c7ddc3724cec9e73e35a5887394c
              name: 'WAL statistics: Get data'
              key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
              description: |
                Collects write-ahead log activity from `pg_stat_wal`:
                https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-WAL-VIEW
              tags:
                - tag: component
                  value: raw
          master_item:
            key: pgsql.version.validator
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 7d6134be7dd14ef5a410f61d87c60f5a
          name: 'Subscription discovery'
          type: DEPENDENT
          key: pgsql.subscription.discovery
          filter:
            conditions:
              - macro: '{#SUBNAME}'
                value: '{$PG.LLD.FILTER.SUBSCRIPTION}'
          description: 'Discovers the logical replication subscriptions of the instance.'
          item_prototypes:
            - uuid: 8eb4971db9094244b28586621d7e2cef
              name: 'Subscription [{#SUBNAME}]: Apply errors'
              type: DEPENDENT
              key: 'pgsql.subscription.apply_errors["{#SUBNAME}"]'
              units: '!errors'
              description: 'Number of errors that occurred while applying the changes received from the publisher, since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.apply_error_count
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
              trigger_prototypes:
                - uuid: 3a2ee50f002440b2a73e283b89c5a04c
                  expression: 'min(/PostgreSQL by Zabbix agent/pgsql.subscription.apply_errors["{#SUBNAME}"],5m) > {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"}'
                  name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while applying changes'
                  event_name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while applying changes (over {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"} for 5m)'
                  priority: WARNING
                  description: 'The subscription "{#SUBNAME}" fails to apply the changes it receives, so the subscriber data is drifting away from the publisher. Check the subscription worker errors in the PostgreSQL log.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 0da4a44a7ccb4ad68d2345574d00dbb1
              name: 'Subscription [{#SUBNAME}]: Get subscription stats'
              type: DEPENDENT
              key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              history: '0'
              value_type: TEXT
              description: 'Subscription stats of the "{#SUBNAME}" subscription.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.subname=="{#SUBNAME}")].first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'pgsql.subscription.stats["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
              tags:
                - tag: component
                  value: raw
                - tag: subscription
                  value: '{#SUBNAME}'
            - uuid: 12d2c83181f34b3c976efd13be429c5c
              name: 'Subscription [{#SUBNAME}]: Statistics reset time'
              type: DEPENDENT
              key: 'pgsql.subscription.reset_time["{#SUBNAME}"]'
              units: unixtime
              description: 'Time of the last reset of the subscription statistics. The error counters above are counted from this moment.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.stats_reset
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 7d
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
            - uuid: 8c924c21ef1b4de5bf52bb3024d13faa
              name: 'Subscription [{#SUBNAME}]: Sync errors'
              type: DEPENDENT
              key: 'pgsql.subscription.sync_errors["{#SUBNAME}"]'
              units: '!errors'
              description: 'Number of errors that occurred during the initial data copy of the subscribed tables, since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.sync_error_count
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
              trigger_prototypes:
                - uuid: 4ee36922bcb14be3af1b011fcdb7c7b9
                  expression: 'min(/PostgreSQL by Zabbix agent/pgsql.subscription.sync_errors["{#SUBNAME}"],5m) > {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"}'
                  name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while synchronizing tables'
                  event_name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while synchronizing tables (over {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"} for 5m)'
                  priority: WARNING
                  description: 'The initial table synchronization of the subscription "{#SUBNAME}" keeps failing, so the subscribed tables never reach a consistent state. Check the table sync worker errors in the PostgreSQL log.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: 'pgsql.subscription.stats["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          lld_macro_paths:
            - lld_macro: '{#SUBNAME}'
              path: $.subname
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
