              expression: 'min(/PostgreSQL by Zabbix agent/pgsql.health.max.xid.age,5m) >= {$PG.XID_MAX.AVG}'
              name: 'PostgreSQL: XID age average'
              event_name: 'PostgreSQL: XID age >= {$PG.XID_MAX.AVG}'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Oldest XID age >= `{$PG.XID_MAX.AVG}`. Ensure autovacuum is running properly; investigate long-running transactions.'
              dependencies:
