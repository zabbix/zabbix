        - uuid: 2d66e03329154262a1866e2045610736
          name: 'I/O metrics discovery (v18+)'
          type: DEPENDENT
          key: pgsql.io.above.18.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BELOW_V18}'
                value: 'false'
          description: 'Discovers `I/O` metrics in PostgreSQL 18 and above.'
          item_prototypes:
            - uuid: 42656fc0d5844f149da9627c8d991a73
              name: 'I/O: Get data'
              key: 'pgsql.io.above.18.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
              description: |
                Aggregated `pg_stat_io metrics` in PostgreSQL 18 and above.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              tags:
                - tag: component
                  value: io
                - tag: component
                  value: raw
                - tag: version
                  value: '{#PG_MAJOR}'
            - uuid: d45a1f146e3f47d792b19a3c994733b6
              name: 'I/O: Buffer hit ratio'
              type: DEPENDENT
              key: 'pgsql.io.hit.ratio.above.18[{#SINGLETON}]'
              value_type: FLOAT
              units: '%'
              description: |
                Percentage of buffer cache hits.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var reads = obj.reads || 0;
                      var hits = obj.hits || 0;
                      if (reads + hits === 0) return 0;
                      return (hits * 100) / (reads + hits);
              master_item:
                key: 'pgsql.io.above.18.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
