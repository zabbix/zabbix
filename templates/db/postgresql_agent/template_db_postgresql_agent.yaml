        - uuid: 511cfa03a12c4e969e3a759ac17704e6
          name: 'SLRU metrics discovery'
          type: DEPENDENT
          key: pgsql.stat.slru.discovery
          filter:
            conditions:
              - macro: '{#BELOW_V13}'
                value: 'false'
          description: 'Discovers the `pg_stat_slru` metrics available in PostgreSQL 13 and newer.'
          item_prototypes:
            - uuid: 6c46021f417b4ed68db79d653f4e4e96
              name: 'SLRU: Blocks hit total'
              type: DEPENDENT
              key: 'pgsql.stat.slru.blks_hit[{#SINGLETON}]'
              units: '!blocks'
              description: 'Total number of blocks found in the SLRU caches since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[*].blks_hit'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data,
                      	sum = 0,
                      	i;
                      
                      try {
                      	data = JSON.parse(value);
                      } catch (error) {
                      	throw 'Cannot parse the collected values as JSON: ' + value;
                      }
                      
                      if (!Array.isArray(data)) {
                      	throw 'Expected an array of values, got: ' + value;
                      }
                      
                      for (i = 0; i < data.length; i++) {
                      	sum += parseInt(data[i], 10);
                      }
                      
                      if (isNaN(sum)) {
                      	throw 'The collected values are not numbers: ' + value;
                      }
                      
                      return sum;
              master_item:
                key: 'pgsql.stat.slru["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
