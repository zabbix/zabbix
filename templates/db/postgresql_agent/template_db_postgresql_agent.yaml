        - uuid: a3ff6c8728794c3191a8eb3f05ec63ca
          name: 'Schema discovery'
          type: DEPENDENT
          key: pgsql.relation.discovery
          filter:
            conditions:
              - macro: '{#SCHEMA.NAME}'
                value: '{$PG.LLD.FILTER.SCHEMA}'
          description: 'Discovers the schemas of the "{$PG.DATABASE}" database, except the system ones.'
          item_prototypes:
            - uuid: 29b4665cb4374bfc935a70d3fc1b8572
              name: 'Schema [{#SCHEMA.NAME}]: Size'
              type: DEPENDENT
              key: 'pgsql.relation.size["{#SCHEMA.NAME}"]'
              units: B
              description: 'Total on-disk size of the tables of the schema "{#SCHEMA.NAME}", including their indexes and TOAST data.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name=="{#SCHEMA.NAME}")].total_bytes.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'pgsql.relation.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: schema
                  value: '{#SCHEMA.NAME}'
            - uuid: e881c62ef0694532a14f6dd3062428e0
              name: 'Schema [{#SCHEMA.NAME}]: Number of tables'
              type: DEPENDENT
              key: 'pgsql.relation.tables["{#SCHEMA.NAME}"]'
              units: '!tables'
              description: 'Number of tables in the schema "{#SCHEMA.NAME}", partitioned tables included.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name=="{#SCHEMA.NAME}")].table_count.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'pgsql.relation.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: schema
                  value: '{#SCHEMA.NAME}'
          master_item:
            key: 'pgsql.relation.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          lld_macro_paths:
            - lld_macro: '{#SCHEMA.NAME}'
              path: $.name
