          master_item:
            key: 'pgsql.runtime.inventory.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: network
            - tag: component
              value: raw
            - tag: component
              value: runtime
        - uuid: e5c0d560ed104a0fb157171ce972c4c4
          name: 'Runtime: Network: TCP keepalive total time'
          type: CALCULATED
          key: pgsql.runtime.network.tcp.keepalive.total
          value_type: FLOAT
          units: s
          params: 'last(//pgsql.runtime.network.tcp.keepalives.count) * last(//pgsql.runtime.network.tcp.keepalives.interval)'
          description: 'Total time before a TCP connection is considered dead based on keepalive settings.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          tags:
            - tag: component
              value: network
            - tag: component
              value: runtime
        - uuid: 7b77266fc2f14dd3aaa500bb7f5f6138
          name: 'Runtime: Network: TCP keepalives count'
          type: DEPENDENT
          key: pgsql.runtime.network.tcp.keepalives.count
          units: '!probes'
          description: |
            Number of keepalive probes sent before connection failure:
            0 - disabled (no keepalive probes)
            > 0 - probes before connection is considered lost
          preprocessing:
