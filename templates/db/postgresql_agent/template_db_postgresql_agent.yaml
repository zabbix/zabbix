        - uuid: 4a174c56bb5e429fa4224d613ed64a0f
          name: 'Health: Buffer hit ratio'
          type: DEPENDENT
          key: pgsql.health.cache.hit.ratio
          value_type: FLOAT
          units: '%'
          description: |
            Percentage of data served from memory cache. 
            Low values indicate more disk I/O and potential performance pressure.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cache_hit_ratio
          master_item:
            key: 'pgsql.health.snapshot.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: buffer
            - tag: component
              value: health
          triggers:
            - uuid: 70786e21199c41cfa24dc4eca1ced0f4
              expression: 'max(/PostgreSQL by Zabbix agent/pgsql.health.cache.hit.ratio,5m) <= {$PG.HEALTH.CACHE.AVG}'
              name: 'PostgreSQL: Health: Buffer hit average'
              event_name: 'PostgreSQL: Buffer hit ratio <= {$PG.HEALTH.CACHE.AVG}% for 5m'
              opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Buffer hit ratio <= `{$PG.HEALTH.CACHE.AVG}`%. Low cache efficiency, potential I/O pressure. Investigate frequently used queries.'
              dependencies:
                - name: 'PostgreSQL: Health: Buffer hit high'
                  expression: 'max(/PostgreSQL by Zabbix agent/pgsql.health.cache.hit.ratio,5m) <= {$PG.HEALTH.CACHE.HIGH}'
              tags:
                - tag: scope
                  value: performance
            - uuid: f28980b8394541d4889a0e9ab7628523
              expression: 'max(/PostgreSQL by Zabbix agent/pgsql.health.cache.hit.ratio,5m) <= {$PG.HEALTH.CACHE.HIGH}'
              name: 'PostgreSQL: Health: Buffer hit high'
              event_name: 'PostgreSQL: Buffer hit ratio <= {$PG.HEALTH.CACHE.HIGH}% for 5m'
              opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Buffer hit ratio <= `{$PG.HEALTH.CACHE.HIGH}`%. Very low cache efficiency. High I/O load expected. Investigate hot queries and disk usage immediately.'
              tags:
                - tag: scope
                  value: performance
            - uuid: faa7d65920d34a67a3eb3c4234839268
              expression: 'max(/PostgreSQL by Zabbix agent/pgsql.health.cache.hit.ratio,5m) <= {$PG.HEALTH.CACHE.WARN}'
              name: 'PostgreSQL: Health: Buffer hit warning'
              event_name: 'PostgreSQL: Buffer hit ratio <= {$PG.HEALTH.CACHE.WARN}% for 5m'
              opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Buffer hit ratio <= `{$PG.HEALTH.CACHE.WARN}`%. Slightly below optimal. Monitor I/O and queries.'
              dependencies:
                - name: 'PostgreSQL: Health: Buffer hit average'
                  expression: 'max(/PostgreSQL by Zabbix agent/pgsql.health.cache.hit.ratio,5m) <= {$PG.HEALTH.CACHE.AVG}'
              tags:
                - tag: scope
                  value: performance
