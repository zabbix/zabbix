        - uuid: cce05807198a4ba98490f944a8778b2e
          name: 'I/O metrics discovery'
          type: DEPENDENT
          key: pgsql.stat.io.discovery
          filter:
            conditions:
              - macro: '{#BELOW_V16}'
                value: 'false'
          description: 'Discovers the `pg_stat_io` metrics available in PostgreSQL 16 and newer.'
          item_prototypes:
            - uuid: 036ef8b9194d46f0a27bcf02689a2b48
              name: 'I/O: Fsyncs per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.fsyncs.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!fsyncs/s'
              description: |
                Number of `fsync` calls per second issued by the instance.
                Most of them are normally done by the checkpointer, so a high rate from other backends points at a checkpoint or WAL configuration problem.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.fsyncs
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: a05057f630ba4bf9866aeade55b8b85f
              name: 'I/O: Buffer hit ratio'
              type: DEPENDENT
              key: 'pgsql.stat.io.hit_ratio[{#SINGLETON}]'
              value_type: FLOAT
              units: '%'
              description: |
                Percentage of the block requests served from the shared buffers instead of the storage, since the last statistics reset.
                A low value means the working set does not fit into `shared_buffers`.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data,
                      	hits,
                      	reads;
                      
                      try {
                      	data = JSON.parse(value);
                      } catch (error) {
                      	throw 'Cannot parse the I/O statistics as JSON: ' + value;
                      }
                      
                      if (data === null || typeof data !== 'object') {
                      	throw 'Expected the I/O statistics as an object, got: ' + value;
                      }
                      
                      hits = parseInt(data.hits, 10);
                      reads = parseInt(data.reads, 10);
                      
                      if (isNaN(hits) || isNaN(reads)) {
                      	throw 'The I/O statistics have no hit or read counters: ' + value;
                      }
                      
                      if (hits + reads === 0) {
                      	return 100;
                      }
                      
                      return 100 * hits / (hits + reads);
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
              trigger_prototypes:
                - uuid: 2f35b9cbcd52465cbcc1df60fd7e16cc
                  expression: 'max(/PostgreSQL by Zabbix agent/pgsql.stat.io.hit_ratio[{#SINGLETON}],15m) < {$PG.IO.CACHE.MIN.WARN}'
                  name: 'PostgreSQL: I/O: Buffer hit ratio too low'
                  event_name: 'PostgreSQL: I/O: Buffer hit ratio too low (under {$PG.IO.CACHE.MIN.WARN}% for 15m)'
                  priority: WARNING
                  description: 'Less than {$PG.IO.CACHE.MIN.WARN}% of the block requests are served from the shared buffers, so the instance keeps going to the storage for data. Consider increasing `shared_buffers` or reviewing the queries that read the most data.'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 37a18b76bcd64f9eb1dd11bfa2fcc81c
              name: 'I/O: Reads per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.reads.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!reads/s'
              description: 'Number of read operations per second the instance issues to the storage. Reads mean the data was not found in the shared buffers.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.reads
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: d88a5c8de11648b3a8efbad0a667ebb6
              name: 'I/O: Read per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.read_bytes.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: Bps
              description: 'Amount of data per second the instance reads from the storage.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.read_bytes
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: e1b05a7efa7f4e4b949edc9df88f6db1
              name: 'I/O: Time spent per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.time.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: s
              description: |
                Time per second the instance spends waiting for reads and writes to complete.
                Requires `track_io_timing` to be enabled, otherwise it stays at zero.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.io_time_ms
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: bfcdd08812c048538fdab2555c2d0e5d
              name: 'I/O: Writes per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.writes.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!writes/s'
              description: 'Number of write operations per second the instance issues to the storage.'
              preprocessing:
                - type: JSONPATH
                  parameters:
