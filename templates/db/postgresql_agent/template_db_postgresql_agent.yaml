              tags:
                - tag: component
                  value: io
            - uuid: 60e871edb7de4f6590017bb220f5a4b7
              name: 'I/O: Get data'
              key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
              description: |
                Collects the I/O activity of the instance from `pg_stat_io`:
                https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-IO-VIEW
              tags:
                - tag: component
                  value: raw
          master_item:
            key: pgsql.version.validator
          preprocessing:
