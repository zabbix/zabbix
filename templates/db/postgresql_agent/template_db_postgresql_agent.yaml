              units: '!blocks'
              description: 'Total number of dirty SLRU blocks written to disk since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[*].blks_written'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data,
                      	sum = 0,
