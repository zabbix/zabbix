        - uuid: a7c778e144c042ffa0e113f8f60de8fb
          name: 'Get replication process inventory'
          key: 'pgsql.replication.process.inventory.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          history: '0'
          value_type: TEXT
          description: 'Collects WAL sender replication metrics from `pg_stat_replication`.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	JSON.parse(value);
                  	return value;
                  } catch (e) {
                  	return null;
                  }
          tags:
            - tag: component
              value: raw
        - uuid: 78dac3667fb140e1ba91478174fb4e24
          name: 'Replication overview: Recovery role'
          type: DEPENDENT
          key: pgsql.replication.recovery.role
          description: |
            Replication role:
            0 - Primary (master server, sends data)
            1 - Standby (replica server, receives data)
          valuemap:
            name: 'PostgreSQL recovery role'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.recovery_role
          master_item:
            key: 'pgsql.replication.overview.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{$PG.QUERY_EXECUTION_TIME.MAX.WARN}"]'
        - uuid: c10b433628c647daa2fa0dc41de2c3f9
          name: 'Replication overview: Status'
          type: DEPENDENT
          key: pgsql.replication.status
          description: |
            Shows replication streaming state:
            0 - Disabled (replication is disabled)
            1 - Enabled (replication is enabled)
            2 - Standalone (primary with no replicas)
          valuemap:
            name: 'PostgreSQL replication status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.replication_status
          master_item:
            key: 'pgsql.replication.overview.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{$PG.QUERY_EXECUTION_TIME.MAX.WARN}"]'
          triggers:
            - uuid: aef1e1d2bab540f8ab738b4a3fad863c
              expression: 'max(/PostgreSQL by Zabbix agent/pgsql.replication.status,5m)=0'
              name: 'PostgreSQL: Replication is down'
              priority: AVERAGE
              description: 'Replication is enabled and data streaming was down for 5m.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8d7d2aae866945608fc76a15262a7f7e
