                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: b4e4e54fed08440381a3e411459fc8f2
              name: 'I/O: Written per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.write_bytes.rate[{#SINGLETON}]'
              value_type: FLOAT
