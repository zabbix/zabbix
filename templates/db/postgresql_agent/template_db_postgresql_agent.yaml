        - uuid: 25a28a5180374dd2b1e4afed7a9c69e3
          name: 'LRQ: Get data'
          key: 'pgsql.longest.running.query.data.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          delay: 15s
          history: '0'
          value_type: TEXT
          description: 'Returns data about the currently active LRQ (Longest Running Query) and its execution duration from `pg_stat_activity`.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: raw
        - uuid: 6b7fda83070c459c9eb89467f651f1e8
          name: 'LRQ: Duration'
          type: DEPENDENT
          key: pgsql.longest.running.query.duration
          value_type: FLOAT
          units: s
          description: 'Duration of the current LRQ (Longest Running Query).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.duration
            - type: CHECK_REGEX_ERROR
              parameters:
                - '^-\d+(\.\d+)?$'
                - \0
              error_handler: DISCARD_VALUE
          master_item:
            key: 'pgsql.longest.running.query.data.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: LRQ
          triggers:
            - uuid: 7006a0b1ac024f5a9df76a5144c537a8
              expression: 'last(/PostgreSQL by Zabbix agent/pgsql.longest.running.query.duration) >= {$PG.LRQ.TIME.AVG}'
              name: 'PostgreSQL: LRQ duration average'
              opdata: 'Running time: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Query running longer than `{$PG.LRQ.TIME.AVG}` seconds; check `pg_stat_activity`, optimize or index if needed, and cancel if blocking critical operations.'
              dependencies:
                - name: 'PostgreSQL: LRQ duration high'
                  expression: 'last(/PostgreSQL by Zabbix agent/pgsql.longest.running.query.duration) >= {$PG.LRQ.TIME.HIGH}'
              tags:
                - tag: scope
                  value: performance
            - uuid: df4da88fd5194cedbba267aef37f8ba2
              expression: 'last(/PostgreSQL by Zabbix agent/pgsql.longest.running.query.duration) >= {$PG.LRQ.TIME.HIGH}'
              name: 'PostgreSQL: LRQ duration high'
              opdata: 'Running time: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Query running longer than `{$PG.LRQ.TIME.HIGH}` seconds; check `pg_stat_activity`, optimize or index if needed, and cancel if blocking critical operations.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 93156b49fa764e8c96ccf9399a817763
          name: 'LRQ: Query name'
          type: DEPENDENT
          key: pgsql.longest.running.query.name
          value_type: TEXT
          description: |
            Query name of the current LRQ (Longest Running Query).
            The value represents a shortened form of the active query to improve readability in the UI.
            Note:
            Query text is normalized (whitespace collapsed) and shortened to the first two words followed by "...".
            Returns `no query` if no usable query is available.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.query
            - type: REGEX
              parameters:
                - '^\s*([^\s]+)\s+([^\s]+).*'
                - '\1 \2...'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'no query'
          master_item:
            key: 'pgsql.longest.running.query.data.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: LRQ
        - uuid: fe5b155580e04cd1b6aea95024fd32c6
          name: 'LRQ: PID'
          type: DEPENDENT
          key: pgsql.longest.running.query.pid
          description: 'PID of the current LRQ (Longest Running Query).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.pid
          master_item:
            key: 'pgsql.longest.running.query.data.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: LRQ
        - uuid: 2469ad8e0e414fbb8c929f5f034ea694
          name: 'Oldest active XID'
          key: 'pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          units: '!transactions'
          description: 'Age of the oldest active transaction (XID) among live backends.'
          tags:
            - tag: component
              value: XID
          triggers:
            - uuid: d0e6025770b1414791eb6e1b2e4c8cb0
              expression: 'min(/PostgreSQL by Zabbix agent/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.AVG}'
              name: 'PostgreSQL: Oldest active XID average'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.AVG} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.AVG}`. Check for long-running transactions.'
              dependencies:
                - name: 'PostgreSQL: Oldest active XID high'
                  expression: 'min(/PostgreSQL by Zabbix agent/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.HIGH}'
              tags:
                - tag: scope
                  value: performance
            - uuid: 95a3a8b007ab4118b2970a72b597431d
              expression: 'min(/PostgreSQL by Zabbix agent/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.HIGH}'
              name: 'PostgreSQL: Oldest active XID high'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.HIGH} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.HIGH}`. Investigate immediately.'
              tags:
                - tag: scope
                  value: performance
            - uuid: 14930e7d81744278abd5ac83b4cb400d
              expression: 'min(/PostgreSQL by Zabbix agent/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.WARN}'
              name: 'PostgreSQL: Oldest active XID warning'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.WARN} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.WARN}`. Monitor long transactions.'
              dependencies:
                - name: 'PostgreSQL: Oldest active XID average'
                  expression: 'min(/PostgreSQL by Zabbix agent/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.AVG}'
              tags:
                - tag: scope
                  value: performance
        - uuid: f42bd73b3af6451b8a3a6113dcc1b675
          name: 'Ping time'
          key: 'pgsql.ping.time["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          value_type: FLOAT
          units: s
          description: 'Used to get the `SELECT 1` query execution time.'
          preprocessing:
            - type: REGEX
              parameters:
                - 'Time:\s+(\d+\.\d+)\s+ms'
                - \1
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
          triggers:
            - uuid: e19b5630737b4c63886b5df77a3c748c
              expression: 'min(/PostgreSQL by Zabbix agent/pgsql.ping.time["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],5m) > {$PG.PING_TIME.MAX.WARN}'
              name: 'PostgreSQL: Response too long'
              event_name: 'PostgreSQL: Response too long (over {$PG.PING_TIME.MAX.WARN})'
              priority: AVERAGE
              description: 'Response is taking too long (over {$PG.PING_TIME.MAX.WARN} for 5m).'
              dependencies:
                - name: 'PostgreSQL: Server is down'
                  expression: 'last(/PostgreSQL by Zabbix agent/pgsql.ping["{$PG.HOST}","{$PG.PORT}"]) = 0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: f5bd615243b344cb88dac1e83436cc85
          name: Ping
          key: 'pgsql.ping["{$PG.HOST}","{$PG.PORT}"]'
          description: 'PostgreSQL server availability check. Returns `0` if the query fails.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.search(/accepting connections/)>0 ? 1 : 0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
          triggers:
            - uuid: 6d9c2b5353ce4f6baeeb0f254fb7d1e2
              expression: 'last(/PostgreSQL by Zabbix agent/pgsql.ping["{$PG.HOST}","{$PG.PORT}"]) = 0'
              name: 'PostgreSQL: Server is down'
              priority: HIGH
              description: 'Last test of a connection was unsuccessful.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 1b69d5501c0543199eda700464dfc48b
          name: 'Get relation inventory'
          key: 'pgsql.relation.inventory.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          delay: 25m
          history: '0'
          value_type: TEXT
          description: 'Collects `relation size` metrics from the primary core database.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var arr = [];
                  for (var key in obj) {
                  arr.push({
                  	"name": key,
                  	"database_name": obj[key].database_name,
                  	"total_bytes": obj[key].total_bytes,
                  	"table_count": obj[key].table_count
                  });
                  }
                  return JSON.stringify(arr);
          tags:
            - tag: component
              value: raw
