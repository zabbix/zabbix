                  priority: HIGH
                  description: 'The SLRU caches serve less than {$PG.SLRU.CACHE.MIN.HIGH}% of their lookups from memory, so the instance is doing significant extra I/O for transaction status lookups.'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: eb9144b3c895444b8faa697858179fc7
                  expression: 'max(/PostgreSQL by Zabbix agent/pgsql.stat.slru.hit_ratio[{#SINGLETON}],5m) < {$PG.SLRU.CACHE.MIN.WARN}'
                  name: 'PostgreSQL: SLRU: Cache hit ratio too low'
                  event_name: 'PostgreSQL: SLRU: Cache hit ratio too low (under {$PG.SLRU.CACHE.MIN.WARN}% for 5m)'
                  priority: WARNING
                  description: 'The SLRU caches serve less than {$PG.SLRU.CACHE.MIN.WARN}% of their lookups from memory. Check the disk load and the concurrency of transactions using multixacts (`SELECT ... FOR SHARE`, subtransactions).'
                  dependencies:
                    - name: 'PostgreSQL: SLRU: Cache hit ratio is critically low'
                      expression: 'max(/PostgreSQL by Zabbix agent/pgsql.stat.slru.hit_ratio[{#SINGLETON}],5m) < {$PG.SLRU.CACHE.MIN.HIGH}'
                  tags:
