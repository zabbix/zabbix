          triggers:
            - uuid: 4cec152ff7394bd9a5b5097d6c3cc668
              expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.ping.time["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],5m) > {$PG.PING_TIME.MAX.WARN}'
              name: 'PostgreSQL: Response too long'
              event_name: 'PostgreSQL: Response too long (over {$PG.PING_TIME.MAX.WARN})'
              priority: AVERAGE
              description: 'Response is taking too long (over {$PG.PING_TIME.MAX.WARN} for 5m).'
              dependencies:
                - name: 'PostgreSQL: Server is down'
                  expression: 'last(/PostgreSQL by Zabbix agent active/pgsql.ping["{$PG.HOST}","{$PG.PORT}"]) = 0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 06c7f689e9494c6e857cefba709152af
          name: Ping
          type: ZABBIX_ACTIVE
          key: 'pgsql.ping["{$PG.HOST}","{$PG.PORT}"]'
          description: 'PostgreSQL server availability check. Returns `0` if the query fails.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.search(/accepting connections/)>0 ? 1 : 0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
          triggers:
            - uuid: 2642880aa3eb41b49cdb4a73e32894ff
              expression: 'last(/PostgreSQL by Zabbix agent active/pgsql.ping["{$PG.HOST}","{$PG.PORT}"]) = 0'
              name: 'PostgreSQL: Server is down'
              priority: HIGH
              description: 'Last test of a connection was unsuccessful.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6ab562c3ffaa4409a973f6a56d25e87a
          name: 'Get relation inventory'
          type: ZABBIX_ACTIVE
          key: 'pgsql.relation.inventory.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          delay: 25m
          history: '0'
          value_type: TEXT
          description: 'Collects `relation size` metrics from the primary core database.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var arr = [];
                  for (var key in obj) {
                  arr.push({
                  	"name": key,
                  	"database_name": obj[key].database_name,
                  	"total_bytes": obj[key].total_bytes,
                  	"table_count": obj[key].table_count
                  });
                  }
                  return JSON.stringify(arr);
          tags:
            - tag: component
              value: raw
