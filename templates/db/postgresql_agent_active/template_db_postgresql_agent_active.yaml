            - uuid: 5336e6eadebb4cffac94eafdf348813d
              name: 'Tablespace [{#TABLESPACE.NAME}]: Owner'
              type: DEPENDENT
              key: 'pgsql.tablespace.owner["{#TABLESPACE.NAME}"]'
              value_type: CHAR
              description: 'Owner of the tablespace "{#TABLESPACE.NAME}".'
