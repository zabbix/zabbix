            - uuid: 48ed0d2640c84f59825e40fc201ca36b
              name: 'Tablespace [{#TABLESPACE.NAME}]: Size'
              type: DEPENDENT
              key: 'pgsql.tablespace.size["{#TABLESPACE.NAME}"]'
              units: B
              description: 'Total size of the files stored in the tablespace "{#TABLESPACE.NAME}".'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.size_bytes
              master_item:
                key: 'pgsql.tablespace.get_metrics["{#TABLESPACE.NAME}"]'
              tags:
                - tag: component
                  value: storage
                - tag: tablespace
                  value: '{#TABLESPACE.NAME}'
              trigger_prototypes:
                - uuid: 8e58e40e2b2e4ac6bd665efb12d11b3c
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.tablespace.size["{#TABLESPACE.NAME}"],5m) > {$PG.TABLESPACE.SIZE.MAX.HIGH:"{#TABLESPACE.NAME}"}'
                  name: 'PostgreSQL: Tablespace [{#TABLESPACE.NAME}]: Size is critically big'
                  event_name: 'PostgreSQL: Tablespace [{#TABLESPACE.NAME}]: Size is critically big (over {$PG.TABLESPACE.SIZE.MAX.HIGH:"{#TABLESPACE.NAME}"} for 5m)'
                  priority: HIGH
                  description: 'The tablespace "{#TABLESPACE.NAME}" is close to exhausting its storage. Free up space or move relations to another tablespace - a full disk stops the instance from accepting writes.'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: fab7049d9628469886006b36656c1e35
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.tablespace.size["{#TABLESPACE.NAME}"],5m) > {$PG.TABLESPACE.SIZE.MAX.WARN:"{#TABLESPACE.NAME}"}'
                  name: 'PostgreSQL: Tablespace [{#TABLESPACE.NAME}]: Size is too big'
                  event_name: 'PostgreSQL: Tablespace [{#TABLESPACE.NAME}]: Size is too big (over {$PG.TABLESPACE.SIZE.MAX.WARN:"{#TABLESPACE.NAME}"} for 5m)'
                  priority: WARNING
                  description: 'The tablespace "{#TABLESPACE.NAME}" has grown beyond the expected size. Check the storage capacity and the growth rate before it becomes a problem.'
                  dependencies:
