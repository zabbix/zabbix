        - uuid: 4eb285a2796e41339238aa7c879c8e49
          name: 'Health: Max XID age'
          type: DEPENDENT
          key: pgsql.health.max.xid.age
          units: '!transactions'
          description: 'Current age of the oldest transaction ID (XID) in the database as a numeric count, used to detect wraparound risk.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.max_xid_age
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'pgsql.health.snapshot.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: health
            - tag: component
              value: xid
          triggers:
            - uuid: 47781a24a1094d8a88565c7178562de4
              expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.health.max.xid.age,5m) >= {$PG.XID_MAX.AVG}'
              name: 'PostgreSQL: XID age average'
              event_name: 'PostgreSQL: XID age >= {$PG.XID_MAX.AVG}'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Oldest XID age >= `{$PG.XID_MAX.AVG}`. Ensure autovacuum is running properly; investigate long-running transactions.'
              dependencies:
                - name: 'PostgreSQL: XID age high'
