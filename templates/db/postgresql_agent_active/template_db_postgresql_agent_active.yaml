                - tag: component
                  value: io
            - uuid: bdb04ddced6248e3af25d613ab20746f
              name: 'I/O: Get data'
              type: ZABBIX_ACTIVE
              key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
