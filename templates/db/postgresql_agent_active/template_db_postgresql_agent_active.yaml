        - uuid: 17ea409eaaaf491ea460a5865d363392
          name: 'Build: Get workload status'
          type: ZABBIX_ACTIVE
          key: 'pgsql.workload.status.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          history: '0'
          value_type: TEXT
          description: 'Extracts `pg_stat_statements` status (`workload` availability) and PostgreSQL version.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj;
                  var version_num;
                  var pgss_enabled;
                  
                  try {
                  	obj = JSON.parse(value);
                  	pgss_enabled = obj.pgss_enabled === true;
                  	version_num = obj.version_num;
                  } catch (e) {
                  	version_num = parseInt(value, 10);
                  	pgss_enabled = false;
                  }
                  
                  if (isNaN(version_num)) {
                  	Zabbix.log(3, '[ PostgreSQL ] Error parsing PostgreSQL version number: ' + value);
                  	return [];
                  }
                  
                  var major = Math.floor(version_num / 10000);
                  
                  var result = [{
                  	'{#PG_MAJOR}': major.toString(),
                  	'{#BELOW_V12}': 'false',
                  	'{#BELOW_V13}': 'false',
                  	'{#BELOW_V14}': 'false',
                  	'{#BELOW_V15}': 'false',
                  	'{#BELOW_V16}': 'false',
                  	'{#BELOW_V17}': 'false',
                  	'{#BELOW_V18}': 'false',
                  	'{#SINGLETON}': '',
                  	'{#PGSS_ENABLED}': pgss_enabled ? 'true' : 'false'
                  }];
                  
                  if (version_num < 120000) result[0]['{#BELOW_V12}'] = 'true';
                  if (version_num < 130000) result[0]['{#BELOW_V13}'] = 'true';
                  if (version_num < 140000) result[0]['{#BELOW_V14}'] = 'true';
                  if (version_num < 150000) result[0]['{#BELOW_V15}'] = 'true';
                  if (version_num < 160000) result[0]['{#BELOW_V16}'] = 'true';
                  if (version_num < 170000) result[0]['{#BELOW_V17}'] = 'true';
                  if (version_num < 180000) result[0]['{#BELOW_V18}'] = 'true';
                  
                  if (version_num < 100000) {
                  	return JSON.stringify([]);
                  }
                  
                  return JSON.stringify(result);
          tags:
            - tag: class
              value: database
            - tag: component
              value: raw
            - tag: component
              value: workload
