                      expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"],5m) >= {$PG.DATABASE.SIZE.AVG:"{#DBNAME}"}'
