            - uuid: e0c1915102004f8c9ce994f334b923c2
              name: 'I/O: Buffer hit ratio'
              type: DEPENDENT
              key: 'pgsql.io.hit.ratio.above.18[{#SINGLETON}]'
              value_type: FLOAT
              units: '%'
              description: |
                Percentage of buffer cache hits.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var reads = obj.reads || 0;
                      var hits = obj.hits || 0;
                      if (reads + hits === 0) return 0;
                      return (hits * 100) / (reads + hits);
              master_item:
                key: 'pgsql.io.above.18.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: cache
