                  event_name: 'PostgreSQL: SLRU: Cache hit ratio is critically low (under {$PG.SLRU.CACHE.MIN.HIGH}% for 5m)'
                  priority: HIGH
                  description: 'The SLRU caches serve less than {$PG.SLRU.CACHE.MIN.HIGH}% of their lookups from memory, so the instance is doing significant extra I/O for transaction status lookups.'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: 382515000fb04d1d9f9e9186b8661a07
                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.stat.slru.hit_ratio[{#SINGLETON}],5m) < {$PG.SLRU.CACHE.MIN.WARN}'
                  name: 'PostgreSQL: SLRU: Cache hit ratio too low'
                  event_name: 'PostgreSQL: SLRU: Cache hit ratio too low (under {$PG.SLRU.CACHE.MIN.WARN}% for 5m)'
                  priority: WARNING
                  description: 'The SLRU caches serve less than {$PG.SLRU.CACHE.MIN.WARN}% of their lookups from memory. Check the disk load and the concurrency of transactions using multixacts (`SELECT ... FOR SHARE`, subtransactions).'
                  dependencies:
                    - name: 'PostgreSQL: SLRU: Cache hit ratio is critically low'
                      expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.stat.slru.hit_ratio[{#SINGLETON}],5m) < {$PG.SLRU.CACHE.MIN.HIGH}'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 6161362aafeb4f6fa3186e0976e813f2
              name: 'SLRU: Get data'
              type: ZABBIX_ACTIVE
              key: 'pgsql.stat.slru["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
              description: |
                Collects the SLRU cache statistics from `pg_stat_slru`:
                https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-SLRU-VIEW
              tags:
                - tag: component
                  value: raw
          master_item:
            key: pgsql.version.validator
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 4ebf05af3eea4030a8996a73b0aac0b0
          name: 'WAL statistics metrics discovery'
          type: DEPENDENT
          key: pgsql.stat.wal.discovery
          filter:
            conditions:
              - macro: '{#BELOW_V14}'
                value: 'false'
          description: 'Discovers the `pg_stat_wal` metrics available in PostgreSQL 14 and newer.'
          item_prototypes:
            - uuid: 413339ff3c904435bc7653af4ac39441
              name: 'WAL statistics: Buffers full per second'
              type: DEPENDENT
              key: 'pgsql.stat.wal.buffers_full.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!times/s'
              description: 'Number of times per second the WAL buffers were full and had to be written out.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_buffers_full
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
              trigger_prototypes:
                - uuid: 381546b5f1734ab8a09ce8f6483e0508
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.stat.wal.buffers_full.rate[{#SINGLETON}],15m) > {$PG.WAL.BUFFERS_FULL.MAX.WARN}'
                  name: 'PostgreSQL: WAL statistics: WAL buffers are full too often'
                  event_name: 'PostgreSQL: WAL statistics: WAL buffers are full too often (over {$PG.WAL.BUFFERS_FULL.MAX.WARN} per second for 15m)'
                  priority: WARNING
                  description: |
                    The WAL buffers are exhausted more than {$PG.WAL.BUFFERS_FULL.MAX.WARN} times per second, so backends have to flush WAL themselves instead of doing useful work.
                    Increasing `wal_buffers` usually removes the bottleneck.
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 3cec7ddcc7c04ec0bcd94ee530a0a43c
              name: 'WAL statistics: Buffers full total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.buffers_full[{#SINGLETON}]'
              units: '!times'
              description: |
                Total number of times the WAL buffers were full and WAL had to be written out before the transaction could continue, since the last statistics reset.
                A growing value indicates WAL buffer pressure - consider increasing `wal_buffers`.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_buffers_full
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 4fb4b27c8c684f169b77ffa2f432664a
              name: 'WAL statistics: Bytes generated total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.bytes[{#SINGLETON}]'
              units: B
              description: 'Total amount of WAL generated since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_bytes
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 47f759bdeb5547a185fd180a9458160e
              name: 'WAL statistics: Full page images total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.fpi[{#SINGLETON}]'
              units: '!images'
              description: |
                Total number of full page images written to WAL since the last statistics reset.
                Full page images increase the WAL volume and are usually caused by frequent checkpoints.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_fpi
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: bb18038a48f64eef8573a541d2bd6930
              name: 'WAL statistics: Records total'
              type: DEPENDENT
              key: 'pgsql.stat.wal.records[{#SINGLETON}]'
              units: '!records'
              description: 'Total number of WAL records generated since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wal_records
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 8b901e38b6c0423491a3d1320a8e24ee
              name: 'WAL statistics: Statistics reset time'
              type: DEPENDENT
              key: 'pgsql.stat.wal.reset_time[{#SINGLETON}]'
              units: unixtime
              description: 'Time of the last reset of the WAL statistics. The totals above are counted from this moment.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.stats_reset
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 7d
              master_item:
                key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: wal
            - uuid: 2166ffd6466e4cf8949d31e09a9f8435
              name: 'WAL statistics: Get data'
              type: ZABBIX_ACTIVE
              key: 'pgsql.stat.wal["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              history: '0'
              value_type: TEXT
              description: |
                Collects write-ahead log activity from `pg_stat_wal`:
                https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-WAL-VIEW
              tags:
                - tag: component
                  value: raw
          master_item:
            key: pgsql.version.validator
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 6594676666654436a994684ecbd95985
          name: 'Subscription discovery'
          type: DEPENDENT
          key: pgsql.subscription.discovery
          filter:
            conditions:
              - macro: '{#SUBNAME}'
                value: '{$PG.LLD.FILTER.SUBSCRIPTION}'
          description: 'Discovers the logical replication subscriptions of the instance.'
          item_prototypes:
            - uuid: 5d3112977aaf4d4f9f42dea9acd6e289
              name: 'Subscription [{#SUBNAME}]: Apply errors'
              type: DEPENDENT
              key: 'pgsql.subscription.apply_errors["{#SUBNAME}"]'
              units: '!errors'
              description: 'Number of errors that occurred while applying the changes received from the publisher, since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.apply_error_count
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
              trigger_prototypes:
                - uuid: 33099dedefa44f8989816f3089ff32d2
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.subscription.apply_errors["{#SUBNAME}"],5m) > {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"}'
                  name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while applying changes'
                  event_name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while applying changes (over {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"} for 5m)'
                  priority: WARNING
                  description: 'The subscription "{#SUBNAME}" fails to apply the changes it receives, so the subscriber data is drifting away from the publisher. Check the subscription worker errors in the PostgreSQL log.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 731f35b3b308407da7a6d21e849b89ee
              name: 'Subscription [{#SUBNAME}]: Get subscription stats'
              type: DEPENDENT
              key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              history: '0'
              value_type: TEXT
              description: 'Subscription stats of the "{#SUBNAME}" subscription.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.subname=="{#SUBNAME}")].first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'pgsql.subscription.stats["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
              tags:
                - tag: component
                  value: raw
                - tag: subscription
                  value: '{#SUBNAME}'
            - uuid: cbf7813ffd6644fea70528fd7b806399
              name: 'Subscription [{#SUBNAME}]: Statistics reset time'
              type: DEPENDENT
              key: 'pgsql.subscription.reset_time["{#SUBNAME}"]'
              units: unixtime
              description: 'Time of the last reset of the subscription statistics. The error counters above are counted from this moment.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.stats_reset
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 7d
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
            - uuid: 287947aba7df45f4879663654eb4fc75
              name: 'Subscription [{#SUBNAME}]: Sync errors'
              type: DEPENDENT
              key: 'pgsql.subscription.sync_errors["{#SUBNAME}"]'
              units: '!errors'
              description: 'Number of errors that occurred during the initial data copy of the subscribed tables, since the last statistics reset.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.sync_error_count
              master_item:
                key: 'pgsql.subscription.get_metrics["{#SUBNAME}"]'
              tags:
                - tag: component
                  value: subscription
                - tag: subscription
                  value: '{#SUBNAME}'
              trigger_prototypes:
                - uuid: 62f3fdb2e3e94f558133a2b90059a361
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.subscription.sync_errors["{#SUBNAME}"],5m) > {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"}'
                  name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while synchronizing tables'
                  event_name: 'PostgreSQL: Subscription [{#SUBNAME}]: Errors while synchronizing tables (over {$PG.SUBSCRIPTION.ERRORS.MAX.WARN:"{#SUBNAME}"} for 5m)'
                  priority: WARNING
                  description: 'The initial table synchronization of the subscription "{#SUBNAME}" keeps failing, so the subscribed tables never reach a consistent state. Check the table sync worker errors in the PostgreSQL log.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: 'pgsql.subscription.stats["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          lld_macro_paths:
            - lld_macro: '{#SUBNAME}'
              path: $.subname
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 25330700a5554bda859920cac03fb4e7
          name: 'Tablespace discovery'
          type: DEPENDENT
          key: pgsql.tablespace.discovery
          filter:
            conditions:
              - macro: '{#TABLESPACE.NAME}'
                value: '{$PG.LLD.FILTER.TABLESPACE}'
