        - uuid: 9b71283fad6241b89a125f89ad1762ec
          name: 'Database discovery'
          type: ZABBIX_ACTIVE
          key: 'pgsql.db.discovery["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          delay: 1h
          filter:
            conditions:
              - macro: '{#DBNAME}'
                value: '{$PG.LLD.FILTER.DBNAME.MATCHES}'
              - macro: '{#DBNAME}'
                value: '{$PG.LLD.FILTER.DBNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            Discovers all databases (DB) in the DBMS except:
            - Template DBs (template0, template1);
            - DBs that do not allow connections.
          item_prototypes:
            - uuid: dae45b7fcb624901b28f24fb10a6b69d
              name: 'DB [{#DBNAME}]: Database size'
              type: ZABBIX_ACTIVE
              key: 'pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"]'
              delay: 15m
              units: B
              description: |
                Database `{#DBNAME}` size.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              tags:
                - tag: component
                  value: database
                - tag: component
                  value: storage
                - tag: database
                  value: '{#DBNAME}'
                - tag: version
                  value: '{#PG_MAJOR}'
              trigger_prototypes:
                - uuid: c7c06778cfe342f59a311fc6689d9336
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"],5m) >= {$PG.DATABASE.SIZE.AVG:"{#DBNAME}"}'
                  name: 'PostgreSQL: DB [{#DBNAME}]: Size average'
                  event_name: 'PostgreSQL: DB [{#DBNAME}]: Size >= `avg` state for 5m'
                  opdata: '{#DBNAME} current size: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'Database "{#DBNAME}" size >= {$PG.DATABASE.SIZE.AVG:"{#DBNAME}"} bytes.'
                  dependencies:
                    - name: 'PostgreSQL: DB [{#DBNAME}]: Size high'
                      expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"],5m) >= {$PG.DATABASE.SIZE.HIGH:"{#DBNAME}"}'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: 282c84125a664a02ab9c2dcb1baf99d2
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"],5m) >= {$PG.DATABASE.SIZE.HIGH:"{#DBNAME}"}'
                  name: 'PostgreSQL: DB [{#DBNAME}]: Size high'
                  event_name: 'PostgreSQL: DB [{#DBNAME}]: Size >= `high` state for 5m'
                  opdata: '{#DBNAME} current size: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'Database "{#DBNAME}" size >= {$PG.DATABASE.SIZE.HIGH:"{#DBNAME}"} bytes.'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: 0ec8c14003724912bf5785c425b4f838
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.db.size["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#DBNAME}"],5m) >= {$PG.DATABASE.SIZE.WARN:"{#DBNAME}"}'
                  name: 'PostgreSQL: DB [{#DBNAME}]: Size warning'
                  event_name: 'PostgreSQL: DB [{#DBNAME}]: Size >= `warn` state for 5m'
                  opdata: '{#DBNAME} current size: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Database "{#DBNAME}" size >= `{$PG.DATABASE.SIZE.WARN:"{#DBNAME}"}` bytes.'
                  dependencies:
