              trigger_prototypes:
                - uuid: b164851eb9b644a1892d0df72564ed11
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.replication.slots.inactive_retaining[{#SINGLETON}],5m) > {$PG.REPLICATION.SLOTS.RETAINING.MAX.WARN}'
                  name: 'PostgreSQL: Replication slots: Inactive slots are retaining WAL'
                  event_name: 'PostgreSQL: Replication slots: Inactive slots are retaining WAL (over {$PG.REPLICATION.SLOTS.RETAINING.MAX.WARN} for 5m)'
                  priority: WARNING
