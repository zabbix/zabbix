        - uuid: 8b74bab28c6b474d8613e20923120827
          name: 'SLRU metrics discovery (v13+)'
          type: ZABBIX_ACTIVE
          key: 'pgsql.slru.above.13.discovery["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SLRU.NAME}'
                value: '{$PG.LLD.FILTER.SLRU.MATCHES}'
              - macro: '{#SLRU.NAME}'
                value: '{$PG.LLD.FILTER.SLRU.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers `SLRU` metrics in PostgreSQL 13 and above.'
          item_prototypes:
            - uuid: bed39cd943704fc890c64b23a8fe3ec7
              name: 'SLRU [{#SLRU.NAME}]: Get data'
              type: DEPENDENT
              key: 'pgsql.slru.above.13.get[{#SLRU.NAME}]'
              history: '0'
              value_type: TEXT
              description: |
                Collects SLRU (Simple Least Recently Used) cache statistics from `pg_stat_slru`.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name=="{#SLRU.NAME}")].first()'
              master_item:
                key: 'pgsql.slru.inventory.get["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
              tags:
                - tag: component
                  value: raw
                - tag: component
                  value: slru
                - tag: version
                  value: '{#PG_MAJOR}'
            - uuid: 9a484971f0f242a79386eaa0f3553f4c
              name: 'SLRU [{#SLRU.NAME}]: Blocks hit'
              type: DEPENDENT
              key: 'pgsql.slru.blocks.hit[{#SLRU.NAME}]'
              units: '!blocks'
              description: |
                Total number of SLRU (Simple Least Recently Used) blocks found in cache (hits) since last statistics reset.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - $.blks_hit
              master_item:
                key: 'pgsql.slru.above.13.get[{#SLRU.NAME}]'
              tags:
                - tag: component
                  value: slru
                - tag: version
                  value: '{#PG_MAJOR}'
            - uuid: cf421cc254c84f29ba79e43975c75dee
              name: 'SLRU [{#SLRU.NAME}]: Blocks read'
              type: DEPENDENT
              key: 'pgsql.slru.blocks.read[{#SLRU.NAME}]'
              units: '!blocks'
              description: |
                Total number of SLRU (Simple Least Recently Used) blocks read since last statistics reset.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - $.blks_read
              master_item:
                key: 'pgsql.slru.above.13.get[{#SLRU.NAME}]'
              tags:
                - tag: component
                  value: slru
                - tag: version
                  value: '{#PG_MAJOR}'
            - uuid: fb15db16311b46f788f6a3c50b42b6c2
              name: 'SLRU [{#SLRU.NAME}]: Buffer hit ratio'
              type: CALCULATED
              key: 'pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}]'
              value_type: FLOAT
              units: '%'
              params: '100 * last(//pgsql.slru.blocks.hit[{#SLRU.NAME}]) / (last(//pgsql.slru.blocks.hit[{#SLRU.NAME}]) + last(//pgsql.slru.blocks.read[{#SLRU.NAME}]))'
              description: |
                Percentage of SLRU (Simple Least Recently Used) blocks served from cache (hits / total blocks). Higher means better performance.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
              tags:
                - tag: component
                  value: slru
                - tag: version
                  value: '{#PG_MAJOR}'
              trigger_prototypes:
                - uuid: ec3933ba61bd4a8e95615903b3ff4d65
                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}],5m) <= {$PG.SLRU.CACHE.AVG}'
                  name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: Buffer hit average'
                  event_name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: SLRU buffer hit ratio <= {$PG.SLRU.CACHE.AVG}% for 5m'
                  opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'SLRU buffer hit ratio <= `{$PG.SLRU.CACHE.AVG}`%. Moderate cache efficiency drop. Investigate I/O patterns and autovacuum activity.'
                  dependencies:
                    - name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: Buffer hit high'
                      expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}],5m) <= {$PG.SLRU.CACHE.HIGH}'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: 398e4df1a5e647c4ac441605c6e2efeb
                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}],5m) <= {$PG.SLRU.CACHE.HIGH}'
                  name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: Buffer hit high'
                  event_name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: SLRU buffer hit ratio <= {$PG.SLRU.CACHE.HIGH}% for 5m'
                  opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'SLRU buffer hit ratio <= `{$PG.SLRU.CACHE.HIGH}`%. Critical cache inefficiency. High I/O load expected. Investigate disk usage and hot transactions immediately.'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: 5b4f87fa26564788bfdb18914eef10d9
                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}],5m) <= {$PG.SLRU.CACHE.WARN}'
                  name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: Buffer hit warning'
                  event_name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: SLRU buffer hit ratio <= {$PG.SLRU.CACHE.WARN}% for 5m'
                  opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'SLRU buffer hit ratio <= `{$PG.SLRU.CACHE.WARN}`%. Slightly below optimal. Monitor I/O and queries.'
                  dependencies:
                    - name: 'PostgreSQL: SLRU [{#SLRU.NAME}]: Buffer hit average'
                      expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.slru.buffer.hit.ratio[{#SLRU.NAME}],5m) <= {$PG.SLRU.CACHE.AVG}'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: f6df777ff6db42ac956e864a20678aa0
              name: 'SLRU [{#SLRU.NAME}]: Reset time'
              type: DEPENDENT
              key: 'pgsql.slru.stats.reset[{#SLRU.NAME}]'
              units: unixtime
              description: |
                The timestamp when the SLRU (Simple Least Recently Used) statistics were last reset to zero.
                Current major version of PostgreSQL: `{#PG_MAJOR}`.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - $.stats_reset
                - type: JAVASCRIPT
                  parameters:
                    - 'return Math.floor(new Date(value).getTime() / 1000);'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: 'pgsql.slru.above.13.get[{#SLRU.NAME}]'
              tags:
                - tag: component
                  value: slru
                - tag: version
                  value: '{#PG_MAJOR}'
          lld_macro_paths:
            - lld_macro: '{#SLRU.NAME}'
              path: $.name
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	JSON.parse(value);
                  	return value;
                  } catch (e) {
                  	return null;
                  }
