                    - '0.001'
              master_item:
                key: 'pgsql.stat.io["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}","{#SINGLETON}"]'
              tags:
                - tag: component
                  value: io
            - uuid: 02a3935d05964a5ab17f0a558d970f3c
              name: 'I/O: Writes per second'
              type: DEPENDENT
              key: 'pgsql.stat.io.writes.rate[{#SINGLETON}]'
              value_type: FLOAT
              units: '!writes/s'
              description: 'Number of write operations per second the instance issues to the storage.'
              preprocessing:
                - type: JSONPATH
                  parameters:
