          key: 'pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          units: '!transactions'
          description: 'Age of the oldest active transaction (XID) among live backends.'
          tags:
            - tag: component
              value: XID
          triggers:
            - uuid: a7a7af6eeae6456baec5883597678be2
              expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.AVG}'
              name: 'PostgreSQL: Oldest active XID average'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.AVG} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.AVG}`. Check for long-running transactions.'
              dependencies:
                - name: 'PostgreSQL: Oldest active XID high'
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.HIGH}'
              tags:
                - tag: scope
                  value: performance
            - uuid: 0745f2d1559e432b93216824978f2220
              expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.HIGH}'
              name: 'PostgreSQL: Oldest active XID high'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.HIGH} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.HIGH}`. Investigate immediately.'
              tags:
                - tag: scope
                  value: performance
            - uuid: fd0b0e2f330e412e92611df9fab4525d
              expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.WARN}'
              name: 'PostgreSQL: Oldest active XID warning'
              event_name: 'PostgreSQL: Oldest Active XID >= {$PG.XID_ACTIVE.WARN} for 15m'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Oldest active XID >= `{$PG.XID_ACTIVE.WARN}`. Monitor long transactions.'
              dependencies:
                - name: 'PostgreSQL: Oldest active XID average'
                  expression: 'min(/PostgreSQL by Zabbix agent active/pgsql.oldest.active.xid["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"],15m) >= {$PG.XID_ACTIVE.AVG}'
              tags:
                - tag: scope
                  value: performance
        - uuid: 7bd42b5fa32b4a6898b8c750f507b81d
          name: 'Ping time'
          type: ZABBIX_ACTIVE
          key: 'pgsql.ping.time["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          value_type: FLOAT
          units: s
          description: 'Used to get the `SELECT 1` query execution time.'
          preprocessing:
            - type: REGEX
              parameters:
                - 'Time:\s+(\d+\.\d+)\s+ms'
                - \1
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
