            - uuid: f3cc6866b1344e389fedce9b27d8cf94
              name: 'SLRU: Cache hit ratio'
              type: DEPENDENT
              key: 'pgsql.stat.slru.hit_ratio[{#SINGLETON}]'
              value_type: FLOAT
              units: '%'
              description: |
                Percentage of the SLRU cache lookups served from memory, over all caches.
                A dropping ratio means the transaction status and multixact caches no longer fit, which shows up as extra disk reads under high concurrency.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data,
                      	cache,
                      	hits = 0,
                      	reads = 0,
                      	i;
                      
                      try {
                      	data = JSON.parse(value);
                      } catch (error) {
                      	throw 'Cannot parse the SLRU statistics as JSON: ' + value;
                      }
                      
                      if (!Array.isArray(data)) {
                      	throw 'Expected an array of SLRU caches, got: ' + value;
                      }
                      
                      for (i = 0; i < data.length; i++) {
                      	cache = data[i] || {};
                      	hits += parseInt(cache.blks_hit, 10);
                      	reads += parseInt(cache.blks_read, 10);
                      }
                      
                      if (isNaN(hits) || isNaN(reads)) {
                      	throw 'The SLRU statistics have no hit or read counters: ' + value;
                      }
                      
                      if (hits + reads === 0) {
                      	return 100;
