                  value: notice
        - uuid: 7e2623a3375d45d7bb8e96bf7fede61c
          name: 'Version (numeric)'
          type: DEPENDENT
          key: pgsql.version.num
          trends: '0'
          description: 'The PostgreSQL version as an integer, the same way `server_version_num` reports it - 18.4 becomes 180004.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var match = /PostgreSQL (\d+)(?:\.(\d+))?(?:\.(\d+))?/.exec(value),
                  	major,
                  	second,
                  	third;
                  
                  if (match === null) {
                  	throw 'Cannot parse the PostgreSQL version: ' + value;
                  }
                  
                  major = parseInt(match[1], 10);
                  second = parseInt(match[2] || '0', 10);
                  third = parseInt(match[3] || '0', 10);
                  
                  if (major >= 10) {
                  	return major * 10000 + second;
                  }
                  
                  return major * 10000 + second * 100 + third;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'pgsql.version["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: application
        - uuid: 01240d3c4167424caee3d0dee76d852e
          name: 'Version validator'
          type: DEPENDENT
          key: pgsql.version.validator
          history: '0'
          value_type: TEXT
          description: |
            Converts the PostgreSQL version into low-level discovery data: one entry with a `{#BELOW_V<major>}` macro per release that introduced monitored metrics.
            Discovery rules filter on those macros, which is how version-specific metrics are created only where PostgreSQL provides them.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var version = parseInt(value, 10);
                  
                  if (isNaN(version) || version < 100000) {
                  	return JSON.stringify([]);
                  }
                  
                  return JSON.stringify([{
                  	'{#SINGLETON}': '',
                  	'{#BELOW_V13}': version < 130000 ? 'true' : 'false',
                  	'{#BELOW_V14}': version < 140000 ? 'true' : 'false',
                  	'{#BELOW_V15}': version < 150000 ? 'true' : 'false',
                  	'{#BELOW_V16}': version < 160000 ? 'true' : 'false',
                  	'{#BELOW_V17}': version < 170000 ? 'true' : 'false',
                  	'{#BELOW_V18}': version < 180000 ? 'true' : 'false'
                  }]);
          master_item:
            key: pgsql.version.num
          tags:
            - tag: component
              value: application
        - uuid: 9798496e21914a8cbdee1cd85decf3e8
          name: Version
