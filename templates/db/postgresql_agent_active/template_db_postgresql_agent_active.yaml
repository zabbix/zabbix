        - uuid: 5069ba3e38824d169a2ecd5dd234bbe2
          name: 'Build: Version validator'
          type: DEPENDENT
          key: pgsql.version.validator
          history: '0'
          value_type: CHAR
          description: 'Validates the PostgreSQL version and sets version macros for LLDs.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var version_num = parseInt(value, 10);
                  
                  if (isNaN(version_num)) {
                  	Zabbix.log(3, '[ PostgreSQL ] Error parsing PostgreSQL version number: ' + value);
                  	return '[]';
                  }
                  
                  if (version_num < 100000) {
                  	return '[]';
                  }
                  
                  var major = Math.floor(version_num / 10000);
                  
                  var result = [{
                  	'{#PG_MAJOR}': major.toString(),
                  	'{#BELOW_V12}': 'false',
                  	'{#BELOW_V13}': 'false',
                  	'{#BELOW_V14}': 'false',
                  	'{#BELOW_V15}': 'false',
                  	'{#BELOW_V16}': 'false',
                  	'{#BELOW_V17}': 'false',
                  	'{#BELOW_V18}': 'false',
                  	'{#SINGLETON}': ''
                  }];
                  
                  if (version_num < 120000) result[0]['{#BELOW_V12}'] = 'true';
                  if (version_num < 130000) result[0]['{#BELOW_V13}'] = 'true';
                  if (version_num < 140000) result[0]['{#BELOW_V14}'] = 'true';
                  if (version_num < 150000) result[0]['{#BELOW_V15}'] = 'true';
                  if (version_num < 160000) result[0]['{#BELOW_V16}'] = 'true';
                  if (version_num < 170000) result[0]['{#BELOW_V17}'] = 'true';
                  if (version_num < 180000) result[0]['{#BELOW_V18}'] = 'true';
                  
                  return JSON.stringify(result);
          master_item:
            key: 'pgsql.version.numeric["{$PG.HOST}","{$PG.PORT}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}"]'
          tags:
            - tag: component
              value: raw
            - tag: component
              value: version
            - tag: version
              value: validator
        - uuid: 7d71f9b8a5344567813711d9a92a64eb
          name: 'Build: Word size'
          type: DEPENDENT
