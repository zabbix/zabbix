                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.io.hit.ratio.above.18[{#SINGLETON}],5m) <= {$PG.IO.CACHE.HIGH}'
                  name: 'PostgreSQL: I/O: Buffer hit high'
                  event_name: 'PostgreSQL: I/O: I/O buffer hit ratio <= {$PG.IO.CACHE.HIGH}% for 5m'
                  opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'I/O buffer hit ratio <= `{$PG.IO.CACHE.HIGH}`%. Critical cache inefficiency. High disk I/O expected. Investigate storage performance immediately.'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: cd3217a9b7b3488ea5811f5d471fe824
                  expression: 'max(/PostgreSQL by Zabbix agent active/pgsql.io.hit.ratio.above.18[{#SINGLETON}],5m) <= {$PG.IO.CACHE.WARN}'
                  name: 'PostgreSQL: I/O: Buffer hit warning'
                  event_name: 'PostgreSQL: I/O: I/O buffer hit ratio <= {$PG.IO.CACHE.WARN}% for 5m'
                  opdata: 'Current hit ratio: {ITEM.LASTVALUE1}'
