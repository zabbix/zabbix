          description: '1 if the default-priority connection-pool circuit breaker is open (tripped) for at least one cluster (envoy_cluster_circuit_breakers_default_cx_pool_open), 0 otherwise.'
          valuemap:
            name: 'Envoy circuit breaker state'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"value":0}}'
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$ENVOY.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: envoy_cluster_circuit_breakers_default_cx_pool_open
                - column: ServiceName
                  value: envoy-proxy
          tags:
            - tag: apm
              value: metrics
            - tag: component
              value: cluster
          triggers:
            - uuid: 097b71ee16794e89b4509f8c62126494
              expression: 'min(/Envoy Proxy by OTLP/envoy.otlp.cluster.cb.cx_pool_open,5m) > {$ENVOY.OTLP.CIRCUIT_BREAKER.WARN}'
