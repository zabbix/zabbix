      macros:
        - macro: '{$ENVOY.OTLP.CIRCUIT_BREAKER.WARN}'
          value: '0'
          description: 'Number of aggregation windows a default-priority circuit breaker is seen open (tripped) before the trigger fires.'
          config:
            type: TEXT
            priority: '16'
            section_name: Thresholds
            label: 'Circuit breaker open threshold'
            description: 'Number of aggregation windows a default-priority circuit breaker is seen open (tripped) before the trigger fires. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ENVOY.OTLP.CLUSTER.HEALTHY.MIN.WARN}'
          value: '90'
          description: 'Minimum share of healthy upstream hosts, in percent (summed across all clusters), before the trigger fires.'
          config:
            type: TEXT
            priority: '17'
            section_name: Thresholds
            label: 'Cluster healthy hosts threshold'
            description: 'Minimum share of healthy upstream hosts, in percent (summed across all clusters), before the trigger fires. Lower it if brief single-host dips (e.g. rolling restarts) are expected and shouldn''t alert. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ENVOY.OTLP.HTTP.5XX.WARN}'
          value: '5'
          description: 'Downstream 5xx response rate threshold, in %.'
          config:
            type: TEXT
            priority: '11'
            section_name: Thresholds
