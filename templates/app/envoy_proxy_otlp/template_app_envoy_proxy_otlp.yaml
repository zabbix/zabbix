            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ENVOY.OTLP.INTERVAL}'
          value: 1m
          description: 'Update interval of the Telemetry query and calculated items. The aggregation bucket (granularity) stays fixed at 1 minute, so use a multiple of 1 minute.'
