zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: b3fb25ec57b6424cbf0821bbb7e39a54
      template: 'OpenRouter traces by OTLP'
      name: 'OpenRouter traces by OTLP'
      description: |
        OpenRouter template. Collects traces via APM query items and shows basic
        span health indicators, durations, statuses, errors.
        Note: OpenRouter sends completions traces only.
        
        Generated by official Zabbix template tool "Templator"
      wizard_ready: 'YES'
      readme: |
        ## Overview
        This template is designed to collect OpenRouter trace data. It provides a basic span overview
        with health indicators, durations, statuses, errors.
        
        ## Setup
        1. Ensure that OpenRouter account is configured to send traces to your OpenTelemetry collector.
            Each workspace requires separate configuration.
        2. Ensure that the `TelemetryProvider` parameter is configured in the Zabbix server configuration file.
        3. Apply the template to the host.
        4. Adjust macros if needed.
        
        ### OpenRouter Configuration
        OpenTelemetry Collector should configured in "Observability" menu in each workspace.
        Endpoint configuration is enough.
        
        *Note: OpenRouter sends completions traces only.*
      vendor:
        name: Zabbix
        version: 8.0-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: 6984ffad40cd4fee98e23999c4242ab9
          name: 'Span: BYOK [false] count'
          type: TELEMETRY_QUERY
          key: openrouter.span.byok.false
          delay: '{$OPENROUTER.FREQUENCY}'
          description: 'Number of spans without your own key over the last `{$OPENROUTER.FREQUENCY}`.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"count":0}}'
            - type: JSONPATH
              parameters:
                - $.columns.count
          time_shift: '{$OPENROUTER.TIMESHIFT}'
          lookback_limit: '{$OPENROUTER.LOOPBACK}'
          granularity: '{$OPENROUTER.FREQUENCY}'
          query:
            aggregated_columns:
              - alias: count
            filter:
              evaltype: FORMULA
              formula: '(A or B) and C'
              conditions:
                - column: SpanAttributes
                  attribute_key: trace.metadata.openrouter_generation.is_byok
                  value: 'false'
                  formulaid: A
                - column: SpanAttributes
                  attribute_key: span.metadata.is_byok
                  value: 'false'
                  formulaid: B
                - column: ServiceName
                  value: openrouter
                  formulaid: C
          tags:
            - tag: component
              value: span
        - uuid: c3332298266444589db1a7608a775427
          name: 'Span: BYOK rate'
          type: CALCULATED
          key: openrouter.span.byok.rate
          delay: '{$OPENROUTER.FREQUENCY}'
          value_type: FLOAT
          units: '%'
          params: '100*last(//openrouter.span.byok.true)/last(//openrouter.span.total)'
          description: 'Percentage of BYOK spans.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          tags:
            - tag: component
              value: span
          triggers:
            - uuid: e77608a917c24726abf4859ff8913986
              expression: 'min(/OpenRouter traces by OTLP/openrouter.span.byok.rate,5m)>{$OPENROUTER.SPAN.BYOK.WARN}'
              name: 'OpenRouter: High BYOK rate'
              event_name: 'OpenRouter: BYOK span rate exceeded {$OPENROUTER.SPAN.BYOK.WARN}% threshold.'
              priority: WARNING
              tags:
                - tag: scope
                  value: notice
        - uuid: de40176f77bc4beb922a5948736d863f
          name: 'Span: BYOK [true] count'
          type: TELEMETRY_QUERY
          key: openrouter.span.byok.true
          delay: '{$OPENROUTER.FREQUENCY}'
          description: 'Number of spans with your own key over the last `{$OPENROUTER.FREQUENCY}`.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"count":0}}'
            - type: JSONPATH
              parameters:
                - $.columns.count
          time_shift: '{$OPENROUTER.TIMESHIFT}'
          lookback_limit: '{$OPENROUTER.LOOPBACK}'
          granularity: '{$OPENROUTER.FREQUENCY}'
          query:
            aggregated_columns:
              - alias: count
            filter:
              evaltype: FORMULA
              formula: '(A or B) and C'
              conditions:
                - column: SpanAttributes
                  attribute_key: trace.metadata.openrouter_generation.is_byok
                  value: 'true'
                  formulaid: A
                - column: SpanAttributes
                  attribute_key: span.metadata.is_byok
                  value: 'true'
                  formulaid: B
                - column: ServiceName
                  value: openrouter
                  formulaid: C
          tags:
            - tag: component
              value: span
        - uuid: 70507c8d49ac4e6b86e59bb8802c0def
          name: 'Span: Duration, average'
          type: TELEMETRY_QUERY
          key: openrouter.span.duration.avg
          delay: '{$OPENROUTER.FREQUENCY}'
          value_type: FLOAT
          units: s
          description: 'Average span duration over the last `{$OPENROUTER.FREQUENCY}`.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.avg
            - type: MULTIPLIER
              parameters:
                - '1.0E-9'
          time_shift: '{$OPENROUTER.TIMESHIFT}'
          lookback_limit: '{$OPENROUTER.LOOPBACK}'
          granularity: '{$OPENROUTER.FREQUENCY}'
          query:
            aggregated_columns:
              - function: AVG
                column: Duration
                alias: avg
            filter:
              evaltype: AND
              conditions:
                - column: ServiceName
                  value: openrouter
          tags:
            - tag: component
              value: span
        - uuid: 6b048816928445a7aabfe33984ba75d8
          name: 'Span: Duration, maximum'
          type: TELEMETRY_QUERY
