          time_shift: '{$OPENROUTER.TIMESHIFT}'
          lookback_limit: '{$OPENROUTER.LOOPBACK}'
          granularity: '{$OPENROUTER.FREQUENCY}'
          query:
            aggregated_columns:
              - function: MAX
                column: Duration
                alias: max
            filter:
              evaltype: AND
              conditions:
                - column: ServiceName
                  value: openrouter
          tags:
