        - uuid: 0c1751e689654aadb73e314b28d5fb00
          name: 'Span: Duration, 80th percentile'
          type: TELEMETRY_QUERY
          key: openrouter.span.duration.percentile
          delay: '{$OPENROUTER.FREQUENCY}'
          value_type: FLOAT
          units: s
