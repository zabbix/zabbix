        - uuid: 9d0d981f4254471492dd2c78ecb0c7b5
          name: 'Leaf certificate expiry'
          type: DEPENDENT
          key: consul.leaf_cert_expiry
          value_type: FLOAT
          units: s
          description: 'Seconds until the soonest-expiring Connect leaf certificate across all registered services expires. Leaf certificates are short-lived and renewed automatically well before expiry.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
