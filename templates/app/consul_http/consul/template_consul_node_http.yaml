            priority: '3'
            label: Token
            description: 'Consul auth token.'
            required: 'YES'
        - macro: '{$HTTP.TLS.VERIFY}'
          value: full
          description: 'TLS certificate verification for the script item: "none" - disabled, "peer" - verify the certificate chain and expiration, "full" - full verification. Any other value enables full verification. To override the setting for this template only, define the macro with the context "HashiCorp Consul Node", e.g. {$HTTP.TLS.VERIFY:"HashiCorp Consul Node"}.'
          config:
            type: LIST
            priority: '1'
            section_name: Other
            label: 'TLS certificate verification'
            description: 'Disabling verification exposes the connection to man-in-the-middle attacks. Disable it only for an endpoint that uses a self-signed certificate.'
