              expression: 'last(/HashiCorp Consul Node by HTTP/consul.leaf_cert_expiry)>0 and last(/HashiCorp Consul Node by HTTP/consul.leaf_cert_expiry)<{$CONSUL.LEAF.CERT.EXPIRY.MIN}'
              name: 'HashiCorp Consul Node: Leaf certificate expires soon'
