            key: openshift.node.exporter.metrics.get
          tags:
            - tag: component
              value: node
          triggers:
            - uuid: 5a2151e8ec6a44cb88b601908549c840
              expression: 'last(/OpenShift Node by HTTP/openshift.node.uptime)<10m'
              name: 'OpenShift Node: Node has been restarted'
              event_name: 'OpenShift Node: Node has been restarted (uptime less than 10 minutes)'
              opdata: 'Current uptime: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Uptime is less than 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 61a0c42a143443fda1760b13d9ffe8cb
          name: 'Get node usage metrics'
          type: HTTP_AGENT
          key: openshift.node.usage.metrics.get
          history: '0'
          value_type: TEXT
          description: 'Collecting the node CPU utilization, number of CPU cores, and network receive/transmit throughput from the Thanos Querier API, pre-aggregated server-side by PromQL. Network totals exclude loopback and virtual interfaces via `{$OPENSHIFT.NODE.NETWORK.IF.EXCLUDE}`.'
          timeout: 15s
          url: '{$OPENSHIFT.THANOS.URL}/api/v1/query'
          query_fields:
            - name: query
              value: |
                label_replace(100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle", instance="{$OPENSHIFT.NODE.NAME}"}[5m]))), "__name__", "node_cpu_utilization", "", "")
                  or on(__name__) label_replace(count(node_cpu_seconds_total{mode="idle", instance="{$OPENSHIFT.NODE.NAME}"}), "__name__", "node_cpu_cores", "", "")
                  or on(__name__) label_replace(sum(rate(node_network_receive_bytes_total{instance="{$OPENSHIFT.NODE.NAME}", device!~"{$OPENSHIFT.NODE.NETWORK.IF.EXCLUDE}"}[5m])), "__name__", "node_network_receive", "", "")
                  or on(__name__) label_replace(sum(rate(node_network_transmit_bytes_total{instance="{$OPENSHIFT.NODE.NAME}", device!~"{$OPENSHIFT.NODE.NETWORK.IF.EXCLUDE}"}[5m])), "__name__", "node_network_transmit", "", "")
          status_codes: '200,400,422,503'
          http_proxy: '{$OPENSHIFT.HTTP.PROXY}'
          headers:
            - name: Authorization
              value: 'Bearer {$OPENSHIFT.THANOS.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: a5b1d29b1d4444ceaedcde2583e3eb5b
          name: 'Get node usage metrics check'
          type: DEPENDENT
          key: openshift.node.usage.metrics.get.check
          value_type: CHAR
          description: 'Check that the node usage data has been received correctly from Thanos.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
          master_item:
            key: openshift.node.usage.metrics.get
          tags:
            - tag: component
              value: status
          triggers:
            - uuid: 751a1f85f73544bda3acef465ca84370
              expression: 'length(last(/OpenShift Node by HTTP/openshift.node.usage.metrics.get.check))>0'
              name: 'OpenShift Node: Failed to get node usage metrics'
              event_name: 'OpenShift Node: Failed to get node usage metrics'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Failed to get node usage metrics from the Thanos Querier API.'
              tags:
                - tag: scope
                  value: availability
