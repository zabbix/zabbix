                  name: 'OpenShift Cluster: Namespace [{#NAMESPACE}] Route [{#NAME}]: Not admitted'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: openshift.state.objects.metrics.get
          lld_macro_paths:
            - lld_macro: '{#HOST}'
              path: $.host
            - lld_macro: '{#NAMESPACE}'
              path: $.namespace
            - lld_macro: '{#NAME}'
              path: $.route
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.result[?(@.metric.__name__==''openshift_route_info'')].metric'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var routes = JSON.parse(value);
                  
                  routes.forEach(function (route) {
                  	if (typeof route.host === 'undefined' || route.host === '') {
                  		route.host = 'none';
                  	}
                  });
                  
                  return JSON.stringify(routes);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
