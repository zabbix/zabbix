          trigger_prototypes:
            - uuid: 249ebd2d16104b849894db2323019fa0
              expression: |
                min(/OpenShift Cluster by HTTP/openshift.deployment.replicas_mismatched[{#NAMESPACE}/{#DEPLOYMENT}],{$OPENSHIFT.REPLICA.MISMATCH.EVAL_PERIOD:"deployment:{#NAMESPACE}:{#DEPLOYMENT}"})>0
                and last(/OpenShift Cluster by HTTP/openshift.deployment.replicas_desired[{#NAMESPACE}/{#DEPLOYMENT}])>=0
                and last(/OpenShift Cluster by HTTP/openshift.deployment.replicas_available[{#NAMESPACE}/{#DEPLOYMENT}])>=0
              name: 'OpenShift Cluster: Deployment [{#DEPLOYMENT}]: Deployment replicas mismatch'
              opdata: 'Desired: {ITEM.LASTVALUE2}, available: {ITEM.LASTVALUE3}'
              priority: WARNING
              description: 'Deployment has not matched the expected number of replicas during the specified trigger evaluation period.'
              tags:
                - tag: scope
                  value: availability
          parent_discovery_rule:
            key: openshift.namespace.discovery
          master_item:
            key: openshift.state.workload.metrics.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.result[?(@.metric.namespace==''{#NAMESPACE}'' && (@.metric.__name__==''kube_replicaset_owner'' || @.metric.__name__==''kube_pod_owner''))]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - |
                  function getField(data, path, separator, default_value) {
                  	if (typeof separator === 'undefined') {
                  		separator = '.';
                  	}
                  	var steps = path.split(separator);
                  
                  	for (var i = 0; i < steps.length; i++) {
                  		var step = steps[i];
                  
                  		if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
                  			if (typeof default_value === 'undefined') {
                  				throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
                  			}
                  			return default_value;
                  		}
                  
                  		data = data[step];
                  	}
                  
                  	return data;
                  }
                  
                  
                  var rs_deployment = {},
                  	deployments = {};
                  
                  try {
                  	var data = JSON.parse(value);
                  
                  	for (var i = 0; i < data.length; i++) {
                  		var entity = data[i],
                  			metric_name = getField(entity, 'metric.__name__');
                  
                  		if (metric_name === 'kube_replicaset_owner') {
                  			if (getField(entity, 'metric.owner_kind') !== 'Deployment') {
                  				continue;
                  			}
                  
                  			var ns = getField(entity, 'metric.namespace'),
                  				rs = getField(entity, 'metric.replicaset'),
                  				dep = getField(entity, 'metric.owner_name');
                  
                  			rs_deployment[ns + '/' + rs] = dep;
                  		}
                  	}
                  
                  	for (var j = 0; j < data.length; j++) {
                  		var entity = data[j],
                  			metric_name = getField(entity, 'metric.__name__');
                  
                  		if (metric_name === 'kube_pod_owner') {
                  			if (getField(entity, 'metric.owner_kind') !== 'ReplicaSet') {
                  				continue;
                  			}
                  
                  			var ns = getField(entity, 'metric.namespace'),
                  				rs = getField(entity, 'metric.owner_name'),
                  				pod = getField(entity, 'metric.pod'),
                  				dep = rs_deployment[ns + '/' + rs];
                  
                  			if (!dep) {
                  				continue;
                  			}
                  
                  			var key = ns + '/' + dep;
                  
                  			if (!deployments[key]) {
                  				deployments[key] = {
                  					namespace: ns,
                  					deployment: dep,
                  					pods: []
                  				};
                  			}
                  
                  			deployments[key].pods.push(pod);
                  		}
                  	}
                  } catch (error) {
                  	throw 'Failed to preprocess ownership chain from Thanos. Check debug log for more information.';
                  }
                  
                  var result = [];
                  
                  for (var k in deployments) {
                  	var d = deployments[k];
                  
                  	result.push({
                  		'{#DEPLOYMENT}': d.deployment,
                  		'{#POD}': d.pods.join('|')
                  	});
                  }
                  
                  return JSON.stringify(result);
