          name: 'Get network usage metrics'
          type: HTTP_AGENT
          key: openshift.network.usage.metrics.get
          history: '0'
          value_type: JSON
          description: 'Collecting cluster-wide and namespace-level pod network throughput from the Thanos Querier API, distinguished by the `scope` label (`cluster` = cluster-wide total, `namespace` = per-namespace total). Restricted to `interface="eth0"` (the pod''s primary interface): on OVN-Kubernetes clusters cAdvisor also misattributes host-level bridge/tunnel interfaces (br-ex, br-int, veth pairs, etc.) onto every pod''s network stats, which would otherwise inflate the sum.'
