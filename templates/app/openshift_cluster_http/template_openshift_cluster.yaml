              name: 'Deployment [{#DEPLOYMENT}]: CPU: Limits'
              type: DEPENDENT
              key: 'openshift.deployment.limits.cpu[{#NAMESPACE}/{#DEPLOYMENT}]'
              value_type: FLOAT
              description: 'The CPU limits in the deployment calculated as a sum of CPU limits on pods in the Pending or Running phase in the deployment.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data.result[?((@.metric.__name__==''kube_pod_container_resource_limits'' && @.metric.namespace==''{#NAMESPACE}'' && @.metric.pod=~''{#POD}'' && @.metric.resource==''cpu'') || (@.metric.__name__==''kube_pod_status_phase'' && @.metric.namespace==''{#NAMESPACE}'' && @.metric.pod=~''{#POD}'' && @.value[1]==''1'' && (@.metric.phase==''Running'' || @.metric.phase==''Pending'')))]'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function getField(data, path, separator, default_value) {
                      	if (typeof separator === 'undefined') {
                      		separator = '.';
                      	}
                      	var steps = path.split(separator);
                      
                      	for (var i = 0; i < steps.length; i++) {
                      		var step = steps[i];
                      
                      		if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
                      			if (typeof default_value === 'undefined') {
                      				throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
                      			}
                      			return default_value;
                      		}
                      
                      		data = data[step];
                      	}
                      
                      	return data;
                      }
                      
                      
                      try {
                      	var data = JSON.parse(value),
                      		active = {},
                      		sum = 0,
                      		i, row, key;
                      
                      	for (i = 0; i < data.length; i++) {
                      		row = data[i];
                      
                      		if (getField(row, 'metric.__name__') === 'kube_pod_status_phase') {
                      			active[getField(row, 'metric.namespace') + '/' + getField(row, 'metric.pod')] = true;
                      		}
                      	}
                      
                      	for (i = 0; i < data.length; i++) {
                      		row = data[i];
                      
                      		if (getField(row, 'metric.__name__') === 'kube_pod_status_phase') {
                      			continue;
