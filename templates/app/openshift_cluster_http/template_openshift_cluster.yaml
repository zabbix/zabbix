  triggers:
    - uuid: 9fbe70b51b144978b480770cde216a55
      expression: 'max(/OpenShift Cluster by HTTP/openshift.node.ready.count,5m)< {$OPENSHIFT.NODE.NUMBER.THRESHOLD} and min(/OpenShift Cluster by HTTP/openshift.node.count,5m)>0'
      name: 'OpenShift Cluster: Low number of Ready nodes'
      event_name: 'OpenShift Cluster: Low number of Ready nodes'
      opdata: 'Current value: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'The number of Ready nodes in the cluster is less than `{$OPENSHIFT.NODE.NUMBER.THRESHOLD}`.'
      dependencies:
        - name: 'OpenShift Cluster: No Ready nodes'
          expression: 'max(/OpenShift Cluster by HTTP/openshift.node.ready.count,5m)=0 and min(/OpenShift Cluster by HTTP/openshift.node.count,5m)>0'
      tags:
        - tag: scope
          value: availability
    - uuid: fc74528e62d4428099f6f029e6300e34
      expression: 'max(/OpenShift Cluster by HTTP/openshift.node.ready.count,5m)=0 and min(/OpenShift Cluster by HTTP/openshift.node.count,5m)>0'
      name: 'OpenShift Cluster: No Ready nodes'
      event_name: 'OpenShift Cluster: No Ready nodes'
      opdata: 'Current value: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'There are no Ready nodes in the cluster.'
      tags:
