                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function getField(data, path, separator, default_value) {
                      	if (typeof separator === 'undefined') {
                      		separator = '.';
                      	}
                      	var steps = path.split(separator);
                      
                      	for (var i = 0; i < steps.length; i++) {
                      		var step = steps[i];
                      
                      		if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
                      			if (typeof default_value === 'undefined') {
                      				throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
                      			}
                      			return default_value;
                      		}
                      
                      		data = data[step];
                      	}
                      
                      	return data;
                      }
                      
                      
                      try {
                      	var data = JSON.parse(value),
                      		active = {},
                      		sum = 0,
                      		i, row, key;
                      
                      	for (i = 0; i < data.length; i++) {
                      		row = data[i];
                      
                      		if (getField(row, 'metric.__name__') === 'kube_pod_status_phase') {
                      			active[getField(row, 'metric.namespace') + '/' + getField(row, 'metric.pod')] = true;
                      		}
                      	}
                      
                      	for (i = 0; i < data.length; i++) {
                      		row = data[i];
                      
                      		if (getField(row, 'metric.__name__') === 'kube_pod_status_phase') {
                      			continue;
                      		}
                      
                      		key = getField(row, 'metric.namespace') + '/' + getField(row, 'metric.pod');
                      
                      		if (active[key]) {
                      			sum += parseFloat(getField(row, 'value.1'));
                      		}
                      	}
                      } catch (error) {
                      	throw 'Failed to sum resource requests/limits for active pods from Thanos. Check debug log for more information.';
                      }
                      
                      return String(sum);
