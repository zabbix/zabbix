            description: 'The CPU load per core that is considered sustainable.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$OPENSHIFT.NODE.MEMORY.UTIL.CRIT}'
          value: '90'
          description: 'The critical threshold of the node memory utilization expressed in %.'
          config:
            type: TEXT
            priority: '5'
            section_name: Thresholds
            label: 'Memory utilization critical threshold'
            description: 'The critical threshold of the node memory utilization expressed in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$OPENSHIFT.NODE.NAME}'
          description: 'The name of the node as reported by the Kubernetes API. Set automatically by the host prototype of the template `OpenShift Cluster by HTTP`.'
          config:
            type: TEXT
            priority: '1'
            label: 'Node name'
            description: 'The name of the node to collect metrics for.'
            required: 'YES'
        - macro: '{$OPENSHIFT.NODE.NETWORK.IF.EXCLUDE}'
          value: 'lo|veth.*|ovs-system|br-.*|tap.*|tun.*|genev_sys.*|ovn-k8s.*'
          description: 'Network interfaces excluded from the node''s total network receive/transmit, so loopback and OVN-Kubernetes''s own internal bridges/tunnels/veths don''t double-count real traffic.'
          config:
            type: TEXT
            priority: '8'
            section_name: Filters
            label: 'Network interface exclude filter'
            description: 'A regex of network interface (device) names to exclude from the node''s network totals.'
