          url: '{$OPENSHIFT.THANOS.URL}/api/v1/query'
          query_fields:
            - name: query
              value: |
                label_replace(label_replace(sum(rate(container_network_receive_bytes_total{namespace!="", interface="eth0"}[5m])), "scope", "cluster", "", ""), "__name__", "network_receive", "", "")
                  or on(scope, namespace, __name__) label_replace(label_replace(sum by (namespace) (rate(container_network_receive_bytes_total{namespace!="", interface="eth0"}[5m])), "scope", "namespace", "", ""), "__name__", "network_receive", "", "")
                  or on(scope, namespace, __name__) label_replace(label_replace(sum(rate(container_network_transmit_bytes_total{namespace!="", interface="eth0"}[5m])), "scope", "cluster", "", ""), "__name__", "network_transmit", "", "")
                  or on(scope, namespace, __name__) label_replace(label_replace(sum by (namespace) (rate(container_network_transmit_bytes_total{namespace!="", interface="eth0"}[5m])), "scope", "namespace", "", ""), "__name__", "network_transmit", "", "")
          status_codes: '200,400,422,503'
          http_proxy: '{$OPENSHIFT.HTTP.PROXY}'
          headers:
            - name: Authorization
              value: 'Bearer {$OPENSHIFT.THANOS.TOKEN}'
          tags:
            - tag: component
              value: raw
