      macros:
        - macro: '{$OPENSHIFT.HTTP.PROXY}'
          description: 'Sets the HTTP proxy to `http_proxy` value. If this parameter is empty, then no proxy is used.'
          config:
            type: TEXT
            priority: '2'
            section_name: Other
            label: 'HTTP proxy'
            description: 'HTTP proxy to use for requests.'
        - macro: '{$OPENSHIFT.NODE.CPU.UTIL.CRIT}'
          value: '90'
          description: 'The critical threshold of the node CPU utilization expressed in %.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'CPU utilization critical threshold'
            description: 'The critical threshold of the node CPU utilization expressed in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$OPENSHIFT.NODE.FILESYSTEM.UTIL.CRIT}'
          value: '90'
          description: 'The critical threshold of the node filesystem utilization expressed in %.'
          config:
            type: TEXT
            priority: '7'
            section_name: Thresholds
            label: 'Filesystem utilization critical threshold'
            description: 'The critical threshold of the node filesystem utilization expressed in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$OPENSHIFT.NODE.FILESYSTEM.UTIL.WARN}'
          value: '80'
          description: 'The warning threshold of the node filesystem utilization expressed in %.'
          config:
            type: TEXT
            priority: '6'
            section_name: Thresholds
            label: 'Filesystem utilization warning threshold'
            description: 'The warning threshold of the node filesystem utilization expressed in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$OPENSHIFT.NODE.LOAD_AVG_PER_CPU.MAX.WARN}'
