      discovery_rules:
        - uuid: e4ef3a0c862d453c8a5395aae76d3843
          name: 'OpenShift Alert discovery'
          type: DEPENDENT
          key: openshift.alert.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ALERTNAME}'
                value: '{$OPENSHIFT.LLD.FILTER.ALERT.MATCHES}'
              - macro: '{#ALERTNAME}'
                value: '{$OPENSHIFT.LLD.FILTER.ALERT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#SEVERITY}'
                value: '{$OPENSHIFT.LLD.FILTER.ALERT.SEVERITY.MATCHES}'
          lifetime: '0'
          item_prototypes:
            - uuid: 3f1a7c9e2b4d4f6a8c0d1e2f3a4b5c6d
              name: 'Alert [{#ALERTNAME}]: State'
              type: DEPENDENT
              key: 'openshift.alert.state[{#ALERTNAME}]'
              description: 'The current state of the alert in Prometheus/Alertmanager: Firing if the alert condition is true and its `for` duration has elapsed, Pending while that duration is still counting down. "Silenced" and "Not firing" (shown in the OpenShift console) are Alertmanager-level states not exposed via the `ALERTS` metric and cannot be derived here.'
              valuemap:
                name: 'Alert state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data.result[?(@.metric.__name__==''ALERTS'' && @.metric.alertname==''{#ALERTNAME}'')].metric.alertstate.first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var idx = {firing: 1, pending: 2};
                      return typeof idx[value] === 'undefined' ? 0 : idx[value];
              master_item:
                key: openshift.platform.health.metrics.get
              tags:
                - tag: alertname
                  value: '{#ALERTNAME}'
                - tag: component
                  value: alert
                - tag: severity
                  value: '{#SEVERITY}'
              trigger_prototypes:
                - uuid: a785e56a10f242d8a1558853529e8ce6
                  expression: 'last(/OpenShift Cluster by HTTP/openshift.alert.state[{#ALERTNAME}])=1'
                  name: 'OpenShift Cluster: OpenShift alert firing: {#ALERTNAME}'
                  priority: WARNING
                  description: 'This OpenShift alert is currently firing in Prometheus/Alertmanager. Check the cluster console''s Alerting page for details.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: openshift.platform.health.metrics.get
          lld_macro_paths:
            - lld_macro: '{#ALERTNAME}'
              path: $.alertname
            - lld_macro: '{#SEVERITY}'
              path: $.severity
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.result[?(@.metric.__name__==''ALERTS'')].metric'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function getField(data, path, separator, default_value) {
                  	if (typeof separator === 'undefined') {
                  		separator = '.';
                  	}
                  	var steps = path.split(separator);
                  
                  	for (var i = 0; i < steps.length; i++) {
                  		var step = steps[i];
                  
                  		if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
                  			if (typeof default_value === 'undefined') {
                  				throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
                  			}
                  			return default_value;
                  		}
                  
                  		data = data[step];
                  	}
                  
                  	return data;
                  }
                  
                  
                  try {
                  	var data = JSON.parse(value),
                  		seen = {},
                  		result = [];
                  
                  	for (var i = 0; i < data.length; i++) {
                  		var row = data[i],
                  			key = getField(row, 'alertname');
                  
                  		if (seen[key]) {
                  			continue;
                  		}
                  
                  		seen[key] = true;
                  		result.push(row);
                  	}
                  } catch (error) {
                  	throw 'Failed to deduplicate alerts from Thanos. Check debug log for more information.';
                  }
                  
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          overrides:
            - name: 'Trigger severity info'
              step: '1'
              stop: STOP
              filter:
                conditions:
                  - macro: '{#SEVERITY}'
                    value: info
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'OpenShift alert firing: *'
                  discover: DISCOVER
                  status: ENABLED
                  severity: INFO
            - name: 'Trigger severity warn'
              step: '2'
              stop: STOP
              filter:
                conditions:
                  - macro: '{#SEVERITY}'
                    value: warning
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'OpenShift alert firing: *'
                  discover: DISCOVER
                  status: ENABLED
                  severity: WARNING
            - name: 'Trigger severity critical'
              step: '3'
              stop: STOP
              filter:
                conditions:
                  - macro: '{#SEVERITY}'
                    value: critical
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'OpenShift alert firing: *'
                  discover: DISCOVER
                  status: ENABLED
                  severity: AVERAGE
            - name: 'Trigger severity none'
              step: '4'
              stop: STOP
              filter:
                conditions:
                  - macro: '{#SEVERITY}'
                    value: none
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'OpenShift alert firing: *'
                  discover: DISCOVER
                  status: ENABLED
                  severity: NOT_CLASSIFIED
