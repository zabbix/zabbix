        - uuid: 6de61fb671954b84815ee009d9b392b2
          name: 'Node discovery'
          type: DEPENDENT
          key: openshift.node.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#LABELS}'
                value: '{$OPENSHIFT.LLD.FILTER.NODE.LABEL_MATCHES}'
              - macro: '{#NAME}'
                value: '{$OPENSHIFT.LLD.FILTER.NODE.MATCHES}'
              - macro: '{#NAME}'
                value: '{$OPENSHIFT.LLD.FILTER.NODE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: '0'
          host_prototypes:
            - uuid: cec734c665b54a968984d8dd8cb598b9
              host: 'OpenShift Node {#UUID}'
              name: 'OpenShift Node {#NAME}'
              group_links:
                - group:
                    name: Applications
              group_prototypes:
                - name: 'OpenShift/Node {#NAME}'
              templates:
                - name: 'OpenShift Node by HTTP'
              macros:
                - macro: '{$OPENSHIFT.NODE.NAME}'
                  value: '{#NAME}'
              tags:
                - tag: addr
                  value: '{#OPENSHIFT.NODE.IP}'
                - tag: kernel
                  value: '{#KERNEL}'
                - tag: os-image
                  value: '{#OS.IMAGE}'
          master_item:
            key: openshift.state.node.metrics.get
          lld_macro_paths:
            - lld_macro: '{#KERNEL}'
              path: $.kernel_version
            - lld_macro: '{#LABELS}'
              path: $.labels_joined
            - lld_macro: '{#NAME}'
              path: $.node
            - lld_macro: '{#OPENSHIFT.NODE.IP}'
              path: $.internal_ip
            - lld_macro: '{#OS.IMAGE}'
              path: $.os_image
            - lld_macro: '{#UUID}'
              path: $.system_uuid
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data.result[?(@.metric.__name__==''kube_node_info'' || @.metric.__name__==''kube_node_labels'')].metric'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function getField(data, path, separator, default_value) {
                  	if (typeof separator === 'undefined') {
                  		separator = '.';
                  	}
                  	var steps = path.split(separator);
                  
                  	for (var i = 0; i < steps.length; i++) {
                  		var step = steps[i];
                  
                  		if (typeof data !== 'object' || data === null || typeof data[step] === 'undefined') {
                  			if (typeof default_value === 'undefined') {
                  				throw 'Required field was not found: "' + path + '". Data: ' + JSON.stringify(data);
                  			}
                  			return default_value;
                  		}
                  
                  		data = data[step];
                  	}
                  
                  	return data;
                  }
                  
                  
                  try {
                  	var data = JSON.parse(value),
                  		labels = {},
                  		result = [];
                  
                  	for (var i = 0; i < data.length; i++) {
                  		var metric = data[i];
                  
                  		if (getField(metric, '__name__') !== 'kube_node_labels') {
                  			continue;
                  		}
                  
                  		var parts = [];
                  
                  		for (var key in metric) {
                  			if (key.indexOf('label_') === 0) {
                  				parts.push(key.substring(6) + '=' + metric[key]);
                  			}
                  		}
                  		labels[getField(metric, 'node')] = parts.join(',');
                  	}
                  
                  	for (var j = 0; j < data.length; j++) {
                  		var entity = data[j];
                  
                  		if (getField(entity, '__name__') !== 'kube_node_info') {
                  			continue;
                  		}
                  
                  		entity.labels_joined = labels[getField(entity, 'node')] || '';
                  		result.push(entity);
                  	}
                  } catch (error) {
                  	throw 'Failed to preprocess node labels from Thanos. Check debug log for more information.';
                  }
                  
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
