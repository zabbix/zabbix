  templates:
    - uuid: 2c0b90207e31422a95558e005a635e92
      template: 'OpenShift Cluster by HTTP'
      name: 'OpenShift Cluster by HTTP'
      description: |
        The template to monitor an OpenShift Cluster.
        
        It collects metrics by HTTP agent from the built-in Thanos Querier, which already
        federates kube-state-metrics, node-exporter, cAdvisor and openshift-state-metrics
        cluster-wide behind one authenticated route, so no in-cluster agent or additional
        scraping component is required.
        
        Besides vanilla Kubernetes objects (nodes, namespaces, deployments, pods), the template
        also discovers OpenShift-specific objects: Routes, BuildConfigs, Builds and
        ClusterResourceQuotas.
        
        Each discovered node is created as a separate host with the template `OpenShift Node by HTTP`
        linked, so node resources are monitored separately from the cluster-level metrics.
        
        Don't forget to change macros {$OPENSHIFT.THANOS.URL} and {$OPENSHIFT.THANOS.TOKEN}.
        
        Some counters available in vanilla Kubernetes (Job, Endpoint, Ingress objects; running
        container count) have no equivalent in OpenShift's built-in kube-state-metrics allow-list
        and are therefore not collected by this template.
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback.
        
        Generated by official Zabbix template tool "Templator"
      wizard_ready: 'YES'
      readme: |
        ## Overview
        
        The template to monitor an OpenShift Cluster.
        It collects cluster-, namespace-, deployment- and pod-level metrics by HTTP agent directly from the built-in Thanos Querier route (PromQL `/api/v1/query`), which already federates kube-state-metrics, node-exporter, cAdvisor and openshift-state-metrics cluster-wide, so no in-cluster agent or additional scrape target is required.
        
        Besides vanilla Kubernetes objects, the template also discovers OpenShift-specific objects: Routes, BuildConfigs, Builds and ClusterResourceQuotas.
        
        Cluster-wide filesystem and pod network throughput are also collected, along with currently firing Prometheus alerts (discovered via LLD, one item and trigger per active alert name).
        
        **Note:** Some counters available in vanilla Kubernetes (Job, Endpoint and Ingress object counts; running container count) have no equivalent in OpenShift's built-in kube-state-metrics allow-list and are therefore not collected by this template.
        
        ## Setup
        
        Get the Thanos Querier route host:
        
        `oc get route thanos-querier -n openshift-monitoring -o jsonpath='{.spec.host}'`
        
        Set the `Thanos Querier URL` field to `https://<route host>`.
        
        Create a ServiceAccount and bind it to a ClusterRole that can read cluster monitoring data, for example:
        
        ```
        oc create serviceaccount zabbix -n openshift-monitoring
        oc adm policy add-cluster-role-to-user cluster-monitoring-view -z zabbix -n openshift-monitoring
        oc create token zabbix -n openshift-monitoring --duration=8760h
        ```
        
        Set the resulting token to the field `Thanos API Token`.
        
        Each discovered node is created as a separate host with the template `OpenShift Node by HTTP` linked. To collect node metrics, also define the `{$OPENSHIFT.THANOS.URL}` and `{$OPENSHIFT.THANOS.TOKEN}` macros on the global level, with the token as a secret macro: discovered hosts do not take macros from the cluster host.
        
        Set up the fields to filter discovered nodes by name:
        
        - `Node matches filter`
        - `Node exclude filter`
        
        Set up fields to filter metrics by namespace:
        
        - `Namespace matches filter`
        - `Namespace exclude filter`
        
        You can also set up evaluation periods for replica mismatch triggers (Deployments) with the field `Replica mismatch evaluation period`, which supports context and regular expressions.
        
        **Note:** On a large cluster, LLD discovery can create a large number of items. Set `Namespace exclude filter` (for example, to `^(openshift|kube)-.*`) to exclude platform namespaces and keep the item count manageable.
        
        tested_on: OpenShift v4.22
      vendor:
        name: Zabbix
        version: 8.2-0
