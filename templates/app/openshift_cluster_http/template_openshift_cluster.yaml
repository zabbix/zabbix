                  or on(namespace, __name__) label_replace(sum by (namespace) (kube_pod_container_resource_requests{resource="memory"} * on(namespace, pod) group_left() max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"})), "__name__", "openshift_active_pod_requests_memory", "", "")
