        The template to monitor an OpenShift Node.
        It collects the metrics of a single node (readiness, schedulability, allocatable resources, CPU, load average, memory, filesystem and uptime) by HTTP agent from the built-in Thanos Querier route, filtering the federated kube-state-metrics and node-exporter series by the node name.
        
        **Note:** Some metrics may not be collected depending on your OpenShift version and configuration.
        
        ## Setup
        
        This template is used in low-level discovery and will be auto-assigned to the node host prototypes of the template `OpenShift Cluster by HTTP`. Additional configuration of the template is not required.
        
        The discovered node hosts need the `{$OPENSHIFT.THANOS.URL}` and `{$OPENSHIFT.THANOS.TOKEN}` macros: define them on the global level, with the token as a secret macro.
        
