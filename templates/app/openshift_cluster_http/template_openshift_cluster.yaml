    - uuid: d785aed5aa7346a1bd8449fbff0fa6c3
      expression: 'min(/OpenShift Node by HTTP/openshift.node.load1,5m)/last(/OpenShift Node by HTTP/openshift.node.cpu_cores)>{$OPENSHIFT.NODE.LOAD_AVG_PER_CPU.MAX.WARN} and last(/OpenShift Node by HTTP/openshift.node.load5)>0 and last(/OpenShift Node by HTTP/openshift.node.load15)>0'
      name: 'OpenShift Node: Load average is too high'
      event_name: 'OpenShift Node: Load average is too high (per CPU load over {$OPENSHIFT.NODE.LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
      opdata: 'Load averages(1m 5m 15m): ({ITEM.LASTVALUE1} {ITEM.LASTVALUE3} {ITEM.LASTVALUE4}), # of CPUs: {ITEM.LASTVALUE2}'
      priority: AVERAGE
      description: 'The load average per CPU is too high. The system might be slow to respond.'
      dependencies:
        - name: 'OpenShift Node: High CPU utilization'
          expression: 'min(/OpenShift Node by HTTP/openshift.node.cpu_utilization,5m) > {$OPENSHIFT.NODE.CPU.UTIL.CRIT}'
      tags:
        - tag: scope
          value: performance
