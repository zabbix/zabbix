          value_type: JSON
          description: 'Collecting namespace- and pod-level CPU/memory usage, and namespace-level ephemeral filesystem usage, from the Thanos Querier API, pre-aggregated server-side by PromQL instead of client-side, distinguished by the `scope` label (`namespace` = per-namespace total, `pod` = per-pod total used to roll up per-deployment totals).'
          timeout: 30s
