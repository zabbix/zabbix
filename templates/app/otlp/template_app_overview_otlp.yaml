          lookback_limit: '{$OTLP.LOOPBACK:logs}'
          granularity: '{$OTLP.GRANULARITY:logs}'
          query:
            signal_type: LOGS
            columns:
              - column: SeverityNumber
            aggregated_columns:
              - alias: count
          tags:
            - tag: apm
              value: logs
            - tag: component
              value: raw
