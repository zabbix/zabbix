  triggers:
    - uuid: c2ec448548c947ddb9b046170f281ff6
      expression: 'max(/Unbound by HTTP/unbound.cache.hit.ratio,#5)<{$UNBOUND.CACHE.HIT_RATIO.MIN.WARN} and min(/Unbound by HTTP/unbound.queries.rate,#5)>0'
      name: 'Unbound: Cache hit ratio is low'
      event_name: 'Unbound: Cache hit ratio is low (less than {$UNBOUND.CACHE.HIT_RATIO.MIN.WARN}% for 5 consecutive measurements)'
      opdata: 'Current value: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'The cache hit ratio has remained below `{$UNBOUND.CACHE.HIT_RATIO.MIN.WARN}`% while DNS queries were continuously received.'
      dependencies:
        - name: 'Unbound: Failed to collect metrics'
          expression: 'max(/Unbound by HTTP/unbound.service.status,#3)=0 and nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=0'
        - name: 'Unbound: Failed to fetch metrics data'
          expression: 'nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=1'
      tags:
        - tag: scope
          value: performance
