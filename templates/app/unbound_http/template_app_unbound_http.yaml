zabbix_export:
  version: '8.2'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 73db7bd5597b4b10a1bec4a0a2bb1819
      template: 'Unbound by HTTP'
      name: 'Unbound by HTTP'
      description: |
        Get Unbound metrics by HTTP agent from the unbound_exporter metrics endpoint.
        Install and configure unbound_exporter, enable the Unbound remote-control interface, and set the {$UNBOUND.URL} macro to the exporter base URL that is reachable from the Zabbix server or proxy.
        See https://github.com/letsencrypt/unbound_exporter for installation and configuration instructions.
        You can discuss this template or leave feedback on our forum: https://www.zabbix.com/forum/zabbix-suggestions-and-feedback.
        
        Generated by official Zabbix template tool "Templator"
      wizard_ready: 'YES'
      readme: |
        ## Overview
        
        This template is designed to monitor an Unbound DNS resolver with Zabbix using the Prometheus metrics endpoint exposed by unbound_exporter.
        
        The template collects resolver metrics such as:
        - request count and rate
        - cache hits and misses
        - cache hit ratio
        - recursion time
        - cache and module memory usage
        - request list pressure and overwritten requests
        
        ## Setup
        
        1. Install [unbound_exporter](https://github.com/letsencrypt/unbound_exporter) on the Unbound host or on a host that can reach the Unbound control interface.
        
        2. Enable the Unbound control interface in `unbound.conf`:
        
           ```text
           remote-control:
             control-enable: yes
             control-interface: /run/unbound.ctl
           ```
        
        3. Run the exporter using the configured control socket:
        
           ```text
           unbound_exporter -unbound.ca "" -unbound.cert "" -unbound.host "unix:///run/unbound.ctl"
           ```
        
        4. Make sure the exporter exposes Prometheus metrics on HTTP. The default endpoint is usually:
           `http://<host>:9167/metrics`
        
        5. Check that the exporter is reachable before assigning the template:
           `curl http://<host>:9167/metrics | grep unbound_up`
        
        6. In the host wizard, set the exporter URL in the field:
           `Exporter URL`
        
           The exporter URL must be reachable from the Zabbix server or Zabbix proxy that performs the HTTP check. When Zabbix and unbound_exporter run in containers, use a hostname that is reachable from the Zabbix server container.
        
           Example:
           `http://localhost:9167`
        
        7. If your exporter is behind a firewall, allow access from the Zabbix server or proxy.
      vendor:
        name: Zabbix
        version: 8.2-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: 1e66f20f5b024853946fd62a8561d857
          name: 'Cache: Hit ratio'
          type: CALCULATED
          key: unbound.cache.hit.ratio
          value_type: FLOAT
          units: '%'
          params: |
            last(//unbound.cache.hits.rate) * 100 /
            (last(//unbound.cache.hits.rate) + last(//unbound.cache.misses.rate) + (last(//unbound.cache.hits.rate) + last(//unbound.cache.misses.rate)=0))
          description: 'Percentage of cache hits calculated from cache hit and miss rates for the latest polling interval.'
          tags:
            - tag: component
              value: cache
        - uuid: 51ff0745eb554bab903234f115af3580
          name: 'Cache: Hits, rate'
          type: DEPENDENT
          key: unbound.cache.hits.rate
          value_type: FLOAT
          units: '!rps'
          description: 'Number of cache hits per second across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_cache_hits_total
                - function
                - sum
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: cache
        - uuid: e859e6c2898045a89c74fe7e279763e5
          name: 'Cache: Hits, total'
          type: DEPENDENT
          key: unbound.cache.hits.total
          description: 'Total number of cache hits across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_cache_hits_total
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: cache
        - uuid: 85625939b83346cbab32e019ca97b8bf
          name: 'Cache: Miss ratio'
          type: CALCULATED
          key: unbound.cache.miss.ratio
          value_type: FLOAT
          units: '%'
          params: |
            last(//unbound.cache.misses.rate) * 100 /
            (last(//unbound.cache.hits.rate) + last(//unbound.cache.misses.rate) + (last(//unbound.cache.hits.rate) + last(//unbound.cache.misses.rate)=0))
          description: 'Percentage of cache misses calculated from cache hit and miss rates for the latest polling interval.'
          tags:
            - tag: component
              value: cache
        - uuid: 0d2431cdaa1c42898bab0bd5f90f0936
          name: 'Cache: Misses, rate'
          type: DEPENDENT
          key: unbound.cache.misses.rate
          value_type: FLOAT
          units: '!rps'
          description: 'Number of cache misses per second across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_cache_misses_total
                - function
                - sum
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: cache
        - uuid: 37ad6656b88d45f1a7509856e5f52c85
          name: 'Cache: Misses, total'
          type: DEPENDENT
          key: unbound.cache.misses.total
          description: 'Total number of cache misses across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_cache_misses_total
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: cache
        - uuid: 25567a6988c94660968470165c0e8992
          name: 'Get exporter metrics'
          type: HTTP_AGENT
          key: unbound.metrics.get
          history: '0'
          value_type: TEXT
          description: 'Get raw Unbound metrics from the exporter.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: '{$UNBOUND.TIMEOUT}'
          url: '{$UNBOUND.URL}/metrics'
          http_proxy: '{$UNBOUND.HTTP.PROXY}'
          tags:
            - tag: component
              value: raw
        - uuid: f9c6bfb16e13408f9a057fbe39523e1a
          name: 'Queries, rate'
          type: DEPENDENT
          key: unbound.queries.rate
          value_type: FLOAT
          units: '!rps'
          description: 'Number of DNS queries received per second across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_queries_total
                - function
                - sum
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
        - uuid: c488aa46baf2405b9510a49f6f26f749
          name: 'Queries, total'
          type: DEPENDENT
          key: unbound.queries.total
          description: 'Total number of DNS queries received across all Unbound threads.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_queries_total
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
        - uuid: 15a41cba00f347c19e63837c62e612e9
          name: 'Recursion time, average'
          type: DEPENDENT
          key: unbound.recursion.time.avg
          value_type: FLOAT
          units: s
          description: 'Average time required to answer queries that needed recursive processing, excluding cached queries.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_recursion_time_seconds_avg
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
          triggers:
            - uuid: 38f85c09fcd2409b87d299978b35876d
              expression: 'min(/Unbound by HTTP/unbound.recursion.time.avg,5m)>{$UNBOUND.RECURSION.TIME.MAX.WARN}'
              name: 'Unbound: Average recursion time is high'
              event_name: 'Unbound: Average recursion time is high (over {$UNBOUND.RECURSION.TIME.MAX.WARN}s for 5m)'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The average recursive request processing time has remained above `{$UNBOUND.RECURSION.TIME.MAX.WARN}` seconds for 5 minutes.'
              dependencies:
                - name: 'Unbound: Failed to collect metrics'
                  expression: 'max(/Unbound by HTTP/unbound.service.status,#3)=0 and nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=0'
                - name: 'Unbound: Failed to fetch metrics data'
                  expression: 'nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=1'
              tags:
                - tag: scope
                  value: performance
        - uuid: 978dac84b64446328c942be78d380bb8
          name: 'Recursion time, median'
          type: DEPENDENT
          key: unbound.recursion.time.median
          value_type: FLOAT
          units: s
          description: 'Median time required to answer queries that needed recursive processing.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_recursion_time_seconds_median
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
        - uuid: d1d8d651f0c14126880aad786a4f1b50
          name: 'Request list: Exceeded, rate'
          type: DEPENDENT
          key: unbound.request.list.exceeded.rate
          value_type: FLOAT
          units: '!rps'
          description: 'Number of queries per second across all Unbound threads that were dropped because the request list was full.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_request_list_exceeded_total
                - function
                - sum
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
          triggers:
            - uuid: ad1b00f2cc5c440597d58ac99b893044
              expression: 'max(/Unbound by HTTP/unbound.request.list.exceeded.rate,5m)>0'
              name: 'Unbound: Dropped requests detected'
              opdata: 'Current rate: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Queries were dropped in the last 5 minutes because the Unbound request list was full.'
              dependencies:
                - name: 'Unbound: Failed to collect metrics'
                  expression: 'max(/Unbound by HTTP/unbound.service.status,#3)=0 and nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=0'
                - name: 'Unbound: Failed to fetch metrics data'
                  expression: 'nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=1'
              tags:
                - tag: scope
                  value: performance
        - uuid: b0c28a4c579c4d63bbfa53ed6fd986b1
          name: 'Request list: Exceeded, total'
          type: DEPENDENT
          key: unbound.request.list.exceeded.total
          units: '!requests'
          description: 'Total number of queries across all Unbound threads that were dropped because the request list was full.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_request_list_exceeded_total
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
        - uuid: e4b1a35899044ee585a3519bd47957b1
          name: 'Request list: Overwritten, rate'
          type: DEPENDENT
          key: unbound.request.list.overwritten.rate
          value_type: FLOAT
          units: '!rps'
          description: 'Number of requests per second across all Unbound threads that were overwritten by newer request list entries.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_request_list_overwritten_total
                - function
                - sum
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
          triggers:
            - uuid: 480c3ccaf6044246827cfea95cb04ff4
              expression: 'max(/Unbound by HTTP/unbound.request.list.overwritten.rate,5m)>0'
              name: 'Unbound: Overwritten requests detected'
              opdata: 'Current rate: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Requests were overwritten by newer Unbound request list entries in the last 5 minutes.'
              dependencies:
                - name: 'Unbound: Failed to collect metrics'
                  expression: 'max(/Unbound by HTTP/unbound.service.status,#3)=0 and nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=0'
                - name: 'Unbound: Failed to fetch metrics data'
                  expression: 'nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=1'
              tags:
                - tag: scope
                  value: performance
        - uuid: 9ab2e04411e64216bf44381c8e6f2f59
          name: 'Request list: Overwritten, total'
          type: DEPENDENT
          key: unbound.request.list.overwritten.total
          units: '!requests'
          description: 'Total number of requests across all Unbound threads that were overwritten by newer request list entries.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_request_list_overwritten_total
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: queries
        - uuid: a829a9499c754d35acdb02a8f10e7d34
          name: 'Service status'
          type: DEPENDENT
          key: unbound.service.status
          trends: '0'
          description: 'Indicates whether unbound_exporter successfully collected metrics from the Unbound resolver.'
          valuemap:
            name: 'Unbound service status'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_up
                - value
                - ''
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 188c43675a2a4100a22d9903005c941b
              expression: 'max(/Unbound by HTTP/unbound.service.status,#3)=0 and nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=0'
              name: 'Unbound: Failed to collect metrics'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The unbound_exporter cannot collect metrics from the Unbound resolver.'
              tags:
                - tag: scope
                  value: availability
            - uuid: c662e3f2fd114d3fb540394b18c6a05f
              expression: 'nodata(/Unbound by HTTP/unbound.service.status,{$UNBOUND.NODATA_TIMEOUT})=1'
              name: 'Unbound: Failed to fetch metrics data'
              event_name: 'Unbound: Failed to fetch metrics data (or no data for {$UNBOUND.NODATA_TIMEOUT})'
              priority: WARNING
              description: 'Zabbix has not received Unbound metrics for `{$UNBOUND.NODATA_TIMEOUT}`.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 507881a0cdec4ae1bd750a0953c5fec9
          name: Uptime
          type: DEPENDENT
          key: unbound.uptime
          value_type: FLOAT
          units: uptime
          description: 'Unbound resolver uptime.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - unbound_time_up_seconds_total
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: unbound.metrics.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 8573b51843bb4507afdf8d5f63538f96
              expression: 'last(/Unbound by HTTP/unbound.uptime)<10m'
              name: 'Unbound: Resolver has been restarted'
              event_name: 'Unbound: Resolver has been restarted (uptime < 10m)'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'The Unbound resolver has been restarted recently.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
      discovery_rules:
        - uuid: f7adc055039d456180f29e0064379be1
          name: 'Cache memory discovery'
          type: DEPENDENT
          key: unbound.memory.cache.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CACHE}'
                value: '{$UNBOUND.LLD.FILTER.CACHE.MATCHES}'
              - macro: '{#CACHE}'
                value: '{$UNBOUND.LLD.FILTER.CACHE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers Unbound cache memory metrics.'
          item_prototypes:
            - uuid: 255b570d7d0143e3a7520d74ab44c3f6
              name: 'Cache [{#CACHE}]: Memory usage'
              type: DEPENDENT
              key: 'unbound.memory.cache.bytes["{#CACHE}"]'
              units: B
              description: 'Amount of memory used by the Unbound cache `{#CACHE}`.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'unbound_memory_caches_bytes{cache="{#CACHE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: unbound.metrics.get
              tags:
                - tag: cache
                  value: '{#CACHE}'
                - tag: component
                  value: memory
          master_item:
            key: unbound.metrics.get
          lld_macro_paths:
            - lld_macro: '{#CACHE}'
              path: $.cache
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - unbound_memory_caches_bytes
            - type: JAVASCRIPT
              parameters:
                - |
                  var cache_names = JSON.parse(value).map(function (metric) {
                  	return metric.labels.cache;
                  });
                  
                  cache_names.sort();
                  
                  return JSON.stringify(cache_names.map(function (cache_name) {
                  	return {cache: cache_name};
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: a8e5ffe98e514a9eb144958e89ac78da
          name: 'Module memory discovery'
          type: DEPENDENT
          key: unbound.memory.module.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#MODULE}'
                value: '{$UNBOUND.LLD.FILTER.MODULE.MATCHES}'
              - macro: '{#MODULE}'
                value: '{$UNBOUND.LLD.FILTER.MODULE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers Unbound module memory metrics.'
          item_prototypes:
            - uuid: 10b00bb735b249ebbf134549ccf1adc0
              name: 'Module [{#MODULE}]: Memory usage'
              type: DEPENDENT
              key: 'unbound.memory.module.bytes["{#MODULE}"]'
              units: B
              description: 'Amount of memory used by the Unbound module `{#MODULE}`.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'unbound_memory_modules_bytes{module="{#MODULE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: unbound.metrics.get
              tags:
                - tag: component
                  value: memory
                - tag: module
                  value: '{#MODULE}'
          master_item:
            key: unbound.metrics.get
          lld_macro_paths:
            - lld_macro: '{#MODULE}'
              path: $.module
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - unbound_memory_modules_bytes
            - type: JAVASCRIPT
              parameters:
                - |
                  var module_names = JSON.parse(value).map(function (metric) {
                  	return metric.labels.module;
                  });
                  
                  module_names.sort();
                  
                  return JSON.stringify(module_names.map(function (module_name) {
                  	return {module: module_name};
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: software
        - tag: target
          value: unbound
      macros:
        - macro: '{$UNBOUND.CACHE.HIT_RATIO.MIN.WARN}'
          value: '50'
          description: 'The minimum cache hit ratio percentage for the warning trigger expression.'
          config:
            type: TEXT
            priority: '4'
            section_name: Thresholds
            label: 'Minimum cache hit ratio'
            description: 'Minimum cache hit ratio percentage before a warning is generated. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$UNBOUND.HTTP.PROXY}'
          description: 'HTTP proxy used for requests to unbound_exporter.'
          config:
            type: TEXT
            priority: '10'
            section_name: Other
            label: 'HTTP proxy'
            description: 'Optional HTTP proxy used for requests to unbound_exporter.'
        - macro: '{$UNBOUND.LLD.FILTER.CACHE.MATCHES}'
          value: '.*'
          description: 'Filter to include discovered Unbound caches by name.'
          config:
            type: TEXT
            priority: '6'
            section_name: Filters
            label: 'Cache filter (include)'
            description: 'Filter to include discovered Unbound caches by name.'
        - macro: '{$UNBOUND.LLD.FILTER.CACHE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filter to exclude discovered Unbound caches by name.'
          config:
            type: TEXT
            priority: '7'
            section_name: Filters
            label: 'Cache filter (exclude)'
            description: 'Filter to exclude discovered Unbound caches by name.'
        - macro: '{$UNBOUND.LLD.FILTER.MODULE.MATCHES}'
          value: '.*'
          description: 'Filter to include discovered Unbound modules by name.'
          config:
            type: TEXT
            priority: '8'
            section_name: Filters
            label: 'Module filter (include)'
            description: 'Filter to include discovered Unbound modules by name.'
        - macro: '{$UNBOUND.LLD.FILTER.MODULE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filter to exclude discovered Unbound modules by name.'
          config:
            type: TEXT
            priority: '9'
            section_name: Filters
            label: 'Module filter (exclude)'
            description: 'Filter to exclude discovered Unbound modules by name.'
        - macro: '{$UNBOUND.NODATA_TIMEOUT}'
          value: 10m
          description: 'The time threshold after which Unbound metrics are considered unavailable. Used in trigger expressions.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Time since the last metric was received'
            description: 'Threshold value of time since the last metric was received from unbound_exporter.'
            required: 'YES'
        - macro: '{$UNBOUND.RECURSION.TIME.MAX.WARN}'
          value: '1'
          description: 'The maximum average recursion time in seconds for the warning trigger expression.'
          config:
            type: TEXT
            priority: '5'
            section_name: Thresholds
            label: 'Maximum average recursion time'
            description: 'Maximum permitted average recursion time in seconds before a warning is generated. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$UNBOUND.TIMEOUT}'
          value: '15'
          description: 'HTTP request timeout for exporter polling, in seconds.'
          config:
            type: TEXT
            priority: '2'
            section_name: Other
            label: 'HTTP timeout'
            description: 'HTTP request timeout from 1 to 600 seconds. In the range from 1 to 600 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$UNBOUND.URL}'
          description: 'URL of the unbound_exporter instance without a trailing slash, e.g., `https://localhost:9167`.'
          config:
            type: TEXT
            priority: '1'
            label: 'Exporter URL'
            description: 'URL of the unbound_exporter instance without a trailing slash, e.g., `https://localhost:9167`.'
            required: 'YES'
      dashboards:
        - uuid: 5a3194b772dc4cb78a5a72b7c181f171
          name: Unbound
          display_period: '3600'
          pages:
            - name: 'Unbound: Overview'
              widgets:
                - type: item
                  name: 'Service status'
                  width: '8'
                  height: '4'
                  hide_header: 'YES'
                  fields:
                    - type: STRING
                      name: bg_color
                      value: E45959
                    - type: INTEGER
                      name: decimal_places
                      value: '0'
                    - type: INTEGER
                      name: decimal_size
                      value: '13'
