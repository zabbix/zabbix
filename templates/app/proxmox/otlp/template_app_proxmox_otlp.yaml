zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 866dc6d0116844298052ae62af0b99f3
      template: 'Proxmox VE by OTLP'
      name: 'Proxmox VE by OTLP'
      description: |
        Proxmox VE node monitoring over OpenTelemetry telemetry stored in ClickHouse.
        Requires a metric server of the OpenTelemetry (OTLP) type configured in Proxmox VE; every item is a direct Telemetry query filtered by service and metric name.
        
        Generated by official Zabbix template tool "Templator"
      wizard_ready: 'YES'
      readme: |
        ## Overview
        
        The template monitors a Proxmox VE node from its OpenTelemetry metric stream stored in the APM (ClickHouse) backend, using Telemetry query items.
        It covers the node itself: CPU, load, memory, swap, ZFS ARC, root filesystem and uptime.
        
        ## Setup
        
        1. In the Proxmox VE web interface, add a metric server of the OpenTelemetry (OTLP) type (`Datacenter` > `Metric Server` > `Add` > `OpenTelemetry`) and point it at your OTLP collector.
        2. Make sure the OTLP collector exports the received metrics into the ClickHouse database (service name `proxmox-ve`).
        3. Configure `TelemetryProvider` on Zabbix server/proxy to point at that ClickHouse database.
        4. Link the template to a host.
      vendor:
        name: Zabbix
        version: 8.0-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: ef858bc5502d4c73b386b4c28c32fdea
          name: 'Number of CPUs'
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.cpu.count
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          units: '!CPU'
          description: 'Number of CPU threads of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_cpustat_cpus
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: cpu
        - uuid: 26915f994e9b4467874b0024cd868556
          name: 'CPU idle time, rate'
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.cpu.idle.rate
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          value_type: FLOAT
          units: '!CPU'
          description: 'Idle CPU seconds per second, averaged over the 1m aggregation bucket (idle CPU cores).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
            - type: SIMPLE_CHANGE
            - type: MULTIPLIER
              parameters:
                - '0.00016666666667'
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_cpustat_idle_total
                - column: ServiceName
                  value: proxmox-ve
          tags:
