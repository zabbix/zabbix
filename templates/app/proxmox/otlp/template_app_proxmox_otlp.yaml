          key: proxmox.otlp.node.mem.total
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          units: B
          description: 'Total memory of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_memory_memtotal
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: memory
        - uuid: d9573287f3274326a7905d6a71539370
          name: 'Memory: Used'
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.mem.used
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          value_type: FLOAT
          units: B
          description: 'Used memory of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: AVG
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_memory_memused
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: memory
        - uuid: 0d85019d344249539d6a1d38c6f235c8
          name: 'Swap: Space utilization'
          type: CALCULATED
          key: proxmox.otlp.node.swap.pused
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          value_type: FLOAT
          units: '%'
          params: 'last(//proxmox.otlp.node.swap.used) / (last(//proxmox.otlp.node.swap.total) + (last(//proxmox.otlp.node.swap.total) = 0)) * 100'
          description: 'Used swap space of the Proxmox VE node, in percent of the total swap space. Reports 0 if the node has no swap configured.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 25d81ce454c04fd09c7d59e592b3aafd
              expression: 'min(/Proxmox VE by OTLP/proxmox.otlp.node.swap.pused,5m) > {$PROXMOX.OTLP.SWAP.PUSED.MAX.WARN}'
              name: 'Proxmox VE: High swap space usage'
              event_name: 'Proxmox VE: High swap space usage (over {$PROXMOX.OTLP.SWAP.PUSED.MAX.WARN}% used for 5m)'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                The used swap space of the node has stayed above {$PROXMOX.OTLP.SWAP.PUSED.MAX.WARN}% of the total swap space for the last 5 minutes.
                If the node has no swap configured, this trigger is never fired.
              dependencies:
                - name: 'Proxmox VE: Low available memory'
                  expression: 'max(/Proxmox VE by OTLP/proxmox.otlp.node.mem.pavail,5m) < {$PROXMOX.OTLP.MEM.PAVAIL.MIN.WARN}'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 1aad54d276b24ee6a1a26292971a2d0d
          name: 'Swap: Total'
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.swap.total
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          units: B
          description: 'Total swap space of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_memory_swaptotal
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: memory
        - uuid: 31bace043da24308be02fc5ca8912cfb
          name: 'Swap: Used'
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.swap.used
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          value_type: FLOAT
          units: B
          description: 'Used swap space of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: AVG
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_memory_swapused
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: memory
        - uuid: f144f0456b6848939ac434dd83c9edfc
          name: Uptime
          type: TELEMETRY_QUERY
          key: proxmox.otlp.node.uptime
          delay: '{$PROXMOX.OTLP.INTERVAL}'
          units: uptime
          description: 'Uptime of the Proxmox VE node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$PROXMOX.OTLP.TIME_SHIFT}'
          lookback_limit: 10m
          granularity: 1m
          query:
            signal_type: METRICS
            metric_point_type: GAUGE
            aggregated_columns:
              - function: MAX
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: proxmox_node_uptime
                - column: ServiceName
                  value: proxmox-ve
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: d796d534afaf4d92abab8743f37b1fc9
              expression: 'last(/Proxmox VE by OTLP/proxmox.otlp.node.uptime) < 10m'
              name: 'Proxmox VE: Node has been restarted'
              event_name: 'Proxmox VE: Node has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The uptime of the Proxmox VE node is less than 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
            - uuid: e534fcf530994c0689f42f625c4e33a8
              expression: 'nodata(/Proxmox VE by OTLP/proxmox.otlp.node.uptime,{$PROXMOX.OTLP.NODATA.TIMEOUT}) = 1'
              name: 'Proxmox VE: No telemetry data received'
              event_name: 'Proxmox VE: No telemetry data received (for {$PROXMOX.OTLP.NODATA.TIMEOUT})'
              priority: AVERAGE
              description: |
                No values of the node uptime metric have arrived from the telemetry backend for {$PROXMOX.OTLP.NODATA.TIMEOUT}.
                Check the metric server in Proxmox VE, the OTLP collector, the ClickHouse exporter and the `TelemetryProvider` setting of Zabbix server or proxy.
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: class
          value: software
        - tag: target
          value: proxmox-ve
      macros:
        - macro: '{$PROXMOX.OTLP.CPU.IOWAIT.MAX.WARN}'
          value: '20'
          description: 'Maximum share of CPU time spent waiting for I/O, in percent of the total CPU capacity of the node, for the warning trigger.'
          config:
            type: TEXT
            priority: '6'
            section_name: Thresholds
            label: 'CPU iowait threshold'
            description: 'Maximum share of CPU time spent waiting for I/O, in percent of the total CPU capacity of the node, for the warning trigger. In the range from 1 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.CPU.UTIL.MAX.WARN}'
          value: '90'
          description: 'Maximum CPU utilization of the node, in percent, for the warning trigger.'
          config:
            type: TEXT
            priority: '1'
            section_name: Thresholds
            label: 'CPU utilization threshold'
            description: 'Maximum CPU utilization of the node, in percent, for the warning trigger. In the range from 1 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.FS.INODE.PUSED.MAX.WARN}'
          value: '90'
          description: 'Maximum used inodes of the root filesystem, in percent, for the warning trigger.'
          config:
            type: TEXT
            priority: '4'
            section_name: Thresholds
            label: 'Root filesystem inode threshold'
            description: 'Maximum used inodes of the root filesystem, in percent, for the warning trigger. In the range from 1 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.FS.PUSED.MAX.WARN}'
          value: '90'
          description: 'Maximum used space of the root filesystem, in percent, for the warning trigger.'
          config:
            type: TEXT
            priority: '3'
            section_name: Thresholds
            label: 'Root filesystem space threshold'
            description: 'Maximum used space of the root filesystem, in percent, for the warning trigger. In the range from 1 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.INTERVAL}'
          value: 1m
          description: 'Update interval of the Telemetry query and calculated items. The aggregation bucket (granularity) of the Telemetry query items stays fixed at 1 minute, so the interval should be a multiple of 1 minute.'
          config:
            type: TEXT
            priority: '8'
            label: 'Update interval'
            description: 'Update interval of the Telemetry query and calculated items, with a time suffix. Use a multiple of 1 minute.'
            regex: '^[0-9]+[smhd]$'
        - macro: '{$PROXMOX.OTLP.LOAD_AVG_PER_CPU.MAX.WARN}'
          value: '1.5'
          description: 'Maximum 1-minute load average per CPU of the node for the average trigger.'
          config:
            type: TEXT
            priority: '5'
            section_name: Thresholds
            label: 'Load average per CPU threshold'
            description: 'Maximum 1-minute load average per CPU of the node for the average trigger. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.MEM.PAVAIL.MIN.WARN}'
          value: '10'
          description: 'Minimum available memory of the node, in percent, for the warning trigger.'
          config:
            type: TEXT
            priority: '2'
            section_name: Thresholds
            label: 'Available memory threshold'
            description: 'Minimum available memory of the node, in percent, for the warning trigger. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.NODATA.TIMEOUT}'
          value: 30m
          description: 'Time period without telemetry values after which the availability trigger fires.'
          config:
            type: TEXT
            priority: '10'
            section_name: Thresholds
            label: 'Telemetry no-data timeout'
            description: 'Time period without telemetry values after which the availability trigger fires, with a time suffix.'
            regex: '^[0-9]+[smhd]$'
        - macro: '{$PROXMOX.OTLP.SWAP.PUSED.MAX.WARN}'
          value: '50'
          description: 'Maximum used swap space of the node, in percent, for the warning trigger.'
          config:
            type: TEXT
            priority: '7'
            section_name: Thresholds
            label: 'Swap space threshold'
            description: 'Maximum used swap space of the node, in percent, for the warning trigger. In the range from 1 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$PROXMOX.OTLP.TIME_SHIFT}'
          value: 15s
          description: 'Time shift of the processing window of the Telemetry query items. Increase it if the OTLP collector writes metrics into ClickHouse with a delay.'
          config:
            type: TEXT
            priority: '9'
            label: 'Telemetry time shift'
            description: 'Time shift of the processing window of the Telemetry query items, with a time suffix.'
            regex: '^[0-9]+[smhd]$'
  triggers:
    - uuid: f1d3baf8b18c46a99e7fcd871a108f15
      expression: |
        min(/Proxmox VE by OTLP/proxmox.otlp.node.cpu.load1,5m) / last(/Proxmox VE by OTLP/proxmox.otlp.node.cpu.count) > {$PROXMOX.OTLP.LOAD_AVG_PER_CPU.MAX.WARN}
        and last(/Proxmox VE by OTLP/proxmox.otlp.node.cpu.load5) > 0
        and last(/Proxmox VE by OTLP/proxmox.otlp.node.cpu.load15) > 0
      name: 'Proxmox VE: Load average is too high'
      event_name: 'Proxmox VE: Load average is too high (per CPU load over {$PROXMOX.OTLP.LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
      opdata: 'Load averages (1m 5m 15m): ({ITEM.LASTVALUE1} {ITEM.LASTVALUE3} {ITEM.LASTVALUE4}), number of CPUs: {ITEM.LASTVALUE2}'
      priority: AVERAGE
      description: 'The 1-minute load average per CPU of the node has stayed above {$PROXMOX.OTLP.LOAD_AVG_PER_CPU.MAX.WARN} for the last 5 minutes and the 5- and 15-minute load averages are not zero.'
      tags:
        - tag: scope
          value: capacity
        - tag: scope
          value: performance
